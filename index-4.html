 {"type": "p", "text": "لما رآه قائد الجند قال له في نظرة حازمة:"}, {"type": "p", "text": "لم نشأ أن نأخذك من المسجد وسط تلاميذك يا شيخ، فقد رأينا أن ذا منافٍ للأدب."}, {"type": "p", "text": "فرد عليه قائلًا:"}, {"type": "p", "text": "ونعم الأدب يا سيد الجند"}, {"type": "p", "text": "ثم أمر الجنود لكي يأخذوه إلى مركز القضاء."}, {"type": "p", "text": "على الجانب الآخر نجد أرسلان قد عاد إلى منصور ثم أخبره بذلك الشيخ وما كان من حديثه، فلما أخبره بصفاته ابتهج لشيء كهذا وقال لأرسلان:"}, {"type": "p", "text": "إذا كنا من الغد فخذنا إليه ودلنا على مسجده وبيته."}, {"type": "p", "text": "تفكر أرسلان قليلًا ثم أخبره بالذي حدث معه، فقال له منصور:"}, {"type": "p", "text": "ولماذا يقبضون عليه؟ ما الذي فعله؟!"}, {"type": "p", "text": "فقال له أرسلان:"}, {"type": "p", "text": "لا أدري، ولكن أعتقد أن الأمر له علاقة بما يلقيه من دروس في مسجده."}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "وما طبيعة الدروس؟!"}, {"type": "p", "text": "فرد عليه أرسلان وقال:"}, {"type": "p", "text": "أحسب أن لها علاقة بالأمور السياسية وتكشف عن مخططات لدول عظمى."}, {"type": "p", "text": "ها قد ودع هذان الرجلان اللذان كانا مع منصور وأرسلان وذهبا لتجارتهما، فقد كانا تاجرين من بلاد الشام وبالتحديد من سوريا."}, {"type": "p", "text": "لقد مر يوم كامل والشيخ علاء الدين منتظر لإطلاق سراحه، وزوجته جوهر تنتظره خارج غرفة التحقيق."}, {"type": "p", "text": "لما انقضى الأمر خرج فأمسك بيدها ثم ذهبا للمنزل."}, {"type": "p", "text": "وبعد يوم طويل وبعد المغرب قبيل صلاة العشاء كانا جالسين يتناولان الطعام فافتتحت جوهر موضوع مركز المقاطعة وسألت عن ما جرى"}, {"type": "p", "text": "فأجابها قائلًا:"}, {"type": "p", "text": "لا شيء، لا تزعجي نفسك."}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "كيف؟! أفلا أعرف عنك ما حدث؟! ألست زوجتك؟!"}, {"type": "p", "text": "فقال لها:"}, {"type": "p", "text": "لما وصلت للمركز ودخلت غرفة التحقيق جاءني ضابط وسألني عدة أسئلة من ضمنها:"}, {"type": "p", "text": "هل لك علاقة بأي طائفة أو تنتمي لمذهب، أو تنظيم سياسي أو حزبي؟"}, {"type": "p", "text": "فأجبته قائلًا:"}, {"type": "p", "text": "طيلة مدة حياتي في مسجدي هذا لم يعرف عني الناس شيئًا مما تقول، وإن لم تكن مصدقًا فسل من تشاء من رواده."}, {"type": "p", "text": "فقال الضابط:"}, {"type": "p", "text": "تعرف أيًا من الجهات العليا أو الدولية أو تعرف حقائق قد تكون مثلًا مصدر خطر لأحد؟!"}, {"type": "p", "text": "فأجاب علاء الدين:"}, {"type": "p", "text": "أنا يا سيدي فلا أتحدث في ما يخص السياسة ولا يعنيني أمرها؛ وكل ما أذكره فهو من كتاب الله وسنة نبيه صلى الله عليه وسلم، فهل في كتاب الله والسنة ما يهدد أحدًا؟!!"}, {"type": "p", "text": "فقال الضابط:"}, {"type": "p", "text": "من المؤكد لا."}, {"type": "p", "text": "ثم طرأت لحظات من التفكير وهو ينظر إلي علاء ويرمقه بعيون حادة مكتوب عليها تساؤلات عدة، ثم أردف قائلًا:"}]}, {"id": 47, "title": "نبوءة دابق (2/3)", "section": "story", "paras": [{"type": "p", "text": "ما هذا الكلام الذي كنت تحدث الناس به؟ هل لديك مخطط؟"}, {"type": "p", "text": "فرددت عليه بأن ما أقوله هو علم شرعي ولكني أحاول إسقاطه على الواقع لكي يفهم الناس وما أظن أنه يؤذي سياسة الدولة."}, {"type": "p", "text": "وانتهى التحقيق على ذلك وتم تركي أذهب عندما لم يجدوا دليلًا واضحًا يدينني إلا كلامًا لا يسمن من جوع."}, {"type": "p", "text": "المسجد الكبير"}, {"type": "p", "text": "لقد عاد الشيخ علاء للمسجد في صلاة العشاء ثم جلس بعد أن صلى وافتتح بالحمد والثناء على الله ثم شرع في إكمال دروسه غير عابئ بأحد. ثم لما أنهى مقدمات الملحمة شرع في أحداثها:"}, {"type": "p", "text": "أحداث دابق"}, {"type": "p", "text": "نزول الروم بالأعماق^59"}, {"type": "p", "text": "فقد أخرج مسلم في صحيحه عن أبي هريرة، أن رسول الله صلى الله عليه وسلم، قال: لا تقوم الساعة حتى ينزل الروم بالأعماق أو بدابق، فيخرج إليهم جيش من المدينة، من خيار أهل الأرض يومئذ، فإذا تصافوا، قالت الروم: خلوا بيننا وبين الذين سبوا منا نقاتلهم، فيقول المسلمون: لا، والله لا نخلي بينكم وبين إخواننا، فيقاتلونهم، فينهزم ثلث لا يتوب الله عليهم أبدًا، ويقتل ثلثهم، أفضل الشهداء عند الله، ويفتتح الثلث، لا يفتنون أبدًا فيفتتحون قسطنطينية، فبينما هم يقتسمون الغنائم، قد علقوا سيوفهم بالزيتون."}, {"type": "p", "text": "إذ صاح فيهم الشيطان: إن المسيح قد خلفكم في أهليكم، فيخرجون، وذلك باطل، فإذا جاءوا الشام خرج، فبينما هم يعدون للقتال، يسوون الصفوف، إذ أقيمت الصلاة، فينزل عيسى ابن مريم صلى الله عليه وسلم، فأمهم، فإذا رآه عدو الله، ذاب كما يذوب الملح في الماء، فلو تركه لانذاب حتى يهلك، ولكن يقتله الله بيده، فيريهم دمه في حربته."}, {"type": "p", "text": "يتحدث الحديث ها هنا عن الملحمة الكبرى والصدام القادم لا محالة بين قوتين، بين الحق والباطل، بين الخير والشر، بين المسلمين والروم في آخر الزمان."}, {"type": "p", "text": "إذ يأتي جيش الروم فينزل في مكان يسمى بالأعماق، والعمق ما يبعد من أطراف المفاوز؛ فليس الأعماق اسم جمع هنا ولكنه اسم موضع معين في أطراف المدينة، فينزل فيه الروم استعدادًا للحرب."}, {"type": "p", "text": "وهناك موضع آخر مذكور في الحديث وهو «دابق» وهو موضع معروف بحلب، فربما ذكر الموضعين هنا شك من الراوي في أي موضع نزل الروم ولكنهما موضعان."}, {"type": "p", "text": "ها قد وصل جيش الروم إلى دابق، وأن المسلمون ليسمعنَّ أصوات حوافر الخيول تضرب في الأرض، وكان المسلمون بالمدينة ببيت المقدس، ولكنهم خرجوا حتى وصلوا حلب."}, {"type": "p", "text": "فيخرج إليهم جيش المسلمين من المدينة، وقيل أن المكان الذي وصل المسلمون إلي دمشق، وذلك كما جاء في الحديث، والمدينة النبوية يومئذ خراب ولكنها آمنة."}, {"type": "p", "text": "فيخرج جيش المسلمين وهم يومئذ من خيار أهل الأرض، فإذا تواجه الفريقان ووصل كل فرق أمام الآخر وذلك بعد الاشتباكات بين بضع الفرق في الصفين فقتل من قتل، فاجتمعوا بأكثرهم وكان كل فرق كالطود العظيم."}, {"type": "p", "text": "فلما اصطفوا وسكن الجيشان قال قائل من الروم:"}, {"type": "p", "text": "خلوا بيننا وبين الذين سبوا منا.."}, {"type": "p", "text": "ويدل ذلك على القتال الذي كان قبلًا، فلقد أسر المسلمون في بعض المعارك من جنود جيش الروم عددًا من الجيش، وهذا العدد قد أسلم واتبع جيش المسلمين. فلما كان كذلك رأى الروم أنهم لا يريدون قتال المسلمين، إنهم أرادوا هؤلاء الذين فارقوهم، يريدون قتالهم فقالوا اتركوهم لنا وما لنا بكم شأن."}, {"type": "p", "text": "وهذا دأبهم فهم يحاولون تفريق وتقطيع أوصال جيش المسلمين ليسهل عليهم بعدها قتالهم؛ فالعود الواحد هين والجمع بالجمع ثقال ومجهدة، وهم دائمًا دأبهم التفريق بين المؤمنين."}, {"type": "p", "text": "أو هم يريدون أولئك الذين غزوا بلادهم، فسبوا ذريتهم، فيقول المسلمون:"}, {"type": "p", "text": "لا والله لا نخلي بينكم وبين إخواننا."}, {"type": "p", "text": "فيقاتلونهم؛ وتشتد وطأة الحرب في البداية على المسلمين حتى انهزم ثلث وفروا من المعركة، وهذا لضعف الإيمان؛ فهذا الثلث لا يتوب الله عليهم أبدًا، كناية عن موتهم على الكفر."}, {"type": "p", "text": "فلما اشتبكت الجهتان في أول يوم كانت الغلبة للروم، فيفر ثلث جيش المسلمين وهؤلاء لن يتوب الله عليهم أبدًا كما ذكر في الأحاديث؛ فذلك موقف عظيم، لا بد للثبات فيه وعدم التولي يوم الزحف؛ فهو معدود من الموبقات السبع التي ذكرت في الأحاديث."}, {"type": "p", "text": "ثم يبقى ثلثي الجيش فيحاربون الروم محاربة عادلة، لا ينهزم أي الجيشين، ويستمر على نفس الحال لمدة ثلاثة أيام، وهناك بعض من فرق جيش المسلمين تشترط شرطة للموت في كل يوم أي تشترط على نفسها ألا ترجع حتى تنتصر أو تموت."}, {"type": "p", "text": "فكانوا كلما جن الليل والعتمة اجتمعوا فقالوا:"}, {"type": "p", "text": "سنقاتلهم ولا نرجع، وما هي إلا الحسنيين؛ النصر أو الشهادة."}, {"type": "p", "text": "فرد رجل من الجند فقال:"}, {"type": "p", "text": "نعم والله إما أن نموت في سبيل الله فننال الشهادة والدرجة العليا..."}, {"type": "p", "text": "فتلقف بقيتها منه رجل ثانٍ قائلًا:"}, {"type": "p", "text": "وإمّا نصر من الله يبلغنا إياه، فتكون لنا الغلبة."}, {"type": "p", "text": "وأردف آخر:"}, {"type": "p", "text": "وعندها يفتح الله علينا الأرض والخير وننعم أبدًا إن شاء الله."}, {"type": "p", "text": "وفي كل يوم كانت تفنى تلك الفرقة التي اشترطت على نفسها ذلك الشرط ولكن الجيشين لم ينهزم أي منهما بعد باستثناء تلك الأعداد التي تتناقص من جيش المسلمين."}, {"type": "p", "text": "ها قد أطل الصباح بنوره والسماء بزرقتها والسحاب الغائم في الأرجاء الذي يحمل معه بشارات النصر والعز، فذلك يوم مشهود وذلك يوم الملحمة التي قدرها الله على أولئك الجمع من المسلمين، ذلك الجند المتبقي من جنود الحق في وجه الباطل."}, {"type": "p", "text": "قد صلى المسلمون الفجر وعزموا على الذهاب وكلهم استبشار ويقين في الله بأن النصر قادم لا محالة وإن طال وطال معه الضعف والوهن، ولكن الله كرم هؤلاء بأن جعلهم خير الفوارس على ظهر الأرض يومئذ."}, {"type": "p", "text": "وفي اليوم الرابع انطلق المسلمون متوكلين على الله، ولا يرجون إلا أحد الهدفين إما النصر أو الشهادة."}, {"type": "p", "text": "حتى أتوا أرض القتال ولقيهم أعداء الله اشتد القتال، ثم يفتح الله على ذلك الجزء المتبقي من جيش المسلمين ويحدث النصر الكبير؛ نصر كاسح، وفيه يستشهد ثلث آخر من جيش المسلمين، فلا يبقى إلا ثلث واحد، وهذا الثلث يفتح الله عليه، ويذهب للقسطنطينية."}, {"type": "p", "text": "فلا يبتلون ببلية أو لا يمتحنون بمقاتلة أو لا يعذبون أبدًا؛ وذلك فيه إشارة لحسن خاتمتهم."}, {"type": "p", "text": "فماذا سيحدث؟ وماذا سيفعل المسلمون عندما يتوجهون إليها؟ هل تنتظرهم ملحمة أخرى، أم ستكون النتائج كما المتوقع؟!"}, {"type": "p", "text": "كل ذلك سنعرفه في ما هو قادم عزيزي القارئ فخذ قسطًا من الراحة ثم استأنف الملحمة، وكما العادة لا تنسَ مشروبك المفضل، وأعرف أنك ربما في ذهنك تتساءل: ما عساه في كل مرة يذكرني بما أشرب؟!!"}, {"type": "p", "text": "سأقول لك عزيزي القارئ بالطبع لا أبغي أن تفيد صاحب البقالة، وتشتري ما لديه من مساحيق الشراب؛ ولكن لتعلم أمرًا، فكما كنت أنا أشرب القهوة وأنا أكتب لك كلماتي تلك، حتى أكون في ذهن صافٍ؛ أردت لك ما أردته لنفسي."}, {"type": "p", "text": "المهم تناول ما تشاء في الوقت الذي تشاء، فأنت سيد الموقف ها هنا على أرض تلك الرواية والمتحكم في الأحداث؛ فإذا كنت تفضل القراءة وبجانبك مشروبك المفضل أثناء القراءة فافعل."}, {"type": "p", "text": "وتناول ما تشاء ولكن حسبك والمقاطعة؛ فإن لك إخوة ما زالوا يعانون، فلتدعُ الله لهم، أو ما زالوا يقتلون، فترحم عليهم."}, {"type": "p", "text": "وذات صباح في يوم هادئ لقد انقشع الغمام وأخذ معه بعضًا من الشر والفتن ليأتي شيء من السلام، فيمضي هؤلاء الثلث الباقي من الجيش بعد قتال مع الروم لمدة أربعة أيام؛ ثم يمضون بهذا النصر إلى مدينة القسطنطينية؛ وهي الآن تركيا."}, {"type": "p", "text": "نعم تركيا الآن هي في أيدي المسلمين ولكن تضارب الأحداث وسرعتها تجعل الأمور تتقلب؛ فهي الآن في أيدي المسلمين ولكن بعد نشوب الاشتباكات وربما المعارك الكثيرة بين المسلمين والروم تسقط في أيديهم مرة ثانية."}, {"type": "p", "text": "لقد انتصر المسلمون في هذه الملحمة الكبرى أعظم حرب في التاريخ، ينتصر المسلمون على قلة عددهم ثم يتوجهون إلى القسطنطينية لفتحها، ولكنه بفضل الله كان فتحًا ميسرًا بعون الله وذلك كما ورد في الحديث الذي رواه أبو هريرة في صحيح مسلم:"}]}, {"id": 48, "title": "نبوءة دابق (3/3)", "section": "story", "paras": [{"type": "p", "text": "عن أبي هريرة، أن النبي صلى الله عليه وسلم، قال:"}, {"type": "p", "text": "«سمعتم بمدينة جانب منها في البر وجانب منها في البحر»؟ قالوا: نعم، يا رسول الله. قال: \"لا تقوم الساعة حتى يغزوها سبعون ألفا من بني إسحاق، فإذا جاءوها نزلوا، فلم يقاتلوا بسلاح ولم يرموا بسهم، قالوا: لا إله إلا الله والله أكبر، فيسقط أحد جانبيها -"}, {"type": "p", "text": "قال ثور: لا أعلمه إلا قال - الذي في البحر، ثم يقولون الثانية: لا إله إلا الله والله أكبر، فيسقط جانبها الآخر، ثم يقولون الثالثة: لا إله إلا الله والله أكبر، فيفرج لهم، فيدخلوها فيغنموا، فبينما هم يقتسمون المغانم، إذ جاءهم الصريخ، فقال: إن الدجال قد خرج، فيتركون كل شيء ويرجعون\"،"}, {"type": "p", "text": "فكما في الحديث الشريف يذكر النبي أنهم سوف يفتحون القسطنطينية بغير سلاح؛ بذكر الله عز وجل وهذا فضل عظيم من الله، وذكر أيضًا أن الذين سيفتحونها ليسوا من العرب بل هم ممن أسلم من بني إسحاق، ولعل المراد بهم أكراد الشام، وقيل يحتمل أن يكون معهم غيرهم من بني إسماعيل من العرب أو غيرهم من المسلمين، ولكن في الحديث اقتصر على ذكر بني إسحاق لأنهم الأغلب يومئذ في هذه الفئة التي ستذهب لفتح القسطنطينية."}, {"type": "p", "text": "الأرض مليئة بالقتلى، جثث في كل مكان، حرب قاسية أودت بالكثير، ملحمة كبرى؛ موت يأخذ في الناس كداء الغنم، لقد غرقت السيوف في سيول من الدماء، هيئة المكان توحي بالرعب، لقد فني عداد من البشر ولشدة المقتلة إذا مر الطائر فوق المعركة لا يخرج من سمائها حتى يخر ساقطًا لشدة القتل والجثث والرائحة."}, {"type": "p", "text": "ها قد انتهى المسلمون من الانتصار على الروم وقد استعدوا للذهاب لفتح القسطنطينية؛ فيخرج سبعون ألفًا من بني إسحاق."}, {"type": "p", "text": "فإذا جاءوا المدينة نزلوا حولها، وقد حاصروا أهلها ممن بقي من الروم، فلم يقاتلوا بسلاح، ولم يرموا بسهم."}, {"type": "p", "text": "ولكنهم يقولون:"}, {"type": "p", "text": "لا إله إلا الله والله أكبر."}, {"type": "p", "text": "فيسقط أحد طرفي سور المدينة، والسور الذي سقط كما جاء في الحديث هو الذي في البحر، فالسور الذي سيسقط أولًا هو من جانب البحر."}, {"type": "p", "text": "ثُمَّ يقولُ المُسلِمونَ في المرَّةِ الثَّانيةِ:"}, {"type": "p", "text": "«لا إلَهَ إلَّا اللهُ، واللهُ أكبرُ»،"}, {"type": "p", "text": "فيَسَقَطُ جانِبُها الآخرُ الَّذي في البَرِّ.ويَقولونَ الثَّالثةَ:"}, {"type": "p", "text": "«لا إِلَهَ إلَّا اللهُ، واللهُ أَكبرُ»."}, {"type": "p", "text": "فيُفتحُ لَهم فيَدخلونَها فيَغنَمون مِن أموال تلكَ البلدةِ."}, {"type": "p", "text": "فبيْنَما هُم على حالٍ يَقتَسِمونَ فيها المَغانِمَ، وقد علقوا سيوفهم بالزيتون"}, {"type": "p", "text": "ثم فجأة وهم على حالهم تلك جاءَهمُ الصَّريخُ، وهو المُنادي المسْتغيثُ والمحذِّرُ لهم: فَيقولُ وهو الشيطان بصوت صائح رفيع:"}, {"type": "p", "text": "«إنَّ الدَّجَّالَ قدْ خَرجَ»."}, {"type": "p", "text": "أي أنه قد خرج في أهلِيهم وذَرارِيِّهم، وقام مقامهم، فيَتركونَ كلَّ شيءٍ منَ المَغانِم وغَيرِها ويَرجِعونَ سريعًا لمُقابلةِ الدَّجَّالِ، ومُساعدةِ الأَهلِ والعِيالِ."}, {"type": "p", "text": "فيكون الدجال قد خرج وفك قيده كما علمنا من قبل لو تتذكر عزيزي القارئ عندما سمعنا حديث الصحابي الجليل تميم الداري الذي قابل الدجال في تلكم الجزيرة."}, {"type": "p", "text": "فها هو الآن قد خرج؛ والدجال هو مِن الدَّجلِ وهو الغطاء أي أنه يُغطِّي الحَقَّ بباطِلِه، وهو شَخصٌ مِن بني آدَمَ، يَدَّعي الأُلوهيَّةَ، وظُهورُه مِن العلاماتِ الكُبرى ليَومِ القِيامةِ، يَبتَلي اللهُ به عِبادَه. وأَقْدَره على أشياءَ مِن مَقدوراتِ اللهِ تعالى:"}, {"type": "p", "text": "مِن إحياءِ الميِّتِ الَّذي يَقتُلُه، ومِن ظُهورِ زَهرةِ الدُّنيا والخِصْبِ معه، وجَنَّتِه ونارِه، ونَهْرَيْهِ، واتِّباعِ كُنوزِ الأرضِ له، وأمْرِه السَّماءَ أنْ تُمطِرَ فتُمطِرَ، والأرضَ أنْ تُنبِتَ فتُنبِتَ؛ فيَقَعُ كلُّ ذلك بقُدرةِ الله تعالَى ومَشيئتِه."}, {"type": "p", "text": "فلما جاءهم هذا الأمر الهائل وهذا النبأ العظيم الذي هو أكبر من حربهم التي فرغوا منها، توجهوا تلقاء الدجال لقتاله وحماية أهلهم."}, {"type": "p", "text": "فيخرج طليعة من المدينة من قسطنطينية، عشرة فوارس، ليطَّلِعُوا على نبأ الدجال قبل خروج الجيش وراءهم لكي يخبرونهم بحقيقة النبأ. وقد جاء في الحديث الشريف عن هؤلاء الفوارس العشرة:"}, {"type": "p", "text": "فقال رسولُ اللهِ صَلَّى اللهُ عليه وسلَّمَ: إنِّي لَأعرِفُ أسماءَهم، وأسماءَ آبائِهم، وألْوانَ خُيولِهم، هم خَيرُ فوارسَ على الأرضِ يومئذٍ، أو قال: هم مِن خَيرِ فوارسَ على ظَهْرِ الأرضِ يومئذٍ."}, {"type": "p", "text": "فالرسول صلى الله عليه وسلم يعلم أسماء العشرة وآباءهم، وألوان الخيول التي يركبونها خروجًا لمعرفة نبأه."}, {"type": "p", "text": "لما فرغ الشيخ علاء الدين من درس اليوم اعتذر عن الإطالة عليهم اليوم عن العادة؛ والأمر أنه يريد أن ينتهي من دروس الملاحم مسرعًا ليعلم الناس حقيقة هذه الملاحم لكي يتقي الإنسان ويعتصم من تلك الفتن، قبل أن يحدث مكروه له فلا يستطيع معه سبيلًا لأن يبلغ رسالته."}, {"type": "p", "text": "كان أرسلان ومنصور بالمسجد ولكنهما أتيا متأخرين فلم يسمعا كل ما قال الشيخ غير آخر جزء من الدرس، ولما انتهوا خرجوا من المسجد فقال منصور لأرسلان"}, {"type": "p", "text": "هل تعرف منزل الشيخ علاء الدين؟"}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "لقد أخبرت ذلك من قبل ولكني لا أعرف الطريق بالضبط."}, {"type": "p", "text": "فقال منصور:"}, {"type": "p", "text": "دعنا نذهب كما تعرف ولإن أخطأنا الطريق لنسأل عنه الناس وإن شاء الله ندرك الشيخ."}, {"type": "p", "text": "ذهبا من الطريق التي يعرفها أرسلان ولكنه تحير قليلًا لما رأى طريقين متفرعين عندها قال له منصور"}, {"type": "p", "text": "دعنا نسأل عن بيته."}, {"type": "p", "text": "ظلا واقفين حتى نظرا رجلا من بعيد فأقبلا وراءه، لحقا به ثم سأل منصور"}, {"type": "p", "text": "أين يسكن الشيخ علاء الدين؟"}, {"type": "p", "text": "فقال الرجل:"}, {"type": "p", "text": "ممن القوم؟"}, {"type": "p", "text": "رد عليه أرسلان:"}, {"type": "p", "text": "نحن من شمال تركيا من أنقرة."}, {"type": "p", "text": "رحب بهما الرجل بترحيب كبير ثم أخبرهما أن بيته في هذا الطريق على ناحية اليمين بعد الصخرة الكبيرة."}, {"type": "p", "text": "كان علاء الدين جالسًا يتناول طعام العشاء وبينما هو كذلك إذ طُرق الباب فقام وفتح وإذا به يرى منصور، هذا اللقاء الذي بات منتظرًا لوقت طويل لقاء طالت علية الليالي والأيام، عندها ابتهج منصور لما رآى الشيخ واحس بأبتهاج وراحة نفس وشعر بانه يعرف الشيخ كأنة قابلة كثيرا وتحدث معه قبل ذلك، وكان الشيخ علاء الدين يشعر بأن منصور معروف ومألوف له، لدرجة انه وقع في نفسه ان الاشارة التي تأتية في منامه تخص منصور. فرحب بهما ثم قال في ود:"}, {"type": "p", "text": "-تفضلا بالدخول."}, {"type": "p", "text": "=أعزك الله مولانا، بارك الله فيكم."}, {"type": "p", "text": "لما دخلا البيت طلب منهما الجلوس ثم استأذن لدقائق وبعدها عاد وفي يده مشروب الضيافة وبعض من حلوى «السوتلاش»^60. ولما جلس بين يديهما عرفهما بنفسه بعد أن عرف من هما ومن أي البلاد أتيا."}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "لا أدري يا شيخ ويكأني أعرفك من فترة كبيرة، وقد كنت عازمًا على تغيير حياتي للأفضل بعدما كنت في اهتمام بالدنيا وبالتجارة، فقررت ترك تلك البيئة لكي أتوجه إلى هنا وقد حثني على ذلك شيخي النرودي، وكنت أشعر بانجذاب كبير لتلك البلد وقد تذكرت قول شيخي عندما أخبرني بأن في قونيا شيوخ كثيرة أجلاء سوف يمهدون لك الطريق من بعدي."}, {"type": "p", "text": "ثم في منتصف الكلام تنبه الشيخ علاء الدين وسأل عن الشيخ النارودي فقال: كيف حال الشيخ النارودي؟!"}, {"type": "p", "text": "رد عليه منصور في بهجة تخالطها الاستفهامات:"}, {"type": "p", "text": "وهل تعرف الشيخ؟"}, {"type": "p", "text": "نعم فقد تتلمذنا نحن الاثنين على يد بعض من شيوخ مدينة إسطنبول، وكانت تجمعنا سنوات وذكريات جميلة؛ فكيف هو الآن؟"}, {"type": "p", "text": "رد منصور في نبرة حزينة:"}, {"type": "p", "text": "لقد توفي منذ مدة قبيل مجيئي إلى هنا."}, {"type": "p", "text": "قال الشيخ في حزن:"}, {"type": "p", "text": "لا حول ولا قوة إلا بالله، إنا لله؛ وإنا إليه راجعون."}, {"type": "p", "text": "ثم بعد أن انتهوا من التعارف سأل منصور وقال للشيخ:"}, {"type": "p", "text": "قد سمعناك تحدث الناس عن أحداث الساعة وتحدثت عن كلام ما سمعته أذني قبل ذلك عن الملحمة الكبرى فما قصتها؟!"}, {"type": "p", "text": "فرد الشيخ قائلًا:"}, {"type": "p", "text": "إن للحديث إطالة، فلتنزلا ضيوفًا عندي اليوم وأخبركما بكل ما ورد عن الملحمة الكبرى إن شاء الله."}, {"type": "p", "text": "أخذ الشيخ يخبرهما بما جاء عن أحداث الملاحم ونهاية العالم وقد قص عليهما ما كان يذكره في المسجد ثم أكمل من حيث توقف:"}]}, {"id": 49, "title": "خروج الدجال", "section": "story", "paras": [{"type": "p", "text": "\"بدء ظهوره من أصبهان، من حارة منها يقال لها اليهودية، وينصره من أهلها سبعون ألف يهودي، عليهم الأسلحة والتيجان، وهي الطيالسة الخضراء، وكذلك ينصره سبعون ألفًا من التتار، وخلق من أهل خراسان."}, {"type": "p", "text": "فيظهر أولًا في صورة ملك من الملوك الجبابرة، ثم يدعي النبوة، ثم يدعي الربوبية. فيتبعه على ذلك الجهلة من بني آدم، والطغاة من الرعاعٍ والعوام، ويخالفه ويَرُدُّ عليه مَن هَدَى الله مِن عباده الصالحين وحزب الله المتقون."}, {"type": "p", "text": "يأخذ البلاد بلدًا بلدًا، وحصنًا حصنًا، وإقليمًا إقليمًا، ولا يبقى بلد من البلاد إلا وطئه بخيله ورجله غير مكة والمدينة، ومدة مقامه في الأرض أربعون يومًا يوم كسنة، ويوم كشهر، ويوم كجمعة، وسائر أيامه كأيام الناس هذه، ومعدل ذلك سنة وشهران ونصف شهر."}, {"type": "p", "text": "وقد خلق الله تعالى على يديه خوارق كثيرة يضل بها من يشاء من خلقه، ويثبت معها المؤمنين فيزدادون بها إيمانًا مع إيمانهم، وهدى إلى هداهم."}, {"type": "p", "text": "ويكون نزول عيسى بن مريم مسيح الهدى في أيام المسيح الدجال مسيح الضلالة، على المنارة الشرقية بدمشق، فيجتمع عليه المؤمنون ويلتف به عباد الله المتقون، فيسير بهم المسيح عيسى بن مريم قاصدًا نحو الدجال، وقد توجه نحو بيت المقدس، فيدركهم عند عقبة أفيق، فينهزم منه الدجال، فيلحقه عند مدينة باب لد، فيقتله بحربته وهو داخل إليها، ويقول إن لي فيك ضربة لن تفوتني، وإذا واجهه الدجال ينماع كما يذوب الملح في الماء، فيتداركه فيقتله بالحربة بباب لدّ، فتكون وفاته هناك لعنه الله، كما دلت على ذلك الأحاديث الصحاح من غير وجه\" انتهى."}, {"type": "p", "text": "فالدجال سوف يظهر أول ظهوره في أصبهان من حارة يقال لها اليهودية، وينصره من أهلها سبعون ألف يهودي، وهؤلاء اليهود هم المذكورون في حديث النبي صلى الله عليه وسلم."}, {"type": "p", "text": "يروي الحديث عن رسول الله صلى الله عليه وسلم أنس بن مالك:"}, {"type": "p", "text": "يَتْبَعُ الدَّجَّالَ مِن يَهُودِ أصْبَهانَ، سَبْعُونَ ألْفًا عليهمُ الطَّيالِسَةُ."}, {"type": "p", "text": "فاليهود أكثر ما يتبعه فهم أخبث الناس، حيث كانوا ينتظرون خروجه"}, {"type": "p", "text": "وسوف يتبعه كثير من الناس غير اليهود من أمثال التتار ومن أهل خراسان. ويتبعه من العجم والترك كذلك وأخلاط من الأعراب والنساء."}, {"type": "p", "text": "وكما جاء وصفهم في حديث أبي هريرة رضي الله عنه: \"لا تقوم الساعة حتى تقاتلوا خوزا^61 وكرمان من الأعاجم، حمر الوجوه، فطس الأنوف، صغار الأعين، كأن وجوههم المجان المطرقة^62، نعالهم الشعر\"."}, {"type": "p", "text": "وأما كون أكثر أتباعه من الأعراب، فلأن الجهل غالب عليهم، ولما جاء في حديث أبي أمامة الطويل: قوله صلى الله عليه وسلم:"}, {"type": "p", "text": "\"وإن من فتنته -- أي الدجال -- أن يقول للأعرابي: أرأيت إن بعثت لك أباك وأمك أتشهد أني ربك؟ فيقول: نعم. فيتمثل له شيطانان في صورة أبيه وأمه فيقولان: يا بني! اتبعه فإنه ربك\".."}, {"type": "p", "text": "وأما النساء فحالهن أشد من حال الأعراب، لسرعة تأثرهن، وغلبة الجهل عليهن، ففي الحديث عن ابن عمر رضي الله عنهما قال:"}, {"type": "p", "text": "قال النبي صلى الله عليه وسلم: ينزل الدجال في هذه السبخة بمرِّ قناة -- واد في المدينة -، فيكون أكثر من يخرج إليه النساء، حتى إن الرجل يرجع إلى حميمه وإلى أمه وابنته وأخته وعمته فيوثقها رباطًا مخافة أن تخرج إليه\".."}, {"type": "p", "text": "فتساءل أرسلان قائلًا:"}, {"type": "p", "text": "يعني قليلًا من الناس من سوف يعصمه الله ويكون إيمانه قويًا ولا يخرج إليه، وأن أكثر ذلك النساء خروجًا؟!"}, {"type": "p", "text": "قال الشيخ مؤكدًا:"}, {"type": "p", "text": "نعم وذلك أنهم أكثر عاطفة وخوفًا على أبنائهن فيخدعن عندما يأتي الدجال ويحسبن أن معه من الخير ما يسد الجوع ويبدل حالهن يسرًا فيخرجن إليه عطفًا على الأبناء."}, {"type": "p", "text": "والذي يتبين من الأحاديث أن قلة من الخلق من يعصمهم الله من فتنته فلا يتبعونه."}, {"type": "p", "text": "وكما ذكر الحافظ بن كثير فهو لا يدعي الألوهية في بادئ الأمر، فيظهر في صورة ملك من الملوك فيتدرج في ذلك لتصديق الناس إياه ثم يدعي أنه نبي فيصدقه الناس على ذلك حتى يدعي الربوبية."}, {"type": "p", "text": "ولا يترك الدجال مكانًا إلا وطئه فيأخذ البلاد بلدًا بلدًا إلا مكة والمدينة، فهو سيمسح الأرض كلها أي يذهب لكل مكان وذلك من ضمن الأسباب التي سمي بها المسيح ويكون ذلك في مدة 40 يومًا بمقدار سنة وشهرين ونصف الشهر؛ يوم كسنة ويوم كشهر ويوم كجمعة وسائر أيامه كأيام الناس."}, {"type": "p", "text": "-«يَأْتي المَسِيحُ مِن قِبَلِ المَشْرِقِ، هِمَّتُهُ المَدِينَةُ، حتَّى يَنْزِلَ دُبُرَ أُحُدٍ، ثُمَّ تَصْرِفُ المَلَائِكَةُ وَجْهَهُ قِبَلَ الشَّامِ، وَهُنَالِكَ يَهْلِكُ».."}, {"type": "p", "text": "يوشك المسلمون أن يحاصروا بالمدينة عندما يأتي الدجال فينزل ببعض السباخ التي تلي المدينة عند جبل أحد بأرض سبخة لا تنبت ويجعل معسكره هناك ثم يحاصر المدينة."}, {"type": "p", "text": "فالمسلمون يأتون من كل مكان حتى يتحصنوا بالمدينة عندما يسمعون أن الدجال قد ظهر، ثم يبدأوا في وضع المتاريس والأسلحة بمنطقة تسمى «سلاح» وهي قريبة من المدينة وذلك لكي يدافعوا عن المدينة لكي يقاوموا الدجال ولكنهم لن يستطيعوا فيرجعوا مرة أخرى للمدينة."}, {"type": "p", "text": "ولكن الحراسة الحقيقية للمدينة المنورة هم الملائكة وذلك كما جاء في الحديث عن أنس بن مالك في البخاري:"}, {"type": "p", "text": "عن أنس بن مالك رضي الله عنه عن النبي صلى الله عليه وسلم قال: «ليس من بلدٍ إلا ‌سَيَطَؤُه الدجال إلا مكة والمدينة، ليس له من نقابها نَقْبٌ^63 إلا عليه الملائكة صافين يحرسونها، ثم ترجف المدينة بأهلها ثلاث رجفات، فيخرج الله كل كافر ومنافق»."}, {"type": "p", "text": "فكما ذكر الحديث أن الدجال سيطأ كل مكان ولكنه غير قادر على دخول المدينة وذلك لوجود الحراسة الملائكية التي جعلها الله لهذا المكان تشريفًا له وكرامة."}, {"type": "p", "text": "وقد يكون لأن المدينة هي المكان الوحيد الذي سيكون الحصن الوحيد للمسلمين آن ذاك إذ أنهم يعلمون ذلك فيذهبون للتحصن بها، فهو يريد المدينة ربما لذلك العدد الكبير من المسلمين."}, {"type": "p", "text": "فالحراسة تكون من الملائكة حين ذاك، فليس له من أبوابها باب إلا عليه الملائكة صافين يحرسونها، فأما المسلمون عندما نصبوا معسكرهم الدفاعي عن المدينة أمام الدجال ولكنهم لم يستطيعوا الوقوف أمامه حتى رجعوا القهقرى إلى المدينة."}, {"type": "p", "text": "ثم بعدها ترجف المدينة بأهلها ثلاث رجفات، فيخرج الله كل كافر ومنافق حتى يكون فريق المسلمين إيمانًا خالصًا لا نفاق فيه أبدًا، وكفر لا إيمان فيه، فالمدينة كالكير^64 أي كالنار تنفي خبثها وينصع طيبها."}, {"type": "p", "text": "وأكثر ما يخرج إليه غير الكفار والمنافقين النساء، حتى أن الرجال يرون الناس أسهل ما يخرجون برجفات المدينة، وإن الدجال يدعوهم من خارجها ويطمعهم في الخير المكذوب الذي قد أتى به، فأكثر من يصدقه النساء فيخرجن؛ حتى أن الرجل ليرجع إلى زوجته وأمه وابنته فيوثقها رباطًا مخافة أن تخرج إليه من شدة فتنته."}, {"type": "p", "text": "ثم أردف الشيخ قائلًا:"}, {"type": "p", "text": "فالحذر الحذر من فتنة هذا الكذاب إنها الفتنة الكبرى؛ أكبر فتنة على وجه الأرض منذ أن خلقها الله، فالعقيدة هي زاد المؤمن وحصنه الحصين."}, {"type": "p", "text": "رد منصور وقال:"}, {"type": "p", "text": "نسأل أن يعصمنا من شر فتنته."}, {"type": "p", "text": "فرد أرسلان ومعه الشيخ:"}, {"type": "p", "text": "اللهم أمين نسأل الله السلامة."}, {"type": "p", "text": "ثم سأل أرسلان:"}, {"type": "p", "text": "وهل نحن على مشارف الساعة؟"}, {"type": "p", "text": "رد الشيخ مؤكدًا:"}, {"type": "p", "text": "نعم نحن قريبون جدًا من الساعة فنحن الآن في وقت ازدادت فيه الفتن والقتل وأكثر العلامات الصغرى قد ظهرت."}, {"type": "p", "text": "وقد مضى أكثر من 1400 عام والله يقول: ﴿اقتربت الساعة﴾"}, {"type": "p", "text": "ولا شك في هذه الآونة الأخيرة قد كثرت الفتن والزلازل والهرج والمعارك؛ فلا شك فهي أقرب."}, {"type": "p", "text": "وبعد أن كان متكئًا فجلس ثم استأنف الحديث:"}, {"type": "p", "text": "ها قد عسكر جند الشر بجحافله العظام، يوشك أن يقتلع رءوس كل من مر من جنباتهم حتى الطيور في الهواء، يومٌ يدق فيه ناقوس الخطر، وأيما خطر أشد من ذلك على المسلمين؛ فتنة عظيمة ابتلى الله عز وجل عباده للتمحيص، وليكون جيش الإيمان لا نفاق فيه صفًا واحدًا."}, {"type": "p", "text": "قد عسكر هؤلاء أمام المدينة يقودهم عدو الله الدجال، فإذا عسكروا"}, {"type": "p", "text": "واستعدوا ولا قدرة لهم على الدخول وإذا بهم كذلك إذ خرج إليهم رجل من المؤمنين ممتلئًا شبابًا، فيتوجه باتجاه الدجال يريد لقائه فيتلقاه بعض جنود الدجال فيقولون له:"}, {"type": "p", "text": "إلى أين تَعمِدُ؟"}, {"type": "p", "text": "فيقول:"}, {"type": "p", "text": "أعمد إلى هذا الذي خرج."}, {"type": "p", "text": "فيقولون:"}, {"type": "p", "text": "أو ما تؤمن بربنا؟"}, {"type": "p", "text": "فيقول:"}, {"type": "p", "text": "ما بربنا خفاء، فالله ليس بهذا الذي هو أعور ولا يستطيع إصلاح عوره، فكيف يكون إلهًا يصلح أمور الناس؟! فالله ليس كمثله شيء."}, {"type": "p", "text": "فيقولون:"}, {"type": "p", "text": "اقتلوه."}, {"type": "p", "text": "فيقول بعضهم لبعض:"}, {"type": "p", "text": "أليس قد نهاكم ربكم أن تقتلوا أحدًا دونه."}, {"type": "p", "text": "فيمسكونه ثم ينطلقون به إلى الدجال، فإذا رآه المؤمن قال:"}, {"type": "p", "text": "يَا أيُّهَا النَّاسُ إنَّ هذَا الدَّجَّالُ الَّذي ذَكَر رَسُولُ اللَّه صَلّى اللهُ عَلَيْهِ وسَلَّم."}, {"type": "p", "text": "لقد خدعكم هذا الكذاب، ارجعوا للإيمان بالله واتركوا هذه الدجال."}, {"type": "p", "text": "عندها يأمر الدجال به فيشبح^65 فيقول:"}, {"type": "p", "text": "خُذُوهُ وَشُجُّوهُ."}, {"type": "p", "text": "فَيُوسَعُ ظَهْرُهُ وبَطْنُهُ ضَرْبًا."}, {"type": "p", "text": "فيقولُ:"}, {"type": "p", "text": "أَوَمَا تُؤمِنُ بِي؟"}, {"type": "p", "text": "فَيَقُولُ:"}, {"type": "p", "text": "أنْتَ المَسِيحُ الْكَذَّابُ."}, {"type": "p", "text": "فَيُؤمرُ بهِ، فَيؤْشَر^66 بالمِنْشَارِ مِنْ مَفْرقِهِ حتَّى يُفْرقَ بَيْنَ رِجْلَيْهِ، ثُمَّ يَمْشِي الدَّجَّالُ بَيْنَ الْقِطْعتَيْنِ، ثُمَّ يقولُ لَهُ:"}, {"type": "p", "text": "قُمْ، فَيَسْتَوي قَائمًا، يتهلل ووجهه ضَحِك."}, {"type": "p", "text": "ثُمَّ يقولُ لَهُ:"}, {"type": "p", "text": "أتُؤمِنُ بِي؟"}, {"type": "p", "text": "فيقولُ:"}, {"type": "p", "text": "مَا ازْددتُ فِيكَ إلاَّ بصِيرةً."}, {"type": "p", "text": "ثُمًَّ ينظر الرجل المؤمن للناس فيناديهم ويَقُولُ:"}, {"type": "p", "text": "يَا أَيُّهَا النَّاسُ إِنَّهُ لاَ يفْعَلُ بعْدِي بأَحَدٍ مِنَ النَّاسِ."}, {"type": "p", "text": "فَيأخُذُهُ الدَّجَّالُ لِيَذْبَحَهُ، فَيَجْعَلُ اللَّه مَا بيْنَ رقَبَتِهِ إلَى تَرْقُوَتِهِ^67 نُحَاسًا، فَلا يَسْتَطِيعُ إلَيْهِ سَبيلًا، فَيَأْخُذُ بيَدَيْهِ ورجْلَيْهِ فَيَقْذِفُ بِهِ، فَيحْسَبُ الناسُ أنَّما قَذَفَهُ إلَى النَّار، وإنَّما ألْقِيَ فِي الجنَّةِ."}, {"type": "p", "text": "يقول النبي صلى عليه وسلم عن ذلك الرجل الذي استشهد:"}, {"type": "p", "text": "\"هذا أعْظَمُ النَّاسِ شَهَادَةً عِنْد رَبِّ الْعالَمِينَ\"."}, {"type": "p", "text": "لم يستطع الدجال الدخول للمدينة بعد ذلك الحصار، وما حدث خارجها وما فعله بذلك الرجل المؤمن ثم بعدها تصرفه الملائكة نحو الشام فيتوجه إلى بيت المقدس ليحاصرها كذلك ولكن عزيزي القارئ ستكون نهايته هناك فأحضر لك فنجانا من القهوة ثم تابع القراءة."}]}, {"id": 50, "title": "بيت المقدس - آخر الزمان.", "section": "story", "paras": [{"type": "p", "text": "على الجانب الآخر إذا نظرنا من بعيد نرى على مد البصر تلك الأشجار، والسحاب الكثيف قد أظل أطهر البقاع على تلك الأرض، حتى إذا ما اقتربنا من تلك الأرض الجليلة، وهبطنا بالقدس ثم نزلنا بالمسجد الأقصى رأينا مجموعة من المؤمنين وإذا نظرنا حولهم وجدنا قائدهم، الذي أخبرنا رسولنا الكريم عن ظهوره آخر الزمان ليملأ الأرض عدلًا وقسطًا بعد ما ملئت جورًا."}, {"type": "p", "text": "تلك الفئة وقائدهم سيكونون محصورين ببيت المقدس ينتظرون مجيء الدجال ومعه سبعون ألفًا من يهود أصبهان، قادمين لمحاصرة المسجد الأقصى وبه المسلمون والمهدي."}, {"type": "p", "text": "حتى إذا جن الليل اجتمع عصابة من المسلمين فيقول الذي عليهم:"}, {"type": "p", "text": "ماذا تنتظرون بهذا الطاغية، أن تقاتلوه حتى تلحقوا بالله أو يفتح لكم؟"}, {"type": "p", "text": "فإذا أصبح الصبح انطلقنا إليه إن شاء الله."}, {"type": "p", "text": "على الجانب الآخر، وفي ذلك التوقيت الذي قد اتفقت فيه تلك العصابة على الخروج لمقاتلة الدجال."}, {"type": "p", "text": "وقريبًا من القدس في دمشق بالتحديد ينزل سيدنا عيسى ابن مريم عليه السلام من السماء كما أخبر النبي صلى الله عليه وسلّم:"}, {"type": "p", "text": "فبينما هو كذلك إذ بعث الله المسيح بن مريم، فينزل عند المنارة البيضاء شرقي دمشق، ينزل بين مهرودتين^68 واضعًا كفيه على أجنحة ملكين، إذا طأطأ رأسه قطر^69 وإذا رفعه تحدر منه جمان^70 كاللؤلؤ. فيقول:"}, {"type": "p", "text": "فلا يحل لكافر يجد ريح نفسه إلا مات، ونفسه ينتهي حيث ينتهي طرفه."}, {"type": "p", "text": "فسيدنا عيسى نزل في دمشق، المسلمون محصورون في بيت المقدس، فيجعل سيدنا عيسى همته الوصول إلى القدس لمواجهة الدجال، لكي يقتله."}, {"type": "p", "text": "لقد قرب الفجر فها نحن أولاء ببيت المقدس، ننظر فنرى جل المسلمين هناك وأمامهم المهدي ذلك الرجل الصالح الذي قد تقدم ليصلي بهم الصبح وإذ هم كذلك إذ نزل عليهم عيسى بن مريم عليه السلام."}, {"type": "p", "text": "ثم لما رأى المهدي عيسى عليه السلام رجع إلى الخلف وقدمه لكي يصلي بالمسلمين، قائلاً:"}, {"type": "p", "text": "تعالَ صلِ لنا."}, {"type": "p", "text": "ولكن عيسى عليه السلام يضع يده بين كتفيه فيقول:"}, {"type": "p", "text": "تقدم فصلِ فإنها لك أقيمت، ثم يقول: إن بعضكم لبعض أمراء تكرمة الله هذه الأمة."}, {"type": "p", "text": "فيصلي بهم إمامهم وعيسى عليه السلام خلفه صلاة الصبح وبعد الانتهاء من الصلاة يقرر سيدنا عيسى عليه السلام فتح الباب ومقاتلة الدجال. فيقول سيدنا عيسى:"}, {"type": "p", "text": "افتحوا الباب."}, {"type": "p", "text": "ولما فتح الباب كان من ورائه الدجال ومعه يهود أصبهان^71، وكلهم ذوو سيف محلى وشال لونه أخضر فوق أكتافهم."}, {"type": "p", "text": "فإذا نظر الدجال عيسى عليه السلام علم أنها نهايته فيتملكه الخوف ثم يبدأ في الذوبان كما يذوب الملح في الماء وينطلق هاربًا."}, {"type": "p", "text": "وعندما رآه عيسى عليه السلام فارًا من أمامه قال:"}, {"type": "p", "text": "إن لي فيك ضربة لن تسبقني بها.."}, {"type": "p", "text": "وكان معه حربة ثم انطلق ورآه حتى أدركه عند باب اللد الشرقي فيقتله بحربته."}, {"type": "p", "text": "وباب اللد هي بلد تقريبًا 35 كيلو غرب القدس ناحية يافا، فيلقاه هناك، ويقتله الله بيد عيسى عليه السلام، ويريهم دمه في حربته."}, {"type": "p", "text": "وإنما قتله بالحربة ولم يتركه يذوب لكي يقطع الشائعات. وإظهارًا لقتله وإعلانًا لانتهاء الفتنة ولكي يطمئن المسلمون."}, {"type": "p", "text": "وبينما يطارد عيسى عليه السلام الدجال يقوم المسلمون بقتال اليهود؛ فيهزم الله اليهود ثم يهربون بعد هزيمتهم ويختبئون من المسلمين وراء الحجر والشجر."}, {"type": "p", "text": "لكن الله سبحانه وتعالى قد أنطق الحجر والشجر وكل ما يختبئون وراءه فيقول الحجر والشجر والدواب:"}, {"type": "p", "text": "يا مسلم يا عبد الله هذا يهودي ورائي تعال فاقتله."}, {"type": "p", "text": "إلا شجر الغرقد فهو الشيء الوحيد الذي لا ينطق فهو من شجرهم، لذلك يزرعونه؛ ثم تنتهي الفتنة بقتل اليهود والدجال ويطمئن الناس، ويعود من اختبأ في الجبال خوفًا من فتنة الدجال، ويعود الناس من كل فج ليروا عيسى عليه السلام بعدما علموا أنه قد قتل الدجال بفضل الله وقوته."}, {"type": "p", "text": "فيقابلهم عيسى عليه السلام ويمسح عن وجوههم؛ وذلك إما حقيقة لأنه من معاني اسم المسيح أنه يمسح على وجوههم."}, {"type": "p", "text": "وإما المقصود هو المعنى المجازي وهو كشف الكرب الذي كانوا فيه."}, {"type": "p", "text": "ثم يحدثهم عن درجاتهم في الجنة وبينما هو كذلك إذ أوحى الله إليه قال: إني قد أخرجت عبادًا لي لا يدان لأحد بقتالهم.. أي لا أحد له طاقة بقتالهم."}, {"type": "p", "text": "نعم لقد انتهى شر الدجال. ولكن هناك شر آخر في الطريق لا يقل خطورة عن المسيح الدجال وهم يأجوج ومأجوج."}, {"type": "p", "text": "فيقول الله عز وجل لعيسى عليه السلام: فحرز عبادي إلى الطور."}, {"type": "p", "text": "أخبر الله جل وعلا عيسى عليه السلام أن يذهب ويختبئ في الطور مع المسلمين وأمره بعدم قتالهم لأن الله عز وجل يعلم مدى خطورة هؤلاء القوم؛ فعدم المواجهة هو الحل الأمثل."}, {"type": "p", "text": "فانطلق سؤال من فم منصور فقال:"}, {"type": "p", "text": "لماذا حارب سيدنا عيسى الدجال ولكنه لم يواجه يأجوج ومأجوج؟!"}, {"type": "p", "text": "فقال الشيخ علاء الدين:"}, {"type": "p", "text": "لأن فتنة المسيح الدجال كانت فتنة على الدين ولم تكن خطرًا كبيرًا يستطيع أحد أن يقف أمامه كمثل يأجوج ومأجوج؛ فهم كانوا خطرًا على الأنفس وما كان لأحد ولا لأي جيش أن يقف أمامهم حتى سيدنا عيسى لم يكن ليستطيع أن يواجههم بجيش المسلمين، لكن المسيح الدجال كان أكثر فتنة على الدين."}, {"type": "p", "text": "ثم استكمل القصة فتحدث عن خروج يأجوج ومأجوج:"}]}, {"id": 51, "title": "خروج يأجوج ومأجوج", "section": "story", "paras": [{"type": "p", "text": "قال تعالى في سورة الأنبياء - آية ٩٦:"}, {"type": "p", "text": "﴿حَتَّىٰٓ إِذَا فُتِحَتۡ يَأۡجُوجُ وَمَأۡجُوجُ وَهُم مِّن كُلِّ حَدَبٖ يَنسِلُونَ﴾"}, {"type": "p", "text": "يأجوج ومأجوج هم من سلالة آدم، عليه السلام، بل هم من نسل نوح أيضًا من أولاد يافث أبي الترك، والترك شرذمة منهم، تركوا من وراء السد الذي بناه ذو القرنين."}, {"type": "p", "text": "فإذا ما فتح الردم خرج هؤلاء القوم يسرعون في المشي إلى الفساد، من كل مرتفع من الأرض."}, {"type": "p", "text": "وهذا مشهدهم يوم خروجهم، وقد قال ابن عباس واصفًا خروجهم ما قاله بن جرير: عن عبيد الله بن أبي يزيد قال: رأى ابن عباس صبيانًا ينزو بعضهم على بعض، يلعبون، فقال ابن عباس: هكذا يخرج يأجوج ومأجوج."}, {"type": "p", "text": "فعندما يخرج هؤلاء القوم فيغشون الناس ويباغتونهم، فيفزع المسلمون ويفرون إلى المدائن والحصون اتقاء شرهم ويأخذون معهم مواشيهم."}, {"type": "p", "text": "ثم يمرون ببحيرة طبرية فيشربون مياه الأرض، حتى أن بعضهم ليمر بالنهر، فيشربون ما فيه حتى يتركوه يبسًا، حتى أن من بعدهم ليمر بذلك النهر فيقول:"}, {"type": "p", "text": "قد كان هاهنا ماء مرة."}, {"type": "p", "text": "حتى إذا لم يبقَ من الناس أحد إلا أحدًا في حصن أو مدينة وقد وصلوا إلى جبل الخمر في بيت المقدس."}, {"type": "p", "text": "قال قائلهم:"}, {"type": "p", "text": "هؤلاء أهل الأرض، قد فرغنا منهم، بقي أهل السماء."}, {"type": "p", "text": "ثم يهز أحدهم حربته، ثم يرمي بها إلى السماء، فترجع إليه مختضبة دمًا؛ للبلاء والفتنة."}, {"type": "p", "text": "وينحصر نبي الله عيسى عليه السلام وأصحابه في الطور ويطول بهم المكث حتى يكون رأس الثور لأحدهم خيرًا من مائة دينار من شدة الجوع."}, {"type": "p", "text": "فيرغب نبي الله عيسى عليه السلام وأصحابه إلى الله، يدعون"}, {"type": "p", "text": "فبينما هم على ذلك إذ بعث الله عز وجل دودًا في أعناقهم كنغف الجراد الذي يخرج في أعناقه، فيصبحون موتى لا يسمع لهم حس."}, {"type": "p", "text": "فيقول المسلمون:"}, {"type": "p", "text": "ألا رجل يشري لنا نفسه، فينظر ما فعل هذا العدو؟"}, {"type": "p", "text": "فيتجرد رجل منهم محتسبًا نفسه، قد أوطنها على أنه مقتول، فينزل فيجدهم موتى، بعضهم على بعض، فينادي:"}, {"type": "p", "text": "يا معشر المسلمين، ألا أبشروا، إن الله عز وجل قد كفاكم عدوكم."}, {"type": "p", "text": "ثم يهبط عيسى عليه السلام وأصحابه من الطور إلى الأرض فيجدون مشكلة أخرى وهي عفن الأرض من تلك الأجساد التي فوق بعضها البعض، فلا يجدون موضع شبر إلا ملأه زهمهم ونتنهم."}, {"type": "p", "text": "فيرغب نبي الله عيسى عليه السلام إلى الله فيدعون، فيرسل الله طيرًا كأعناق البخت وهي طيور ضخمة أعناقها كأعناق الإبل تسمى البخت وهي نوع من أنواع الإبل."}, {"type": "p", "text": "ثم تأتي فتحملهم فتطرحهم بمكان يسمى المهبل وهي هوة سحيقة الله أعلم بمكان وجودها."}, {"type": "p", "text": "وقد ترك يأجوج ومأجوج قسيهم وأسلحتهم الكثيرة فيوقد منها المسلمون مدة سبع سنين بعد انتهاء تلك الفتنة سبع سنين يوقدون منها من كثرتها."}, {"type": "p", "text": "ولكن الآن لا تزال الأرض منتنة بعد جلاء أجسادهم فيرسل الله مطرًا لا تترك مكانًا إلا دخلته، فيغسل الأرض حتى يتركها المطر كالمرآة لكثرة نظافتها."}, {"type": "p", "text": "وهكذا تنتهي فتنة يأجوج ومأجوج ثم يعيش الناس في مرحلة بعد ذلك هي من أجمل مراحل الدنيا"}, {"type": "p", "text": "قال أرسلان مبتهجًا:"}, {"type": "p", "text": "قلت مرحلة من أجمل مراحل الدنيا؟!"}, {"type": "p", "text": "قال الشيخ:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "فقال منصور:"}, {"type": "p", "text": "وهذا يعني أن الشر سينتهي من الدنيا ويعود الخير والبركة؟!"}, {"type": "p", "text": "قال الشيخ:"}, {"type": "p", "text": "بالضبط هذا ما سوف يحدث وما جاء في حديث النبي صلى الله عليه وسلم حيث قال: \"طوبى لعيش بعد المسيح\"."}, {"type": "p", "text": "ثم استأنف لهم الشيخ سرد باقي الأحداث:"}]}, {"id": 52, "title": "حياة جديدة", "section": "story", "paras": [{"type": "p", "text": "ها قد انتهت الفتن وانتهى وجود الشر من الدنيا، فلا حروب ولا صراعات ولا خوف ولا فساد، قد انتهى وجود الشر بعد انتهاء تلك الفتن لتبدأ الأرض وتتهيأ لحياة جديدة غير التي عهدها البشر منذ خلق الله تعالى الأرض، سيعود الخير يملأ أركان الدنيا ليعيش الناس في سلام وأمان وحب ليس فقط مع الإنسان بل ومع كل شيء، حتى تلعب الأطفال مع الحية ولا تؤذيها، ويرعى الذئب مع الشاة فيحرسها ولا يقربها."}, {"type": "p", "text": "حياة لا يوجد بها لا هموم ولا أحزان ويكأنها برزخ بين جمال آخر الدنيا وجمال الجنة حتى أن الرسول صلى الله عليه وسلّم قد وصف هذه الفترة في جملة قصيرة في حديثه حيث قال:"}, {"type": "p", "text": "»طوبى لعيش بعد المسيح؛ طوبى لعيش بعد المسيح»."}, {"type": "p", "text": "كررها مرتين."}, {"type": "p", "text": "فبعد تلك الفتن يحكم عيسى عليه السلام بدين الإسلام وشريعته، حكمًا عدلًا وإمامًا مقسطًا، فيكسر الصليب، ويذبح الخنزير، ويضع الجزية ويترك الصدقة."}, {"type": "p", "text": "فتعود البركة للأرض مرة أخرى بعد أن كانت في أول أمرها وبعد أن أفسد الخلق في الارض، فكلما زاد الفساد قلت البركة."}, {"type": "p", "text": "وفي بركة الأرض تكون نظيفة كأنها سطح فضة ثم يقال لها ردي ثمرتك، فتنبت وتنضج بأحجام وأشكال مختلفة، حتى لو جئت وبذرت الحب على الصفا لنبت؛ على الحجر الأملس فسوف ينبت."}, {"type": "p", "text": "وعند إذ تأكل العصابة، 20 أو 30 رجلًا من حبة رمان واحدة فتكفيهم. حتى أنهم يستظلون بقشرتها."}, {"type": "p", "text": "ويكون الثور سعره مرتفع والخيل ترخص. وذلك لأن هذا الوقت ليس بوقت حرب وإنما وقت زراعة وخير فالثور يحتاج له في حراثة الأرض، ولذلك ثمنه غالٍ، ونتاج البقر والغنم من اللبن غاية في الكثرة حتى أن الفئام^72 من الناس تكتفي بلبن ناقة واحدة."}, {"type": "p", "text": "ويفيض المال في هذه الفترة حتى لا يقبله أحد، وأيضًا تكون البركة في العلاقات، فترفع الشحناء والبغضاء من قلوب الناس فليس بين اثنين عداوة، وتُملأ الأرض من السلم كما يُملأ الإناء من الماء."}, {"type": "p", "text": "إذًا ستضع الحرب أوزارها، ويكثر الأمن حتى ترعى الأسود مع الأبل، وينزع حمة كل ذات حمة^73؛ حتى يدخل الوليد يده في فمها فما يؤذى."}, {"type": "p", "text": "وهذه الفترة تكون مدة 40 عامًا من الخير والسعادة؛ فطوبى لعيش بعد المسيح."}, {"type": "p", "text": "ثم فجأة سكت الشيخ وظهرت علامات الخوف والحزن على وجهه، حتى ظنناه سوف يبكي."}, {"type": "p", "text": "فقلنا ماذا ألم بك مولانا؟!"}, {"type": "p", "text": "فأجاب في نبرة حزينة وبعيون لامعة كادت الدموع أن تسقط منها:"}, {"type": "p", "text": "ثم يأتي زمان على الناس لا يقال فيه الله الله، حتى يأتي أقوام لا يعرفون من ربهم حتى يسأل الصغير من الله؟ فيقول أبوه لا أدري يا ولدي كلمة كان آباؤنا يقولونها!!!"}, {"type": "p", "text": "ثم ذكر لهم كيف يكونن حال القوم بعد مدة 40 عامًا:"}]}, {"id": 53, "title": "سُنَّةُ التبديل", "section": "story", "paras": [{"type": "p", "text": "وتستمر الدنيا حتى تنقضي تلك المدة التي كانت من أفضل أيام الدنيا حتى يتوفى عيسى عليه السلام وتبدأ الأرض في العودة بالتدريج إلى ما كانت عليه قبلًا، فتنزع البركة مرة أخرى ويعود الناس لما كانوا عليه من الفساد والكفر والعصيان بل أشد مما مضى وأسرع."}, {"type": "p", "text": "حتى يقول الولد لوالده:"}, {"type": "p", "text": "سمعتك تقول الله يا أبتِ؛ فما الله؟"}, {"type": "p", "text": "فيقول:"}, {"type": "p", "text": "لا أدري كلمة كان يقولها آباؤنا فنحن نقولها."}, {"type": "p", "text": "... لتتخيل عزيزي القارئ يأتي زمان لا يعرف الرجل من ربه الذي خلقه وأكرمه ونعمه، زمان قد وصل الفساد إلى حد لم تصل له الأرض مذ خلقت، قد ظهر الفساد في البر والبحر، والناس سكارى وما هم بسكارى ولكن عذاب الله شديد، ولكن الفتن عتيدة، تخلع بقلوب العباد حتى تنزع قدسية المقدسات من القلوب، ولا يعرف دين ولا يذكر الله وتكون الفطرة قد انتكست، حتى لا يدري من ربه الذي خلقه فسواه، فلا تقوم الساعة حتى لا يقال الله الله."}, {"type": "p", "text": "واضمحل الدين ولا يبقى في القلوب تعظيم لشعائر الله حتى يصل الأمر إلى ان تهدم الكعبة."}, {"type": "p", "text": "نظر أرسلان ومنصور إلى الشيخ بنظرة تملأها الصدمة وقالا في نفس واحد:"}, {"type": "p", "text": "الكعبة؟؟!!"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "نعم، هذا البيت المقدس الذي حفظه الله عز وجل مذ خلق الأرض؛ يأذن الله في أن تكون له سنن في الدنيا قد اقتضت حكمته أن تكون، فالبيت محفوظ من قبل الله إلى قيام الساعة ولكن هدمه في آخر الدنيا حيث يعم الفساد والهرج والمرج والأمور العظام والقتل وارتكاب الفواحش وينسى الناس الدين من نفوسهم بالكلية فلا يوجد على الأرض نفس توحد الله حيث يقبض الله نفوس الصالحين وتقوم الدنيا على شرار الخلق."}, {"type": "p", "text": "ثم أكمل لهم كيف تهدم الكعبة:"}, {"type": "p", "text": "فلا تقوم القيامة حتى تهدم الكعبة وتنقض حجرًا حجرًا، وذلك كما أخبرنا نبينا محمد صلى الله عليه وسلم:"}, {"type": "p", "text": "عن أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وسلم قال: «يُخرِّب الكعبة ذو ‌السُّوَيقَتَين من الحبشة»."}, {"type": "p", "text": "ستهدم قبلة المسلمين في آخر الزمان بعد ذهاب الدين ورجوع الناس إلى الكفر."}, {"type": "p", "text": "لمع سؤال في ذهنيهما فقال الشيخ أرى أنكما تسألان من يكون ذو السويقتين.. حسنًا، سأخبركما."}, {"type": "p", "text": "فالذي يهدمها هو ذو السويقتين، وسمي بذي السويقتين لصغر قدميه وهو من الحبشة حتى يهدمها ويسلب متاعها."}, {"type": "p", "text": "هو رجل أصيلع^74 أفيدع^75، ومفاصله غير منتظمة، ويضرب عليها بمسحاته ومعوله أي يضرب الكعبة ويهدمها بفأسه وأدواته. فيهدمها أمام الناس وهم يشاهدون غير منكرين لما يفعل، بل أنهم سعداء بذلك."}, {"type": "p", "text": "ثم تأتي ريح طيبة تقبض كل نفس مؤمنة وتقوم القيامة على شرار الخلق. وتخرج الشمس من مغربها، وتظهر النار التي تسوق الناس إلى محشرهم، ثم تنتهي الدنيا."}, {"type": "p", "text": "وانتهت الحياة عزيزي القارئ هذه الدنيا التي يتسارع الناس عليها بل ويختصمون بل ويقتل بعضهم بعضًا من أجل دنيا، وما سميت دنيا إلا من دنوها، فخذ لنفسك من اليوم واستعد لمجابهة تلك الفتن، ولا تحسبن الأمر بعيدًا، فلربما ومن الممكن أن يقع في حياتك، فما تفعل إن لم تكن مستعدًا؟!"}, {"type": "p", "text": "سأل منصور:"}, {"type": "p", "text": "وكيف تكون النجاة يومئذ من كل تلك الفتن يا شيخ؟!"}, {"type": "p", "text": "فقال الشيخ:"}, {"type": "p", "text": "تكون النجاة باتباع كتاب الله وسنة نبيه كما أخبرنا نبي الله صلى الله عليه وسلم."}, {"type": "p", "text": "ثم تابع قوله بتفصيل ذلك:"}]}, {"id": 54, "title": "كيف النجاة", "section": "story", "paras": [{"type": "p", "text": "ربما تسأل نفسك عزيزي القارئ كيف تكون النجاة من كل تلك الفتن والمحن الجواب في حديث النبي صلى الله عليه وسلم عندما قال لحذيفة بعد أن أخبره بهذه الفتن، قال له:"}, {"type": "p", "text": "يا حذيفة تعلم كتاب الله واتبع ما فيه. ثلاث مرات يقولها."}, {"type": "p", "text": "فالحل في كتاب الله هو المفتاح الذي سيفتح لنا باب الاعتصام من الفتن ما ظهر منها وما بطن."}, {"type": "p", "text": "كيف لا والنبي قال في حديث آخر: «عليكم بكتاب الله وسنتي»."}, {"type": "p", "text": "وقال ايضًا: «تركت فيكم ما إن تمسكتم به فلن تضلوا، كتاب الله وسنتي»."}, {"type": "p", "text": "فينبغي لكل مسلم ومسلمة التمسك بكتاب الله والمداومة على قراءته وتدبره وحفظه، فالقرءان تزكية للنفوس، فالقرءان الماء العذب للجسد العطشان."}, {"type": "p", "text": "فاجعل لك وردًا، تقرأه كل يوم، وتدبر، واطلع على تفسير ما تقرأ من الكتب المختصرة."}, {"type": "p", "text": "تعلم وادرس تلك الفتن واقرأ عنها لكي تكون مستعدًا، فوالله إنها باتت قريبة. فمن ألف وأربعمائة عام قال الله «اقتربت الساعة»."}, {"type": "p", "text": "علم أولادك وربهم على كتاب الله، حفظهم من سورة الكهف لتكن عصمة لهم؛ ربهم على العقيدة السليمة."}, {"type": "p", "text": "ثاني أمر هو قيام الليل ولو ركعتين، فقيام الليل له سره العجيب في رفع الروح الإيمانية، وتعزيز المعتقد، والثبات، وهو سبب في إجابة الدعوات، وحصن حصين، وهو يعرفك على ذاتك."}]}, {"id": 55, "title": "المصادر", "section": "front", "paras": [{"type": "p", "text": "- صحيح مسلم: الحديث رقم (2942) في كتاب الفتن وأشراط الساعة، باب ذكر الدجال وصفته وما معه."}, {"type": "p", "text": "- سنن أبي داود: الحديث رقم (4325) في كتاب الملاحم، باب خروج الدجال."}, {"type": "p", "text": "- سنن الترمذي: الحديث رقم (2253) في كتاب الفتن، باب ما جاء في شأن الدجال."}, {"type": "p", "text": "- مسند أحمد: عدة روايات في مسند أحمد تتناول نفس القصة."}, {"type": "p", "text": "- مرقاة المفاتيح للقاري"}, {"type": "p", "text": "- صحيح الجامع/ 4205"}, {"type": "p", "text": "- موقع «الدرر السنية»"}, {"type": "p", "text": "- جيل موشيه (1997)، ص.70-71."}, {"type": "p", "text": "- أكرم إبراهيم آغا (2004). سيف الله خالد بن الوليد - حياته وحملاته. طبعة جامعة أكسفورد: باكستان. ISBN 0-19-597714-9"}, {"type": "p", "text": "- محمد بن عمر الواقدي: فتح الشام."}, {"type": "p", "text": "- بنفنستي، ميرون (1998). مدينة الحجر: التاريخ الخفي للقدس، طبعة جامعة كاليفورنيا. ISBN 0-520-20768-8"}, {"type": "p", "text": "- إدوارد جيبون (1862). تاريخ انحدار وسقوط الإمبراطورية الرومانية، المجلد 6، طبعة جيه دي موريس."}, {"type": "p", "text": "- جيل، موشيه (فبراير 1997) التاريخ الفلسطيني من 634-1099، طبعة جامعة كامبريدج. ISBN 0-521-59984-9"}, {"type": "p", "text": "- ليو جريتس، صموئيل جيم نون (2002). الحدود الرومانية الشرقية والحروب الفارسية (الجزء الثاني). طبعة روتليدج. ISBN 0-415-00342-3"}, {"type": "p", "text": "- هالدون، جون (1990). بيزنطة في القرن السابع: التحول في الثقافة. طبعة جامعة كامبريدج. ISBN 0-521-31917-X"}, {"type": "p", "text": "- هوبي، ليزلي ج (2000). المدينة المقدسة: القدس في لاهوت العهد القديم، كتب مايكل جليزر. ISBN 0-8146-5081-3"}, {"type": "p", "text": "- عماد الدين الأصفهاني. الفتح القسي في الفتح القدسي."}, {"type": "p", "text": "- لويس، برنارد (2002، الطبعة السادسة) العرب في التاريخ جامعة أكسفورد للصحافة. ISBN 0-19-280310-7"}, {"type": "p", "text": "- نيكول، ديفيد (1994)، اليرموك 636 م: الفتح الإسلامي لسوريا، طبعة اسبري. ISBN 1-85532-414-8"}, {"type": "p", "text": "- رنسبرن، ستيفن (1987، الطبعة الثانية)، تاريخ الحروب الصليبية: الحملة الصليبية الأولى. كتب البطريق: لندن. ISBN 978-0-521-34770-9"}, {"type": "p", "text": "- http://islamstory.com/ar- - /صلح_القدس_فتح_الشام"}, {"type": "p", "text": "- ابن الأثير: الكامل في التاريخ، دار صادر -- بيروت، 1402هـ =1982م."}, {"type": "p", "text": "- المقريزي: السلوك لمعرفة دول الملوك، تحقيق محمد مصطفى زيادة، لجنة التأليف والترجمة والنشر -- القاهرة، 1934م."}, {"type": "p", "text": "- سعيد عبد الفتاح عاشور: الحركة الصليبية، مكتبة الأنجلو المصرية -- القاهرة، 1971م."}, {"type": "p", "text": "- قاسم عبده قاسم: الحروب الصليبية، سلسلة عالم المعرفة -- الكويت."}, {"type": "p", "text": "- السيد الباز العريني: الأيوبيون، دار النهضة العربية -- بيروت، 1976م."}, {"type": "p", "text": "- صحيح الترغيب."}, {"type": "p", "text": "- صحيح الجامع/ 3612"}, {"type": "p", "text": "- صحيح مسلم/ 2899.]"}, {"type": "p", "text": "- في \"المعجم الكبير\" (11138):"}]}];
const FOOTNOTES = {"1": "هاج واضطربت أمواجه", "2": "قربنا", "3": "بيسان مدينة تاريخية تقع شمال شرق القدس وتعتبر من أقدم المناطق في فلسطين.", "4": "وثب تشير إلى القفز", "5": "طيبة تقع في المدينة المنورة", "6": "هي بحيرة تقع شمال فلسطين التاريخية وغرب هضبة الجولان ويخرج منها نهر الأردن.", "7": "نبع ماء صغير يقع جنوب بحيرة الطبريا قريبًا من مدينة أريحا وتعرف أيضًا بأسم عين السلطان.", "8": "ذلك المسيخ الدجال، الفتنة الكبرى التي ستكون قرب قيام الساعة وهي من علامات الساعة الكبرى وسمي مسيح لأنه يمسح الأرض أي يطئها في 40 يوما.", "9": "صلتًا تشير إلى ان السيف في حالة مجردة أو معلقًا بدون غمد.", "10": "قبيلة لخم وجزام هما قبيلتان عربيتان قديمتان لهما تاريخ طويل وعريق في الجزيرة العربية.", "11": "بحر الشام هو اسم يُطلق على الجزء الشمالي الشرقي من البحر الأبيض المتوسط. يمتد بين تركيا وسوريا ولبنان وفلسطين وإسرائيل. يُعتبر بحر الشام منطقة استراتيجية هامة ومصدرًا للثروات البحرية والأسماك، بالإضافة إلى أهميته الجغرافية والاقتصادية والسياسية في المنطقة.", "12": "يقصدون رسول الله صلى الله عليه وسلم؛ محمد بن عبد الله بن عبد المطلب.", "13": "الحجون هي منطقة في شمال موريتانيا وجنوب الصحراء الكبرى. تشتهر بالطقس القاسي والحياة البرية المتنوعة التي تتكيف مع الظروف الصعبة فيها.", "14": "وأنطاليا هي مدينة ساحلية جميلة تقع في جنوب غرب تركيا على ساحل البحر الأبيض المتوسط. تشتهر بشواطئها الرملية الجميلة والمناظر الطبيعية الخلابة، وتعتبر وجهة سياحية رائعة للعائلات والمسافرين من جميع أنحاء العالم.", "15": "هي مدينة تاريخية تقع في شمال افغانستان، يعود تاريخها إلى حوالي 2000عام قبل الميلاد، ودخلها الاسكندر الأكبر من ضمن حملاته في آسيا، وقد خضعت لحكم الأمبراطورية الساسانية، قبل أن يتم فتحها من قبل المسلمين في القرن السابع الميلادي. ولما فتحت في العهد الاسلامي كانت موطنا للعديد من العلماء والمفكرين، تعرضت للدمار عدة مرات على يد المغول لتعود إلى التاريخ مرة أخرى في العصر الحديث حيث أعيد بناء معالمها التاريخية، وتحتوى على العديد من الأماكن الاثارية مثل «مزار شريف\" الذي يحتوى على ضريح علي بن أبي طالب.", "16": "يقع الجامع في وسط مدينة قونيا ويعود تاريخ بناءه إلى العصور الأولى للإمبراطورية العثمانية، ويتميز بالعمارة التقليدية العثمانية، ويشمل قبة مركزية ومآذن طويلة.", "17": "هي حدائق تقع في مدينة اسطنبول، في منطقة جينتشليك وهي منطقة تجارية وسكنية، وتعتبر ملاذًا هادئا للناس حيث تتميز بالساحة الخضراء الواسعة والأشجار المتنوعة.", "18": "خفنا", "19": "أي جلدة تغطي أجزاء منها", "20": "كأنها رأس ثعبان", "21": "كثير الشعر", "22": "أي كثير التجعد", "23": "أي كثير الجعود", "24": "والاقمر شديد البياض خالصه لا ترى فيه لون مختلط، ومشرب بحمرة.", "25": "هجانا والهجين هو نوع من النوق خفيف الجسم سريع السير", "26": "يَعْنِى الْمَدِينَةَ.", "27": "«ما» في لفظة «ما هو» هي زائدة، وهذا في استعمال العرب.", "28": "نبوءة دابق تشير إلى معركة كبرى ستحدث في أخر الزمان في منطقة دابق، وهي بلدة صغيرة تقع شمال مدينة حلب في سوريا، وهذه النبوءة تتعلق بالأحداث الكائنة كما أخبر رسول الله-صلى الله عليه وسلّم- في بعض أحاديثه، حيث قال: \"لا تقوم الساعة حتى ينزل الروم بالأعماق أو بدابق\"", "29": "« أي في خيمة أو قبة، والأدم هو الجلد المدبوغ»", "30": "أي المكان الذي يختبأ فيه.", "31": "فأُصبت فجأة", "32": "و بني الأصفرِ\" وهم الرُّومُ", "33": "\"هُدنةٌ\"، أي: صُلْحٌ على تَركِ القِتالِ بعد التَّحرُّكِ فيه،", "34": "\"فيغْدِرونَ\"، أي: يَنقُضُ الرُّومُ الهُدنةَ،", "35": "وتحت كلِّ رايةٍ اثنا عشَرَ ألفًا من الجُنود.", "36": "هو أحد المواقع التاريخية والطبيعية في المملكة العربية السعودية، ويقع في منطقة عسير بجنوب غرب السعودية، وهي منطقة تتميز بمناخها المعتدل وطبيعتها الخضرا.", "37": "\"الآنك\" تعني الأُسْرُبُّ، وهو الرصاص القلعيّ، أو القزدير", "38": "محافظة سعودية تتبع إدارة منطقة تبوك", "39": "[سورة آل عمران 144]", "40": "منطقة الجابية هي منطقة تقع في جنوب العراق، تشتهر بأراضيها الزراعية الواسعة وخصوبة التربة، وتعتبر جزءًا من محافظة البصرة. تشتهر أيضًا بكثرة الأهوار فيها والتي تعتبر موطنًا للعديد من الأنواع النادرة من الحيوانات والنباتات.", "41": "إذا قلنا \"خطبة عصماء\"، فالمعنى يكون \"خطبة نقية\" أو \"خطبة محمية من العيوب والشوائب\"، حيث تعبر عن خطبة تتسم بالطهارة والنقاء في المضمون والأداء.", "42": "كلمة \"بحبوحة\" في الحديث النبوي تعني بالنعيم والخير، وتستخدم للدلالة على الراحة والسعادة الفائقة، كما يُصوَّر في الوصفات الإسلامية عن الجنة.", "43": "عباءة قطوانية هي نوع من العباءات المصنوعة من قماش القطوان، وهو نوع من الأقمشة التي تتميز بملمسها الناعم والفخم. غالبًا ما يُصنع هذا القماش من صوف عالي الجودة، ويُستخدم في صنع ملابس فاخرة ودافئة. يمكن أن يكون القطوان مزيجًا من الصوف والحرير أو الصوف القطني. تعكس العباءة القطوانية أناقة وفخامة، وتُعتبر خيارًا شائعًا للملابس الشتوية الرسمية.", "44": "مدينة إيليا هي مدينة أثرية تاريخية تقع في الجنوب الغربي من فلسطين التاريخية، في منطقة ما يعرف اليوم بجنوب لبنان. كانت إيليا في العصور القديمة مركزًا مهمًا للحضارة الفينيقية، وتعتبر اليوم موقعًا أثريًا مهمًا يجتذب السياح والباحثين لدراسة تاريخها وأثارها.", "45": "بلغراد هي عاصمة صربيا وأكبر مدينة فيها", "46": "عمواس قرية فلسطينية", "47": "هو داء قاتل يصيب الجهاز العصبي للأغنام والماعز.", "48": "هذه الجملة حكاية مستلهمة أو مقتبسة من رؤية الصحابة للنبي وهو يتلوا عليهم الحديث.", "49": "هذا الكلام ليس من كلام النبي، اي الشرح وانما المقصود واصل كلامه في باقي الحديث.", "50": "متحف مولانا ومعروف أيضًا بمتحف جلال الدين الرومي، والمتحف يعد مزارا للسياح، وبه معروضات شخصية تعود لجلال الدين.", "51": "هذه المدينة تقع في محافظة قونيا-تركيا، ترتفع عن سطح البحر حوالي 1007 متر.", "52": "هي مدينة في منطقة بحر إيجة الوسطى في تركيا، ويبلغ عدد سكانها في عام 2022 / 236366. تحتوي على حي تاريخي، ومتحفه الذي يضم كنوز ليديان والأودية والآثار في المناطق الريفية المحيطة. يطلق على أوشاك اسم (بحر إيجة) ولكنها تبعد 240 كم عن الساحل، ومناخها أشبه بالأناضول. إنه مركز نسيج قديم، بأسلوب مميز من السجاد تم تصديره منذ فترة طويلة إلى أوروبا، حيث أصبح Ushak مصطلحًا إنجليزيًا لمثل هذا السجاد. وتشمل الصناعات الحديثة المواد الغذائية وبلاط الحمامات. كما أن لديها جامعة، وهناك ضجة طلابية في المركز. يقع مسجد كيرك ميناري على بعد 100 متر شمال غرب المسجد الكبير، وهو مبنى منخفض قصير يعود إلى عام 1826.", "53": "نبوءة دابق تشير إلى معركة كبرى ستحدث في أخر الزمان في الشام بحلب شمال سوريا، وتعتبر هذه المنطقة مهمة تاريخيا ومستقبليا بسبب كونها نقطة شاهدة على قيام نبوءة النبي-عليه الصلاة والسلام- عن الملحمة الكبرى اخر الزمان فقد ذكرت في حديث النبي- صلى الله عليه وسلم- حيث قال: \"ينزل الروم بالأعماق أو بدابق\". حيث سيواجه جيش المسلمين جيش الروم في تلك المنطقة وهي تعد من علامات قيام الساعة. وتسمى أيضًا بــ'هر مجدون' وهي كلمة وردت في العهد الجديد وهي تشير إلى الملحمة الكبرى أو معارك أخر الزمان؛ وهي تنقسم إلى مقطعين: هر: وتعني جبل أو تل. ومجدون: وهي وادي أو منطقة كنعانية تقع شمالي فلسطين، وسميت بذلك بسبب موقعها على تل استراتيجي حيث تعني التسمية: موضع الجيوش ومخيمها. ويعود تاريخها إلى الألف الثالثة قبل الميلاد، وتميزت في ظل الحضارة الكنعانية بالبناء الحجري والأسوار الكبيرة، والقصور الفخمة، واشتهرت بصناعة النسيج والملابس؛ وتعتبر اليوم من أهم المناطق الأثرية بفلسطين.", "54": "دابق قرية في منطقة إعزاز في محافظة حلب بسوريا.", "55": "الغاية هي الراية", "56": ". أي كسره.", "57": "هجيري تعني شيء يركب عليه كجمل أو نحوه أي جاء منفردا", "58": "الغوطة تحيط بدمشق من الشرق والغرب، وهي سهل ممتد من بساتين،", "59": "وهي منطقة دابق التي سبق الحديث عنها قبل ذلك وهي قرية في محافظة حلب.", "60": "حلوى معروفة في تركيا بطعمها الجميل وتعد من الحليب والقرفة والأرز والمكسرات", "61": "خوزا وكرمان: هما اقليمان قديمان، ويقصد بهما قوم من الاعاجم.", "62": "المجان المطرقة: هي الدروع المعدنية التي تضرب بالمطرقة لتصبح صلبة، والمعنى ان وجوههم عريضة وكبيرة.", "63": "نقبا أي فتحا أو مدخلا يدخل منه إلى المدينة", "64": "والكير جلد غليظ يستخدمه الحداد للنفخ في النار أو الجمر.", "65": "فيشبح أي؛: يمد بأوتاد في كل قدميه ويديه وتد", "66": "أي ينشر بالمنشار", "67": "الترقوة عظم يمتد من أعلى عظم الصدر إلى لوح الكتف. الأوسط، المَسَالح\": هُمْ الخُفَرَاءُ", "68": "أي ثوبين مصبوغين بالأصفر قليلًا.", "69": "قطر: أي حبات عرق تنزل منه", "70": "جمان «الجمان يعني حبات وتنزل كأنها حبات لؤلؤ»", "71": "اصفهان هي إحدى مدن إيران", "72": "الفئام أي عدة قبائل وربما شعب كامل", "73": "الحمة وهي كل ذات سم", "74": "أصيلع أي لا شعر في رأسه", "75": "أفيدع أي متباعد ما بين القدمين"};
</script>
<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const cover = $('#cover');
  const reader = $('#reader');
  const content = $('#content');
  const drawer = $('#drawer');
  const overlay = $('#overlay');
  const tocList = $('#tocList');
  const topTitle = $('#topTitle');
  const settingsSheet = $('#settingsSheet');
  const bookmarkToast = $('#bookmarkToast');
  const progressLabel = $('#progressLabel');

  let currentChapterIdx = 0; // index into CHAPTERS array
  let fontSize = 19;
  let theme = 'light';

  // ---------- Storage helpers (persistent, personal) ----------
  async function loadState(){
    try{
      const r = await window.storage.get('reading-state', false);
      if(r && r.value) return JSON.parse(r.value);
    }catch(e){ /* no saved state yet */ }
    return null;
  }
  async function saveState(partial){
    try{
      const existing = await loadState() || {};
      const merged = Object.assign(existing, partial);
      await window.storage.set('reading-state', JSON.stringify(merged), false);
    }catch(e){ console.error('storage error', e); }
  }

  // ---------- Build fahras ----------
  function buildToc(){
    tocList.innerHTML = '';
    CHAPTERS.forEach((ch, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'toc-item' + (ch.section === 'front' ? ' section-front' : '');
      btn.dataset.idx = idx;
      if(ch.section === 'story'){
        const num = storyNumber(idx);
        btn.innerHTML = '<span class="n">'+num+'</span>' + ch.title;
      } else {
        btn.textContent = ch.title;
      }
      btn.addEventListener('click', ()=>{
        openChapter(idx);
        closeDrawer();
      });
      tocList.appendChild(btn);
    });
  }

  function storyNumber(idx){
    let n = 0;
    for(let i=0;i<=idx;i++){
      if(CHAPTERS[i].section === 'story') n++;
    }
    return n;
  }

  function markActiveToc(idx){
    document.querySelectorAll('.toc-item').forEach(b=>{
      b.classList.toggle('active', Number(b.dataset.idx) === idx);
    });
  }

  // ---------- Render chapter ----------
  function renderFootnoteText(text){
    return text.replace(/\^(\d+)/g, (m, num)=>{
      if(FOOTNOTES[num]){
        return '<sup class="fn" data-fn="'+num+'">'+num+'</sup>';
      }
      return '';
    });
  }

  function openChapter(idx, scrollToTop=true){
    if(idx < 0 || idx >= CHAPTERS.length) return;
    currentChapterIdx = idx;
    const ch = CHAPTERS[idx];
    content.innerHTML = '';

    const eyebrow = document.createElement('div');
    eyebrow.className = 'chapter-eyebrow';
    eyebrow.textContent = ch.section === 'story' ? ('الفصل ' + storyNumber(idx)) : 'نبوءة دابق';
    content.appendChild(eyebrow);

    const title = document.createElement('h1');
    title.className = 'chapter-title';
    title.textContent = ch.title.replace(/\s*\(\d+\/\d+\)\s*$/, '');
    content.appendChild(title);

    ch.paras.forEach(p=>{
      if(p.type === 'divider'){
        const d = document.createElement('div');
        d.className = 'divider';
        d.textContent = '۞ ۞ ۞';
        content.appendChild(d);
      } else {
        const el = document.createElement('p');
        el.className = 'para';
        el.innerHTML = renderFootnoteText(p.text);
        content.appendChild(el);
      }
    });

    topTitle.textContent = ch.title.replace(/\s*\(\d+\/\d+\)\s*$/, '');
    progressLabel.textContent = (idx+1) + ' / ' + CHAPTERS.length;
    $('#btnPrev').disabled = idx === 0;
    $('#btnNext').disabled = idx === CHAPTERS.length - 1;
    markActiveToc(idx);

    if(scrollToTop) window.scrollTo({top:0, behavior:'instant'});
    saveState({chapterIdx: idx});
    attachFootnoteHandlers();
  }

  function attachFootnoteHandlers(){
    document.querySelectorAll('sup.fn').forEach(sup=>{
      sup.addEventListener('click', ()=>{
        const n = sup.dataset.fn;
        const txt = FOOTNOTES[n];
        showBookmarkToast(txt, 4500);
      });
    });
  }

  // ---------- Drawer ----------
  function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }

  // ---------- Settings sheet ----------
  function openSheet(){ settingsSheet.classList.add('open'); }
  function closeSheet(){ settingsSheet.classList.remove('open'); }

  function applyTheme(t){
    theme = t;
    document.body.setAttribute('data-theme', t);
    document.querySelectorAll('#themeSeg button').forEach(b=>{
      b.classList.toggle('active', b.dataset.v === t);
    });
    saveState({theme: t});
  }

  function applyFont(size){
    fontSize = size;
    document.documentElement.style.setProperty('--fs', size + 'px');
    document.querySelectorAll('#fontSeg button').forEach(b=>{
      b.classList.toggle('active', Number(b.dataset.v) === size);
    });
    saveState({fontSize: size});
  }

  let toastTimer = null;
  function showBookmarkToast(msg, duration=2200){
    bookmarkToast.textContent = msg;
    bookmarkToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ bookmarkToast.classList.remove('show'); }, duration);
  }

  // ---------- Init ----------
  async function init(){
    buildToc();

    document.getElementById('fontSeg').innerHTML = document.getElementById('fontSeg').innerHTML; // no-op safeguard

    $('#btnOpen').addEventListener('click', ()=>{
      cover.style.display = 'none';
      reader.style.display = 'block';
      openChapter(currentChapterIdx);
    });

    $('#btnResume').addEventListener('click', async ()=>{
      const st = await loadState();
      cover.style.display = 'none';
      reader.style.display = 'block';
      openChapter(st && typeof st.chapterIdx === 'number' ? st.chapterIdx : 0);
    });

    $('#btnToc').addEventListener('click', openDrawer);
    overlay.addEventListener('click', closeDrawer);

    $('#btnSettings').addEventListener('click', openSheet);
    $('#btnCloseSheet').addEventListener('click', closeSheet);

    $('#btnPrev').addEventListener('click', ()=> openChapter(currentChapterIdx - 1));
    $('#btnNext').addEventListener('click', ()=> openChapter(currentChapterIdx + 1));

    document.querySelectorAll('#themeSeg button').forEach(b=>{
      b.addEventListener('click', ()=> applyTheme(b.dataset.v));
    });
    document.querySelectorAll('#fontSeg button').forEach(b=>{
      b.addEventListener('click', ()=> applyFont(Number(b.dataset.v)));
    });

    $('#btnBookmark').addEventListener('click', ()=>{
      saveState({bookmarkIdx: currentChapterIdx, bookmarkScroll: window.scrollY});
      showBookmarkToast('تم حفظ العلامة عند: ' + CHAPTERS[currentChapterIdx].title.replace(/\s*\(\d+\/\d+\)\s*$/, ''));
    });

    // load saved state
    try{
      const st = await loadState();
      if(st){
        if(typeof st.chapterIdx === 'number'){
          $('#btnResume').style.display = 'inline-block';
        }
        applyTheme(st.theme || 'light');
        applyFont(st.fontSize || 19);
      } else {
        applyTheme('light');
        applyFont(19);
      }
    }catch(e){
      applyTheme('light');
      applyFont(19);
    }
  }

  init();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
