<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نبوءة دابق</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12141f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2E9D3;
    --bg-2: #E9DCB9;
    --ink: #2B2116;
    --ink-soft: #574a37;
    --gold: #9c7a2f;
    --gold-2: #b8903e;
    --maroon: #6b2337;
    --rule: rgba(43,33,22,0.18);
    --card: #FBF6E9;
    --shadow: rgba(43,33,22,0.25);
    --star-op: 0;
  }
  [data-theme="dark"]{
    --bg: #12141f;
    --bg-2: #191c2b;
    --ink: #e8dcc0;
    --ink-soft: #b7ab8d;
    --gold: #cda545;
    --gold-2: #e8c468;
    --maroon: #c9576f;
    --rule: rgba(232,220,192,0.16);
    --card: #191c2b;
    --shadow: rgba(0,0,0,0.5);
    --star-op: 1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Amiri', 'Noto Naskh Arabic', serif;
    min-height:100vh;
    transition: background .4s ease, color .4s ease;
    position:relative;
    overflow-x:hidden;
  }
  .starfield{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity: var(--star-op);
    transition: opacity .6s ease;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 65%, #fff, transparent),
      radial-gradient(1px 1px at 92% 88%, #fff, transparent),
      radial-gradient(1px 1px at 30% 10%, #fff, transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
  }

  /* ---------- Cover screen ---------- */
  #cover{
    position:relative; z-index:1;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding: 0 0 50px;
    background: #1f150f;
  }
  .cover-art-wrap{
    position: relative;
    width:100%; max-width: 520px; margin: 0 auto;
  }
  .cover-art{
    width:100%; display:block;
  }
  .cover-badge{
    position:absolute; top: 4%; left: 6%;
    width: 17%; aspect-ratio: 1/1;
    border-radius:50%;
    background: rgba(31,21,15,0.55);
    border: 1.5px solid #cda545;
    display:flex; align-items:center; justify-content:center;
    color:#e8c468;
    font-family:'Reem Kufi', sans-serif;
    font-size: clamp(9px, 2.2vw, 13px);
    font-weight:600;
    text-align:center;
    line-height:1.2;
    padding: 4%;
  }
  .cover-textblock{
    padding: 22px 24px 6px;
    max-width: 520px;
  }
  .cover-work{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(28px, 8vw, 40px);
    color: #f2e6cf;
    margin: 0 0 10px;
    line-height:1.3;
  }
  .cover-author{
    font-family:'Reem Kufi', sans-serif;
    font-size: 16px;
    color: #cda545;
    margin: 0 0 6px;
  }
  .cover-publisher{
    font-family:'Reem Kufi', sans-serif;
    font-size: 12.5px;
    color: #9c8a6a;
    margin: 0;
  }
  .btn-open{
    margin-top: 26px;
    background: linear-gradient(135deg, #e8c468, #9c7a2f);
    color: #1b1409;
    border:none;
    font-family:'Reem Kufi', sans-serif;
    font-size: 17px;
    font-weight:600;
    padding: 14px 42px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.5);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-open:active{ transform: scale(.96); }
  .cover-resume{
    margin-top: 14px;
    font-size: 14px;
    color: #cbbfa8;
    background:none; border: 1px solid rgba(232,220,192,0.25); border-radius: 999px;
    padding: 8px 20px; cursor:pointer; font-family:'Reem Kufi', sans-serif;
  }

  /* ---------- Top bar ---------- */
  #reader{ display:none; position:relative; z-index:1; min-height:100vh; }
  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    backdrop-filter: blur(6px);
  }
  .icon-btn{
    background:none; border:none; color: var(--ink);
    font-size: 22px; cursor:pointer; padding:6px 10px; line-height:1;
    border-radius:10px;
  }
  .icon-btn:active{ background: var(--bg-2); }
  .topbar-title{
    font-family:'Aref Ruqaa', serif; font-size:16px; color:var(--gold-2); flex:1; text-align:center;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 8px;
  }

  /* ---------- Fahras drawer ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; display:none;
  }
  #drawer{
    position:fixed; top:0; right:0; height:100vh; width: min(86vw, 340px);
    background: var(--card); z-index:31;
    transform: translateX(100%);
    transition: transform .3s ease;
    box-shadow: -8px 0 30px var(--shadow);
    display:flex; flex-direction:column;
  }
  #drawer.open{ transform: translateX(0); }
  #overlay.open{ display:block; }
  .drawer-head{
    padding: 20px 18px 12px; border-bottom:1px solid var(--rule);
  }
  .drawer-head h2{
    font-family:'Aref Ruqaa', serif; margin:0 0 2px; color:var(--gold-2); font-size:22px;
  }
  .drawer-head p{ margin:0; font-size:12px; color:var(--ink-soft); font-family:'Reem Kufi',sans-serif;}
  .toc-list{ overflow-y:auto; flex:1; padding: 6px 0; }
  .toc-item{
    display:block; width:100%; text-align:right; background:none; border:none;
    color: var(--ink); font-family:'Reem Kufi', sans-serif; font-size:14.5px;
    padding: 12px 18px; cursor:pointer; border-bottom:1px solid var(--rule);
  }
  .toc-item .n{ color: var(--gold); font-size:12px; margin-left:8px; }
  .toc-item.active{ background: var(--bg-2); color: var(--gold-2); font-weight:600; }
  .toc-item.section-front{ color: var(--ink-soft); font-size:13.5px; }

  /* ---------- Content ---------- */
  .content-wrap{
    max-width: 640px; margin: 0 auto; padding: 26px 22px 120px;
  }
  .chapter-eyebrow{
    text-align:center; color: var(--gold); font-family:'Reem Kufi',sans-serif;
    font-size:12px; letter-spacing:3px; margin-bottom:6px;
  }
  .chapter-title{
    text-align:center; font-family:'Aref Ruqaa', serif; color: var(--ink);
    font-size: clamp(22px, 6vw, 30px); margin: 0 0 26px; line-height:1.5;
  }
  .divider{
    text-align:center; color: var(--gold); margin: 30px 0; font-size:18px; letter-spacing:10px;
  }
  p.para{
    font-size: var(--fs, 19px); line-height: 2.05; margin: 0 0 20px; text-align: justify;
    color: var(--ink);
  }
  sup.fn{
    color: var(--maroon); cursor:pointer; font-size: 12px; padding: 0 2px;
    border-bottom: 1px dotted var(--maroon);
  }

  /* ---------- Bottom nav ---------- */
  .bottombar{
    position: fixed; bottom:0; left:0; right:0; z-index:15;
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 18px; background: var(--bg);
    border-top:1px solid var(--rule);
  }
  .nav-btn{
    background: var(--bg-2); border:none; color:var(--ink); font-family:'Reem Kufi',sans-serif;
    font-size:13px; padding:10px 16px; border-radius:999px; cursor:pointer;
  }
  .nav-btn:disabled{ opacity:.35; }
  .progress-label{ font-size:11px; color:var(--ink-soft); font-family:'Reem Kufi',sans-serif; }

  /* ---------- Font/theme sheet ---------- */
  #settingsSheet{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background: var(--card); border-radius: 18px 18px 0 0;
    transform: translateY(100%); transition: transform .3s ease;
    padding: 18px 20px 26px; box-shadow: 0 -10px 30px var(--shadow);
  }
  #settingsSheet.open{ transform: translateY(0); }
  .sheet-row{ display:flex; align-items:center; justify-content:space-between; margin: 14px 0; }
  .sheet-label{ font-family:'Reem Kufi',sans-serif; font-size:14px; color: var(--ink-soft); }
  .seg{ display:flex; gap:6px; }
  .seg button{
    border:1px solid var(--rule); background:none; color:var(--ink);
    border-radius:10px; padding:8px 14px; font-family:'Reem Kufi',sans-serif; cursor:pointer; font-size:13px;
  }
  .seg button.active{ background: var(--gold); color:#1b1409; border-color:var(--gold); }
  .sheet-close{
    display:block; margin:10px auto 0; background:none; border:none; color:var(--ink-soft);
    font-family:'Reem Kufi',sans-serif; font-size:13px; cursor:pointer;
  }
  .bookmark-toast{
    position:fixed; bottom: 78px; right:50%; transform: translateX(50%) translateY(20px);
    background: var(--gold-2); color:#1b1409; padding:10px 20px; border-radius:999px;
    font-family:'Reem Kufi',sans-serif; font-size:13px; opacity:0; pointer-events:none;
    transition: all .3s ease; z-index:50; white-space:nowrap;
  }
  .bookmark-toast.show{ opacity:1; transform: translateX(50%) translateY(0); }

  @media (min-width:700px){
    #drawer{ width: 340px; }
  }
</style>
</head>
<body data-theme="light">
<div class="starfield"></div>

<!-- COVER -->
<div id="cover">
  <div class="cover-art-wrap">
    <img class="cover-art" src="cover-bg.jpg" alt="نبوءة دابق">
  </div>
  <div class="cover-textblock">
    <h1 class="cover-work">نُبُوءَةُ دَابِق</h1>
    <p class="cover-author">محمد سيد الأطرش</p>
    <p class="cover-publisher">دار دوبامين للنشر والتوزيع</p>
  </div>
  <button class="btn-open" id="btnOpen">افتح الكتاب</button>
  <button class="cover-resume" id="btnResume" style="display:none;">تابع من حيث توقفت</button>
</div>

<!-- READER -->
<div id="reader">
  <div class="topbar">
    <button class="icon-btn" id="btnToc" aria-label="الفهرس">☰</button>
    <div class="topbar-title" id="topTitle">نبوءة دابق</div>
    <button class="icon-btn" id="btnSettings" aria-label="الإعدادات">Aa</button>
  </div>

  <div class="content-wrap" id="content"></div>

  <div class="bottombar">
    <button class="nav-btn" id="btnPrev">الفصل السابق ←</button>
    <span class="progress-label" id="progressLabel"></span>
    <button class="nav-btn" id="btnNext">→ الفصل التالي</button>
  </div>
</div>

<!-- DRAWER / FAHRAS -->
<div id="overlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h2>الفهرس</h2>
    <p id="drawerSub">تنقّل بين فصول الرواية</p>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<!-- SETTINGS SHEET -->
<div id="settingsSheet">
  <div class="sheet-row">
    <span class="sheet-label">المظهر</span>
    <div class="seg" id="themeSeg">
      <button data-v="light">نهاري</button>
      <button data-v="dark">ليلي</button>
    </div>
  </div>
  <div class="sheet-row">
    <span class="sheet-label">حجم الخط</span>
    <div class="seg" id="fontSeg">
      <button data-v="17">صغير</button>
      <button data-v="19">متوسط</button>
      <button data-v="22">كبير</button>
      <button data-v="26">أكبر</button>
    </div>
  </div>
  <div class="sheet-row">
    <span class="sheet-label">علّم هذا الموضع</span>
    <button class="nav-btn" id="btnBookmark">وضع علامة 🔖</button>
  </div>
  <button class="sheet-close" id="btnCloseSheet">إغلاق</button>
</div>

<div class="bookmark-toast" id="bookmarkToast">تم حفظ العلامة المرجعية</div>

<script>
const CHAPTERS = [{"id": 1, "title": "الإهداء وتنويه", "section": "front", "paras": [{"type": "p", "text": "إلى من يهمه الأمر؛ من يريد اتقاء الفتن.. من يريد النجاة من براثن العاصفة لمَّ تقع.. من يريد أن يفهم تفاصيل الحكاية.. إليك أيها القارئ العزيز أُهديك كتابي هذا، عسى أن تنتفع به، فإن لقيت به خيرًا فلتحمد الله على أن أرشدك لبعض الحقيقة، وإن كان غير ذلك، فدونك فلتلقه بيم النسيان، وادعُ الله لي بالخير والهداية على أن حاولت."}, {"type": "p", "text": "كان لزامًا أن ننبه على الآتي:"}, {"type": "p", "text": "أن ما جاء في بعض الأحاديث هو إعادة صياغة لها في"}, {"type": "p", "text": "قالب قصصي، ومن أراد الحديث بالنص فليعُد للمصادر أدناه."}, {"type": "p", "text": "وليعلم القارئ العزيز أن هناك من الحوارات القليلة في جانب ما وردت به الأحاديث عن نبوءة دابق، والتي جاءت من خلال فهم الأحداث وليس هناك نص يثبتها، ومنها ما لمحت إليه الأحاديث ومنها ما تم استنتاجه ولكن تبقى الأحداث الرئيسية كما جاءت."}, {"type": "p", "text": "وهناك شيء من الآثار التي لم تقم أدلة كافية على صحتها، فأوردناها، ولكن على كونها حلمًا أو هاجسًا وقع لبطل القصة."}, {"type": "p", "text": "والله من وراء القصد."}, {"type": "p", "text": "تم في التاسع من شهر"}, {"type": "p", "text": "ذي الحجة لعام ١٤٤٥ هـ."}, {"type": "p", "text": "الموافق 13 يوليو 2024م"}]}, {"id": 2, "title": "الفتنة الكبرى", "section": "story", "paras": [{"type": "p", "text": "جزيرة الدجال - وسط البحر"}, {"type": "p", "text": "فجرًا."}, {"type": "p", "text": "تناقلت تلك الخطوات المسرعة طارحة خوفًا من وراء ظهورها وناظرةً لتوجسٍ وخيفةٍ قادمين من فراغات ذلك الكهف المظلم، حيث تعانقت الأنفاس مع روائح الأرض وجدران الكهف الرطبة، والصخور القديمة قدم الحضارات الغابرة."}, {"type": "p", "text": "أشعة الشمس الخافتة قد انعكست متسللة من فتحة الكهف على جدرانه الصخرية بأناقة فائقة، راحت تمتزج مع الأنسجة المتسللة عبر ثنايا الظلام لترسم أشكالًا فنية تعكس مدى عمق المكان وأسراره وسريته."}, {"type": "p", "text": "وفجأة وفي لحظة واحدة من التأمل الشديد والتفكير، وضحت الصورة المرعبة أمام عيونهم، تداعب كل حواسهم وأفكارهم لتنسج خيوطًا كاملة"}, {"type": "p", "text": "لنسج أفكار قد ولدت لتوها، سائلة عن كينونة ذلك الشيء الغريب؛ الذي لم نرَ مثله في حياتنا أبدًا، وما ترك العقول حتى طرأت عليها بنات العقل."}, {"type": "p", "text": "ذهول يبدو على أعين القوم، تساؤلات تسقط على الأفئدة كالسهام، ولحظات من الصمت يقطعها أحدنا بقوله لذلك الكائن العجيب ونحن في إثره.."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "ويلك! ما أنت؟"}, {"type": "p", "text": "لم يجب عن سؤالنا مثلما فعلت الدابة من قبل، ولكنه نظر إلينا ولولا أنه مقيد لما استطعنا محاورته من خوفنا على أنفسنا.."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "قد قدرتم على خبري، ولن أخبركم عني حتى تخبروني ما أنتم؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين اغتلم^1."}, {"type": "p", "text": "فلعب بنا الموج شهرًا، ثم أرفأنا^2 إلى جزيرتك هذه،"}, {"type": "p", "text": "فجلسنا في أقربها، ولما دخلنا الجزيرة استقبلتنا دابة كثيرة الشعر، لا ندري ما قُبلها من دبرها من كثرة الشعر."}, {"type": "p", "text": "فقلنا:"}, {"type": "p", "text": "ويلك! ما أنت؟"}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "أنا الجساسة."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "وما الجساسة؟"}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة."}, {"type": "p", "text": "فنظر إليهم وقال في لهجة جادة مرعبة:"}, {"type": "p", "text": "أخبروني عن نخل بيسان^3."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أسألكم عن نخلها، هل يثمر؟"}, {"type": "p", "text": "قلنا له:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "أما إنه يوشك أن لا يثمر."}, {"type": "p", "text": "فلما أخبرناه بذلك، وثب^4 وثبة كاد أن يخرج من الجدار، حتى تسلل الخوف في نفوسنا، وخشينا أن ينفجر فينا."}, {"type": "p", "text": "ثم قال:"}, {"type": "p", "text": "أما لو قد أذن لي في الخروج لوطئت البلاد كلها غير طيبة^5."}, {"type": "p", "text": "ثم نظر إلينا بعد أن هدأ من وثبته وقال:"}, {"type": "p", "text": "أخبروني عن بحيرة الطبرية.^6"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "هل فيها ماء؟"}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "هي كثيرة الماء."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أما إن ماءها يوشك أن يذهب."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "أخبروني عن عين زغر^7."}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "هل في العين ماء؟ وهل يزرع أهلها بماء العين؟"}, {"type": "p", "text": "قلنا له:"}, {"type": "p", "text": "نعم، هي كثيرة الماء، وأهلها يزرعون من مائها."}, {"type": "p", "text": "فلما أخبرناه عن شأنها وثب أيضًا وثبة كاد أن يخرج من وراء الجدار."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أخبروني عن نبي الأميين ما فعل؟"}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "قد خرج من مكة ونزل يثرب."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أقاتله العرب؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "كيف صنع بهم؟"}, {"type": "p", "text": "فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه."}, {"type": "p", "text": "قال لهم:"}, {"type": "p", "text": "قد كان ذلك؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أما إن ذلك خير لهم أن يطيعوه."}, {"type": "p", "text": "وإني مخبركم عني، إني أنا المسيح^8، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة."}, {"type": "p", "text": "فهما محرمتان عليّ كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا^9 يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها."}]}, {"id": 3, "title": "تَقدِمَة", "section": "story", "paras": [{"type": "p", "text": "تلك كانت قصة ذلك المخلوق الغريب؛ هي فقط البداية التي ستحيل كل شيء إلى عالم من الغموض."}, {"type": "p", "text": "عندما يؤذن له بالخروج المهيب سيفسد في الأرض إيما إفساد، لتكون فتنة من أعظم فتن الدنيا مذ خلق الله الأرض ومن عليها، خروجه معدود من علامات الساعة والملاحم وانتهاء الدنيا، لذا كان لزامًا أن نبدأ قصتنا به."}, {"type": "p", "text": "ليفهم الناس مدى خطورة فتنته العصيبة، على المعتقد والنفس، لنقرأ باهتمام وندرس قصته للوقوف على حقيقته؛ لكي نتقيه إذا ما خرج."}, {"type": "p", "text": "ها أنا ذا أسمعك عزيزي القارئ وأنت تفكر وتقول بلسان غير عابئ:"}, {"type": "p", "text": "وأين أنا من ذلك الدجال؛ وهو من علامات آخر الزمان؟!!."}, {"type": "p", "text": "ولكن احذر ولا تظن أن زمنه بعيد؛ فلربما كان قريبًا وأنت لا تدري؛ فقد اقتربت الساعة وانشق القمر، وهي يومئذ أقرب منا ونحن في غفلة معرضون، ما يأتينا من قولٍ إلا كنا له تاركين."}]}, {"id": 4, "title": "رحلة عبر التاريخ الإسلامي", "section": "story", "paras": [{"type": "p", "text": "نترك قصة الدجال ها هنا في بحر الشام، في جزيرته، ونسافر إلى أنقرة، إحدى مدن تركيا، لنتعرف على بعض من شخصيات قصتنا؛ منصور وأمير والشيخ علاء الدين؛ سيقوم ذلك الشيخ بتولي دفة الحديث وسرد تفاصيل نهاية العالم والملحمة الكبرى؛ فكن مستعدًا، عزيزي القارئ، لتغوص في عمق التاريخ."}, {"type": "p", "text": "ستبدأ رحلتنا من أرض الصحابة لنمر بمحنتهم يوم وفات رسول الله - صلى الله عليه وسلّم - وكيف تحملوا ذلك النبأ العصيب، ولنمر مرور الكرام على لمحات من التاريخ حيث نرى ونشاهد تفاصيل الطاعون في أرض عمواس، ذلك الوباء الفتاك ونرى صمودهم وإيمانهم وكيف تغلبوا على المصاعب."}]}, {"id": 5, "title": "فتح بيت المقدس", "section": "story", "paras": [{"type": "p", "text": "سوف تشاهد الصحابي الجليل عمر بن الخطاب «الفاروق» وهو يفتتح بيت المقدس بعدما دام لسنين في يد الرومان، ثم لنأخذك في رحلة أخرى عبر التاريخ، لنتجاوز زمن الصحابة والخلفاء الأربعة، لنتوقف عند العهد الأيوبي ونرى القائد العظيم صلاح الدين الأيوبي وهو يعيد أمجاد الخليفة عمر بن الخطاب مرة أخرى في فتح بيت المقدس في هذه الفترة، سنستمتع ونتعلم الدروس والعبر والعظات والشجاعة والتضحيات التي قدمها المسلمون."}]}, {"id": 6, "title": "العصر الذهبي للخلافة الإسلامية", "section": "story", "paras": [{"type": "p", "text": "نرتحل عبر التاريخ لنصل إلى فترة من فترات عهد الخلافة الإسلامية كانت من أكثر الفترات رخاءً، سنروي قصة الخليفة الخامس عمر بن عبد العزيز، وكيف فاض المال في عهده لدرجة أنه قال: \"أنثروا الحب على رؤوس الجبال\"."}, {"type": "p", "text": "لكن، لا تفرح كثيرًا، عزيزي القارئ، فكثرة المال تعقبها فتن كقطع الليل المظلم؛ والقابض فيها على دينه كالجالس على حفرة من نار؛ مثل فتنة لا يبقى بيت من العرب إلا دخلته، ودهيماء أشد وطأة من ظلال الغيم، والسراء التي تسر العداء، وسنتعلم من هذه الفترة أهمية العدالة والاعتدال، وأهمية العدل والقيم، وخطر الفتن وحرقتها."}]}, {"id": 7, "title": "الواقع والحاضر", "section": "story", "paras": [{"type": "p", "text": "بعدها، ننتقل للحاضر في رحلة إلى الأرض المقدسة لنرى قوة الإيمان والعزيمة في رباط أهل غزة، سنرى كيف يصمدون رغم كل التحديات والمصاعب."}, {"type": "p", "text": "ثم نسافر إلى المستقبل لنكشف عن أحداث قادمة، لا محالة ستقع، سنجعلك تطلع على قبضة من أثر المستقبل الذي بات ماضيًا وتدرك أمورًا ستأتي قريبًا؛ لتكون مستعدًا إذا واجهتك، سنكشف عن علامات الساعة التي قد تكون قريبة منا أكثر مما نعتقد."}]}, {"id": 8, "title": "رؤية المستقبل بعيون الماضي", "section": "story", "paras": [{"type": "p", "text": "لترَ المستقبل بعيون الماضي، وترَ عجائب الدنيا قبيل الساعة، وتلك الحروب الصغيرة وما يتبعها من هدن، لنقف معًا، عزيزي القارئ، على عتبات الملحمة الكبرى ونشاهد تفاصيلها التي ستروعك في أحيان وتسرك في أحيان أخرى. ستشعر وكأنك تعيش هذه الأحداث بنفسك."}]}, {"id": 9, "title": "بداية النهاية", "section": "story", "paras": [{"type": "p", "text": "عندها تبدأ بداية النهاية والأحداث العظام. سترى المسيح الدجال وكيف سيفتن الناس عن دينهم، وتشاهد ما جعل الله له من قدرة رهيبة وفتن عظيمة؛ ستراه يقتل إنسانا ويحييه مرة أخرى بقدرة الله، يحيي أبوين ميتين لرجل ليصدقه بأنه إله، يقول للسماء أن تمطر فتمطر، وللأرض أن تنبت فتنبت، ستشعر برعب هذه الفتن وكأنك تعيشها."}]}, {"id": 10, "title": "النهاية والنصر", "section": "story", "paras": [{"type": "p", "text": "ولكنك ستفرح عندما تشاهد نهايته، وترى المهدي والنبي عيسى عليه السلام قد نزلا ليحاربا اليهود، ستشاهد بنفسك كيف يقاتلهم المسلمون حتى ترى النصر الذي كنت تحلم به وتتمنى أن تراه عيانًا؛ قد أصبح حقيقة وواقعًا، ثم ترى الخطر الكبير، فتنة أخرى؛ خروج يأجوج ومأجوج وكيف تصرف السيد المسيح عليه السلام مع هذا الخطر. سترى تفاصيل الحكاية كلها وكأنك تشاهد هذه الأحداث بعينيك."}]}, {"id": 11, "title": "جنة الدنيا", "section": "story", "paras": [{"type": "p", "text": "وها أنت الآن، عزيزي القارئ، تعيش أجمل 40 عامًا من تاريخ الحياة. ستشاهد فيها وترى جنة الدنيا على الأرض بعد انتهاء الشر، وكيف عاش المسلمون تلك المدة بدون ظلم وفتن، وفي سلام دائم وأمان عظيم، ستشعر بروعة هذه الفترة وتعيش تفاصيلها، ثم تأتي ريح الموت الطيبة فتأخذ المؤمنين؛ لترى بنفسك الدين وهو يتبدل ويتحرف ويضيع، وتعود الناس لسابقة أمرها من الفساد، سترى الكعبة تُهدم أمام عينيك حجرًا حجرًا، في محضر من الناس وهم لا يحركون ساكنًا، ولا يبقى إلا شرار الخلق وعليهم تقوم الساعة، وتنتهي الدنيا."}, {"type": "p", "text": "قد تتساءل، عزيزي القارئ، ما علاقة كل تلك الأحداث ببعضها؟ فدعني أخبرك: ببساطة، كل حدث منها يُعد علامة من علامات الساعة ونبأ يسبق الملحمة الكبرى أو يتأخر عنها."}, {"type": "p", "text": "فإذا أردت أن تشاهد الملحمة الكبرى وترى أشراط الساعة الصغرى والكبرى، فلتتابع القراءة؛ لتحصل على إجاباتٍ لتساؤلاتك وترى كيف ترتبط هذه الأحداث بشكل كبير."}]}, {"id": 12, "title": "حيث انتهت الحضارة؛ من هنا نبدأ النهاية.", "section": "story", "paras": [{"type": "p", "text": "مدينة أنقرة التركية"}, {"type": "p", "text": "كان السوق الكبير مكتظ بالناس ويعج بالنشاط في وقت ظهرٍ صيفي شديد الحر، والبسطات والأكشاك منتشرة في كل اتجاه على ظهر البسيطة تحت طول السماء الزرقاء ذات الصفاء الهادئ كلوحة مدهشة."}, {"type": "p", "text": "رائحة الأشياء تختلط ببعضها في نسيج متداخل على الأنوف من كل اتجاه، بينما أصوات الباعة والمشترين تتخلل الأجواء، والناس يتجولون بين الطرقات والمحلات التجارية يتفاوضون في الأسعار ويختارون أنسب المبيع."}, {"type": "p", "text": "وسط هذا الزحام يقف الصديقان منصور وأمير بجانب بسطتهما ويبتسمان للزبائن،"}, {"type": "p", "text": "منصور بشعره الأسود المموج وعينيه اللامعتين، كان يرتدي جلبابًا أبيض يبرز ملامحه الواثقة."}, {"type": "p", "text": "وأمير كان يرتدي قميصًا بلون أزرق كلون السماء وسروالًا بسيطًا، وكان يبدو عليه الهدوء، وبعض الحماس لما يتحدث عن البضاعة."}, {"type": "p", "text": "تعرض البضاعة متنوعة في كل ركن وجانب؛ أقمشة ملونة تتدلى من فوق البسطات بشكل ساحر، وتلك الحلي الذهبية والفضية التي تلمع تحت أشعة الشمس، أوانٍ فخارية مزينة بأبهى النقوش البديعة."}, {"type": "p", "text": "كان أمير يشير إلى بعض الأقمشة الفاخرة، يشرح للزبائن عن نوعيتها ومصدرها، بينما منصور يعرض الحلي بأسلوب مقنع، يدعو الناس لتجربة ارتدائها."}, {"type": "p", "text": "السوق يعج بالحياة والفوضى وبعض النظام، أطفال تجري بين البسطات، أصوت الضحكات تتناغم مع صخب المكان، النساء يختبرن الأقمشة، وأيديهن تتلمس نعومة وجودة خامات القماش، وكأنهن يتسامرن بجزء من تاريخ هذا السوق العتيق..."}, {"type": "p", "text": "وقفت امرأة تتفحص قماشة بعناية، ثم سألت بلهجة ممزوجة بالحيرة:"}, {"type": "p", "text": "\"هل تعتقد أن هذا السعر مناسب لهذه القماشة\"؟"}, {"type": "p", "text": "ابتسم أمير بثقة، مجيبًا:"}, {"type": "p", "text": "\"بالطبع، إنه عرض خاص اليوم فقط يا سيدتي.\""}, {"type": "p", "text": "من جانبه، نظر منصور إلى الزبون بفخر وقال:"}, {"type": "p", "text": "\"أتعلم؟ هذا السوق موجود منذ أكثر من مائة عام\"."}, {"type": "p", "text": "تفاجأ الزبون وابتسم قائلًا:"}, {"type": "p", "text": "\"حقًا؟ لم أكن أعلم ذلك\"."}, {"type": "p", "text": "أمير، دون أن يفقد ابتسامته، أشار إلى قلادة براقة، وقال:"}, {"type": "p", "text": "\"انظر كيف تلمع تحت ضوء الشمس. ستكون رائعة عليك\"."}, {"type": "p", "text": "ثم استدار منصور نحو الزبون الذي كان يتحسس الأقمشة بعناية، وسأله:"}, {"type": "p", "text": "\"هل أعجبتك هذه الأقمشة\"؟"}, {"type": "p", "text": "أجاب الزبون بإعجاب:"}, {"type": "p", "text": "\"نعم، إنها جميلة جدًا\"."}, {"type": "p", "text": "في وسط هذه الزحمة والفوضى؛ كان منصور واقفًا في بسطته، يتحدث ويبتسم للزبائن، حتى لمح بطرف عينه من بعيد حركة سريعة تحدث فجأة في المكان بين الأكشاك الملونة والأصوات العالية؛ كان هناك ولد يجري مسرعًا، متعبٌ ووجهه شاحب وعينيه يملأهما الخوف والقلق."}, {"type": "p", "text": "كاد الفتى يسقط لولا أن أمسك به رجل ضخم الجثة كان واقفًا يتفحص البضاعة، ثم وقف الولد بعد ما سقط وأخذ يهندم ثوبه، ثم اقترب وهو يتنفس بصعوبة وبصوت متهدج ويداه ترتعشان."}, {"type": "p", "text": "ثم قال:"}, {"type": "p", "text": "عمي منصور...... عمي منصور.....؛ والدك...."}, {"type": "p", "text": "ما إن سمع ذلك حتى اختفت ابتسامة منصور وتحولت عيناه تحديقًا وقد ارتسمت عليهما معاني القلق، ثم انحنى للولد وسأله بصوت خافت؛ كأنه توجس خيفة من سماع الإجابة:"}, {"type": "p", "text": "ماذا به أبي؟!"}, {"type": "p", "text": "تردد الولد لحظة ثم استجمع أنفاسه وقوته وهمس بتلك الكلمات التي غيرت حياة منصور للأبد:"}, {"type": "p", "text": "والدك..... يلفظ أنفاسه الأخيرة؟؟."}, {"type": "p", "text": "طرأت لحظة من الصمت القاتل خيمت على المكان؛ وكأن الزمن توقف، شعر منصور بثقل الهواء من حوله، والأصوات خافتة، وأحس ببرودة تسري في جسده، وفقدت يداه قوتهما؛ لتسقط من يده قطعة من الحلي كان يحملها في يده على الأرض محدثة صوتًا معدنيًا رنانًا."}, {"type": "p", "text": "عادت لحظات من حياته السابقة قبل أن يستعيد منصور توازنه، وكانت عيناه تبحث في وجه الصبي عن ملامح نفي لما سمعه، ولكن تعابير وجه الولد كانت صادقة وواضحة بحيث لم تترك مجالًا للشك."}, {"type": "p", "text": "أخذ منصور نفسًا عميقًا، ثم حاول ابتلاع تلك الغصة التي في حلقه، رفع رأسه للسماء وأغمض عينيه للحظة يستجمع فيها شتات نفسه وشجاعته، ولما فتح عينيه مرة أخرى كانت ملامحه تعكس ذلك الحزن المفاجئ، وأيضًا الإصرار على مواجهة المصاعب."}, {"type": "p", "text": "ربت منصور على رأس الولد برفق ثم قال بصوت هادئ لكنه لا يخلُو من الحزن:"}, {"type": "p", "text": "شكرًا لك يا بني..... سأذهب الآن."}, {"type": "p", "text": "التفت منصور ببطء ونظر إلى بسطته المليئة بالبضاعة والتي أصبحت فجأة بلا قيمة لديه؛ جمع ما استطاع مسرعًا ومن غير أن يتكلم مع أحد بدأ يمشي متجهًا لبيته، وهو يعلم أن هناك حياة كاملة بالتغيير تنتظره، ليواجه هذه الفاجعة الجديدة."}, {"type": "p", "text": "عندما دخل البيت، وجد أباه في لحظات الموت الأخيرة. نظر إليه فلم يتمالك نفسه من البكاء، وأحس بشعور الندم والألم والتقصير. أمسك بيديه ثم قال:"}, {"type": "p", "text": "\"سامحني يا أبي، ما كنت على قدر الطاعة، وما أحسنت يومًا أن أكون لك ابنًا، ولكني ما علمت أنني عاق إلا في هذه الساعة\"."}, {"type": "p", "text": "تمالك الأب أنفاسه بعد أن تحامل على شفتيه ليتكلم ثم قال:"}, {"type": "p", "text": "\"يا بني، آخر وصيتي لك وأنا على فراش الموت، لا تدع شيطانك يعميك عن حقيقتك التي لا مفر منها، فالقبر مثواك الأخير. لا تترك روحك تنثني عن السمو وتتعلق بالدنيا الفانية. دع أخلاقك تسمو، كن مع الله يكن الله معك."}, {"type": "p", "text": "روحك لن تجد صفاءً إلا إذا أقبلت بقلبك وتأملت بعقلك وجعلت بصيرتك تسمو فوق بصرك. لن يساعدك على ذلك إلا صديق، فابحث عنه بين الجميع. يا بني، احذر الفتن فإنها قادمة. اقرأ كتاب الله واعمل بما فيه، ولا تنسينك الدنيا. فإن الفتن إذا جاءت عصفت بالجميع، ولا حامي إلا قوة العقيدة. إياك وفتن الساعة، إياك وأشراط الساعة، إياك وفتن الساعة\"."}, {"type": "p", "text": "كررها مرارًا."}, {"type": "p", "text": "مسح منصور على وجه أبيه ثم ودعه في حزن وألم وحيرة من أمره."}, {"type": "p", "text": "توقف منصور للحظة، مسترجعًا كلمات والده الأخيرة:"}, {"type": "p", "text": "\"احذر فتن الساعة، وابحث عن صديق يعينك\"."}, {"type": "p", "text": "ما الذي كان يقصده والده بالضبط؟ هل كانت تلك تحذيرات عامة، أم أن هناك أمرًا محددًا كان يخشاه؟ ومن هو هذا الصديق الذي يجب أن يبحث عنه؟"}, {"type": "p", "text": "كانت الأسئلة تتزاحم في ذهن منصور كأمواج عاتية، كل واحدة منها تحمل معها عبء الغموض والتساؤل."}, {"type": "p", "text": "هل كان والده يعلم شيئًا لم يخبره به؟ وهل كان هذا التحذير مرتبطًا بماضيهم، أم أنه ينبئ بمستقبل غامض ومخيف؟! كل تلك الأسئلة سنعرف إجاباتها فيما هو قادم عزيزي القارئ، فلتحتسِ كوب قهوتك الجميل قبل أن يبرد ولنتابع القراءة."}, {"type": "p", "text": "وهنا في قونيا إحدى مدن تركيا الجميلة نجد ذلك الشيخ ذا الوقار يجلس بعد انتهاء الصلاة ليعطي الناس دروسًا في مسجد قونيا الكبير، فهو بطل حكايتنا وهو من سيتولى الحديث عن ملاحم آخر الزمان؛ لذا فكن مستعدًا لتبدأ رحلتك انتقالًا عبر التاريخ؛ فلن تقف عند محطة واحدة، وكن مستعدًا لبداية النهاية."}]}, {"id": 13, "title": "أرض الله المقدسة", "section": "story", "paras": [{"type": "p", "text": "اقتربت السفينة من الشاطئ في جوٍ غائم، حيث تتلاطم الأمواج كجبالٍ شاهقة، والسفينة تتأرجح كريشة فوق سطح الماء. الرياح كانت شديدة، وكأنها سيلٌ جارفٌ قادرٌ على قذف كل من يقف في وجهه إلى أعماق اليم."}, {"type": "p", "text": "حتى إذا هدأت العاصفة، وارتخت الأمواج، وسكنت الأصوات، ولم يُسمع سوى همساتٍ خافتة، خرج القوم من مخابئهم ليستقلوا السفينة."}, {"type": "p", "text": "عجبًا، كلٌّ يفكر في غداة يوم جديد، لعلّ كل واحدٍ منهم يصيب غايته، بيننا من كان متوجسًا خيفةً، ومن لا يرغب في الخروج، وكلٌّ منهم غارق في أفكاره، يحمل في داخله أمواجًا من الهموم أعلى تلاطمًا من تلك التي شهدوها في البحر."}, {"type": "p", "text": "لا ضير في ذلك، فذلك يوم عجيب جمعنا له؛ وجمع لنا من أنبائه ما تبشر به مقدمته."}, {"type": "p", "text": "حتى إذا تجهزنا بجهازنا، قال قائل منا: \"أيتها العير، أأنكم لمستعدون\"؟!."}, {"type": "p", "text": "ها أنا ذا ودعت بيتي، وحملت زادي، وانطلقت بين الركب، ناظرًا لمستقبل مجهول، ومؤملًا بلوغنا للضفة الأخرى..."}]}, {"id": 14, "title": "مدينة أنقرة التركية (1/2)", "section": "story", "paras": [{"type": "p", "text": "وفي مكان آخر؛ بعيدًا عن تلك الأجواء المزدحمة، في مدينة أنقرة التركية؛ كانت الشمس تقترب من المغيب، والسوق الكبير هناك كان يشهد تحولًا تدريجيًا بالانفضاض، الحركة بدأت في الاختفاء لحظة بعد لحظة، والضوضاء العالية التي كانت تغشى الأماكن قد أصبحت همسات متهدجة، والمشادات الكلامية العالية باتت حوارات هادئة، كان التجار يغلقون أكشاكهم ويجمعون بضائعهم بعناية؛ استعدادًا للرجوع لبيوتهم بعد يوم طويل من البيع والشراء."}, {"type": "p", "text": "في وسط المشهد كان أمير واقفًا بجانب بسطته، يلملم ما تبقى من بضاعته بعناية، كان يضع الحلي الذهبية والفضية في صناديق صغيرة مبطنة بالقطن، وكان شديد التركيز على ترتيب كل قطعة بحرص في أماكنها؛ نظر أمير على السوق الذي أصبح فارغًا إلى حدٍ كبير، وشعر بالهدوء الذي يأتي بعد ضوضاء الزحام، وكأن السوق يلفظ أنفاسه الأخيرة قبل أن يغلق أبوابه لليوم."}, {"type": "p", "text": "تلك الأرض المرصوفة التي كانت مليئة بالناس أصبحت الآن شبه فارغة، مع بقايا الورق والأكياس المتناثرة هنا وهناك، أصوات أقدام الناس العاجلة قلت، وضجيج المساومات قد اختفى، ولم يبقَ إلا بعض التجار لا يزالون يغلقون بسطاتهم وأكشاكهم وهم يتبادلون التحيات والابتسامات المتعبة."}, {"type": "p", "text": "نظر أمير إلى السماء التي بدأت تتلون بألوان الغروب الدافئة، ثم قال:"}, {"type": "p", "text": "\"يبدو أن اليوم كان قاسيًا على منصور، يا ترى ما الذي حدث له\"؟!"}, {"type": "p", "text": "وأخذ يتساءل ما ذلك الخبر الذي جعله يترك كل شيء هكذا ويذهب."}, {"type": "p", "text": "وقد جمع آخر صناديقهما، وحملها على عربتهما الخشبية المتهالكة، وبدأ يسير عبر الأزقة الضيقة التي كانت تفيض بالحياة قبل ساعات قليلة، الآن تملأها السكينة والهدوء، كانت أقدامه تتناغم مع صوت العربة التي تجر خلفه، وكل خطوة تقربه من نهاية يوم آخر في السوق."}, {"type": "p", "text": "أثناء سيره، تبادل الأحاديث الهادئة، مع أحد التجار الذين كانوا بالسوق، واستعادا بعض المواقف الطريفة التي مرت عليهما خلال اليوم....."}, {"type": "p", "text": "لِمَ أراك تعود لبيتك بمفردك اليوم؟ وأين صديقك الدائم؟ أتفرقتما بعد طول طريق؟!"}, {"type": "p", "text": "قالها ذلك الرجل الخمسيني ذو البشرة السمراء بلسان سؤول مستفهِم؟!"}, {"type": "p", "text": "فأجاب أمير بلسان النفي قائلًا:"}, {"type": "p", "text": "كلا؛ وأنَّى لي برفقة كرفقته إن افترقنا!؟."}, {"type": "p", "text": "قد قلت ذلك في نفسي، وأنا الذي عهدتكما صديقين منذ رأيتكما في هذا السوق. وهذا ما دعاني للسؤال.."}, {"type": "p", "text": "قالها ذلك التاجر ليرد عليه أمير بلسان ثقيل وشعور حزين:"}, {"type": "p", "text": "لا أدري؛ لقد لمحته وأنا منشغل في فصال بيني وبين زبون أطال علي في السعر، أن طفلًا أتاه فحدثه بحديث لم أسمع منه شيئًا، ثم وبلا سابق إنذار رأيته فجأة وقد لملم بعض أشيائه راحلًا."}, {"type": "p", "text": "كان السوق بالنسبة لهما أكثر من مجرد مكان للعمل؛ كان ملاذًا يجمع بين الأمل والتحدي، ويحتضن ذكرياتهما وأحلامهما."}, {"type": "p", "text": "كانت الشمس قد انطلقت في رحلتها نحو المغيب تاركةً مهمة الضياء للقمر ليتطوع في جمال لينير عتمات الأفق، فالنهار ولى والليل أتى بجنوده لنستقبل ليلة سامرة لعشاق النجوم والسهر،"}, {"type": "p", "text": "ونسائم الهواء العليل المتداخل في ثناياه بعض البرودة."}, {"type": "p", "text": "تلك الحجارة المرصوفة، عبر الأزقة والطرق المتفرعة حول المباني والأسطح الحمراء والشرفات الساطعة بلمحة شعاع الغروب، تلك النباتات المتسلقة حول جدران المنازل وتلك الحدائق الصغيرة التي تملأها الزهور الملونة."}, {"type": "p", "text": "رائحة الطعام المنبعثة من نوافذ البيوتات، وأصوات الناس تقترب أكثر فأكثر وهم يتجاذبون أطراف الحديث من النوافذ والباحات، الأطفال يلعبون في كل ركن والنساء أمام بيوتهن يتبادلن الأحاديث."}, {"type": "p", "text": "ها قد أتى أمير وقد جمع ما تبقى من بضاعتهما ثم عاد إلى بيته ومشاعر القلق والتواتر بادية على وجهه، تتساقط على فؤاده سهام الفكر، وقف أمام منزل منصور ونادى عليه."}, {"type": "p", "text": "بعد النداء بقليل خرج منصور وهو يجر ثوب الحزن والألم فلما سأله عما حدث أجهش بالبكاء وقال:"}, {"type": "p", "text": "قد مات أبي."}, {"type": "p", "text": "انقضى أسبوعان على موت الحلاج، وكأنما تلك الأيام تحولت إلى دهور، تمرّ كالجبال الشاهقة على قلب المنصور الذي مزّق الفقدان قلبه."}, {"type": "p", "text": "انعزل في منزله، مكتئبًا، غارقًا في الحزن، لا يخرج إلى عمله، ولا يتواصل مع أحد، في تلك اللحظات التي يجلس فيها أمام البيت وحيدًا، كان صديقه يأتيه أحيانًا، يتحسس نبضه وينظر في عينيه بعطف، ليطمئن على حاله."}, {"type": "p", "text": "\"هكذا هي الدنيا تنسينا همومها ومشاغلها أن آخر المطاف لا بد أن نرحل ولا يبقى لنا من الدنيا شيء سوى ما نعمل من العمل الصالح\"."}, {"type": "p", "text": "\"ومهما طالت الدنيا فهي قصيرة، ومهما بَعُد الموت فهو قريب، نلهُو في هذه الدنيا وننسى أننا على موعد مع الرحيل قريبًا إلا إذا باغت الموت أحدنا فجأة\"."}, {"type": "p", "text": "في صباح يوم هادئ بدت الشمس المشرقة تتسلل خلال أوراق الشجر الملونة بألوان الطيف صانعة رسومات من الظل والضوء كلوحة فنية على الأرض، وأصبح الضوء ينتقل شيئًا فشيئًا على المباني والحجارة، والزهور أخذت في التفتح بألوانها الزاهية التي تعطي للعصافير لوائح من النغمات الموسيقية لتتلوها في الطبيعة."}, {"type": "p", "text": "وبدأ الناس يخرجون من بيوتهم لبداية يوم جديد، والأطفال يتسابقون ويلعبون أمام البيوتات، ورائحة خبز الفطور الطازج والقهوة تملأ الهواء والمخابز."}, {"type": "p", "text": "في ثنايا ذلك قد جلس منصور أمام البيت يتأمل نسيم الصباح وهدوء الطريق. عندها تذكر الماضي يوم أن كانت أمه على هذه الدنيا حية ترزق......."}, {"type": "p", "text": "قالت الأم:"}, {"type": "p", "text": "يا بني ألم يحن الوقت لكي تتزوج؟ فأنا أخاف عليك أن تبقى وحيدًا بعد موتي، لا أحد يعينك ولا من أحد ليطمئن عليك."}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "أطال الله في عمرك يا أماه. أرجوك.. أرجوك لا تقولي ذلك أبدًا، ثم إن موضوع الزواج فأنا لا أفكر في ذلك الآن. فكل ما يشغل تفكيري هو كيف أجمع لنفسي مالًا يغنيني، فاليوم أقوم بتوزيع بضاعتي وأتحصل على الأموال، فإذا انشغلت بالزواج الآن فلن أوفق بينهما."}, {"type": "p", "text": "قالت الأم:"}, {"type": "p", "text": "والزواج يا بني؟!"}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "فالزواج أمر سهل إن شاء الله، عن ما قريب؛ فقط تتيسر معي الأمور سوف أنظر في ذلك، لا تقلقي عليّ."}, {"type": "p", "text": "إذا رجعنا للماضي بعض الأعوام بعد تذكر ذلك الحدث، وبالتحديد قبل موت أم منصور ببضع سنين، وجدنا أن هناك ما ينبئ عن قصة حب كانت من طرف واحد، حيث كانت سلمى بنت عم المنصور والتي تبلغ من العمر 16 عامًا كانت تهوى منصور، بل وتحبه، ولكنه كان غير متقبل للفكرة، والتي ربما وافق عليها ابتغاء رضا والدته، ولكنه لم يقدر على أن يحبها."}]}, {"id": 15, "title": "مدينة أنقرة التركية (2/2)", "section": "story", "paras": [{"type": "p", "text": "\"لن تعطينا الدنيا كل ما نريد، بل لا بد من أن نتحمل الصعاب في سبيل الحصول على ما نريد، ولن نحصل على ذلك بطريقة كاملة فإنه لا كمال في هذه الحياة؛ وإن الأمر يتوقف علينا لكي نجعله كاملًا برضانا\"."}, {"type": "p", "text": "باءت كل محاولات سلمى في الإيقاع بقلب منصور بالفشل، حيث أنها كلما حاولت التقرب منه وجدته يتهرب منها، ولقد حدث ذلك كثيرًا إلى أن واجهته بقولها:"}, {"type": "p", "text": "ما الأمر يا منصور؟!"}, {"type": "p", "text": "فأجاب منصور قائلًا:"}, {"type": "p", "text": "ماذا هنالك يا ابنت عمي؟"}, {"type": "p", "text": "فقالت له:"}, {"type": "p", "text": "أراك تتهرب مني ولا تلقي لي بالًا أو انتباه، فهل أنا ثقيلة على قلبك إلى هذا الحد، أم لديك ما يشغل تفكيرك."}, {"type": "p", "text": "بل يكاد يطغى على قلبك فلا تستطيع الحديث؟! أم هل أنسى كذلك الكلام من الأساس؟!"}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "أنت لا تفهمين عليَّ."}, {"type": "p", "text": "مرت الأيام والليالي وقلب سلمى ينفطر أكثر وأكثر فهي في حيرة من أمرها لا تدري ماذا أصاب منصور فقد تغير كثيرًا وهي لم تعد تفهم، لِمَ ذلك."}, {"type": "p", "text": "بعد مرور خمسة أيام على هذا اللقاء الأخير بينهما قررت أن تذهب إلى أم منصور لتخبرها بما يجري، ذهبت إلى منزلهم فوجدت أم منصور وأباه فسلمت عليهما، ثم جلست على انفراد، افتتحت الموضوع معها بجدية على غير عادتها المرحة."}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "يا أمي إنك لا تفهمين ما أشعر به، إن قلبي يكاد ينفطر وإن ابنك لا يفهم ولا يشعر بما في داخلي حتى أنه لا يخرجني من حيرتي به."}, {"type": "p", "text": "قالت الأم:"}, {"type": "p", "text": "غلبتني يا ابنتي، كفاك بكاء أرجوك وحدثيني بكل شيء."}, {"type": "p", "text": "مسحت بيديها قطرات الدموع ثم قالت بتنهيدة وحرقة:"}, {"type": "p", "text": "إنه لا يحبني وهو لا يريدني شريكة له."}, {"type": "p", "text": "فقالت الأم:"}, {"type": "p", "text": "هدئي من روعك، لماذا تقولين ذلك؟"}, {"type": "p", "text": "فقالت سلمى:"}, {"type": "p", "text": "إنه يتجاهلني تمامًا كلما حدثته يتهرب مني."}, {"type": "p", "text": "فقالت الأم:"}, {"type": "p", "text": "يا ابنتي ربما معه شيء في عمله يجعله كذلك ألا تعرفين أنه حتى معي تلك الأيام معاملته متغيرة، فلا تقلقي سوف أحدثه بشأنك."}, {"type": "p", "text": "في أثناء حديثهما بذلك الشأن وفجأة يدخل منصور عليهما فتراه فتحاول أن تداري كل شعور تجاهه."}, {"type": "p", "text": "ثم دخل إلى غرفته وكأنه لم يرَ أحدًا.. قامت هي وانصرفت إلى منزلها في استعجال."}, {"type": "p", "text": "لم تذهب أمه إليه بعد تلك المقابلة مباشرة، بل تركته ينام إلى الليل وعلى العشاء افتتحت معه الموضوع."}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "يا بني، ما الأمر؟ لماذا تشتكي منك سلمى؟ فأنت لم تعد تهتم بها، فما الأمر؟"}, {"type": "p", "text": "نظر إليها في صمت وحزن وقال:"}, {"type": "p", "text": "هل تريدين يا أمي ما ينهي ذلك الموضوع، أم تريدين أن يتكرر مجيئها إليك في كل مرة؟"}, {"type": "p", "text": "ردت عليه الأم في استعجال تريد نفي كلامه فقالت:"}, {"type": "p", "text": ": يا بني هي لم تقل لي شيئًا عما تقول."}, {"type": "p", "text": "فقال منصور:"}, {"type": "p", "text": "إذًا لماذا جاءت الآن؟ ولمَ صمتت عندما دخلت عليكما؟"}, {"type": "p", "text": "سكتت الأم قليلًا فباغتها وبقوله:"}, {"type": "p", "text": "أماه، أرجوك كل شيء واضح، هل أخبرك بما ينهي هذا الأمر؟"}, {"type": "p", "text": "نظرت إليه الأم في تعجب وذهول مما يقول!!"}, {"type": "p", "text": "يا أمي أخبريها أنني ما قدرت على أن أجعل قلبي يميل إليها ولو بشق تمرة، حقًا حاولت تحت رغبتك، ولكني لم أستطع؛ أتريدين أن أتزوج بها لأظلمها معي؟ كلا لن أفعل."}, {"type": "p", "text": "قد انتهى ذلك الحوار الذي دار ما بين سلمى ومنصور، ومرت الأيام؛ وقد انتهى ما كان بينهما ولم تعد هي تأتي لمنزلهم، إلا في جل المناسبات أو بعضها."}, {"type": "p", "text": "حزن منصور على تعطل التجارة في قريته بسبب سوء الأحوال الاقتصادية، فقرر أن يذهب إلى مدينة «أنطاليا» التي تقع على امتداد الساحل الجنوبي الغربي لتركيا، وهي من أكبر مدن القسطنطينية «استنبول» التي تبعد عن مدينتهم أنقرة بحوالي 322 ميل تقريبًا."}, {"type": "p", "text": "كانت المدينة ذات أسوار عالية وحراس كثير، ما إن تفرغ من باب حتى يباغتك حراس الباب الثاني، فكأن هذه المدينة كلها أبواب."}, {"type": "p", "text": "ها قد وصل منصور وأمير أخيرًا إلى المكان الذي سوف يضعان فيه بضاعتهما في وسط السوق بعدما دلهما عليه أحد الحراس بعد انقضاء النهار."}, {"type": "p", "text": "وبعد أن فرغ السوق من التجار والباعة قام الاثنان بفرش الأمتعة الخاصة بهما لكي يناما بجوار البضاعة، وبعد منتصف الليل كان منصور مستيقظًا يشاهد النجوم، وما أبدع الخالق سبحانه وتعالى في هذا الكون البديع، وفي أثناء انشغاله بالتأمل والتفكير إذ فجأة هجم بعض اللصوص على بضاعتهما."}, {"type": "p", "text": "بالفعل استطاع اللصوص أخذ بعض البضائع وقاموا بالهرب، فلحق بهم منصور وهو يجري وراءهم؛ لكنه لم يستطع الإمساك بهم غير أنه استطاع كشف هوية أحدهم بعد جذب الوشاح عن وجهه، التقط منصور أنفاسه من التعب بشدة بعدما لم يستطع اللحاق بهم."}, {"type": "p", "text": "فرجع أدراجه خائبًا فلقيه أمير فقال له:"}, {"type": "p", "text": "لماذا كنت تجري؟ وأين ذهبت؟!"}, {"type": "p", "text": "رد عليه منصور بعد أن التقط أنفاسه وقال له:"}, {"type": "p", "text": "لا شيء؛ فقط بعض اللصوص قد سرقوا بعض الأمتعة."}, {"type": "p", "text": "قال أمير بوجه متعجب وبنبرة فيها من الحزن ما فيها:"}, {"type": "p", "text": "كيف ذلك؟ وماذا حدث؟"}, {"type": "p", "text": "رد عليه منصور قائلًا:"}, {"type": "p", "text": "لا شيء، لم أستطع اللحاق بهم."}, {"type": "p", "text": "قال أمير:"}, {"type": "p", "text": "والبضاعة يا منصور، ما جئنا لأجله وتحملنا المشاكل والصعاب؟!"}, {"type": "p", "text": "رد عليه منصور وقال:"}, {"type": "p", "text": "لا تجزع، كما أن الله يسر لنا أمورنا فلن يتركنا بعد ذلك، إنما كل شيء بقدر، ونحن لم نفعل أي جرم، ولم نهمل، وعسى أن يكون ذلك خيرًا."}, {"type": "p", "text": "قال أمير:"}, {"type": "p", "text": "غدًا سوف نذهب إلى رئيس هذه البلدة، فنحن ضيوف لديهم، وقد سرقنا عندهم ونحن في أول يوم، فماذا سوف نفعل بعد ذلك إن لم نضع حدًا لذلك الأمر من أوله؟!"}, {"type": "p", "text": "لم يرد عليه منصور وتركه في حيرته وذهب إلى النوم."}, {"type": "p", "text": "\"هكذا هي الغربة سوف تنال قسطًا من التعب النفسي والجسدي، وتهوى نفسك الرجوع لموطنك؛ ولكن ما حملك على الذهاب هو هدفك الذي ترحلت من أجله، ولا تحزن إن جدت لك أمور ما كانت بالحسبان؛ فأنت في الأخير لست بدارك\"."}, {"type": "p", "text": "فإن حدث لك ما حدث لهذين الرجلين وتعرضت للسرقة فاحرص على ألا تتعرض لذلك مرة أخرى."}]}, {"id": 16, "title": "مدينة قونيا التركية", "section": "story", "paras": [{"type": "p", "text": "في مدينة قونيا التركية، حيث تركنا مدينة أنقرة وراءنا في رحلة لنستمع لذلك الشيخ ونستأنف معه قصة هؤلاء الثلاثين رجلًا وما حدث معهم."}, {"type": "p", "text": "ومع ذلك، حتى الآن، لا نعرف من هو ذلك الشيخ وما هي شخصيته بالضبط، ولكن لا تقلق، عزيزي القارئ، سنكشف معًا عن ملامح شخصيته قريبًا؛ لذا فلتحضر فنجان قهوتك المعتاد ولتتابع القراءة..."}]}, {"id": 17, "title": "في بلاد الشام -- فلسطين", "section": "story", "paras": [{"type": "p", "text": "يراني أهل بيتي على غير العادة يتأملون من بعيد، ويبدو أن قلوبهم تدرك ما سيحدث لنا من أقدار."}, {"type": "p", "text": "كنا ثلاثين نفرًا من بني لخم وجزام^10، أعرف كل واحد منهم أو أغلبهم، ولكن نظرتي إلى وجوه الناس، تبدو مختلفة عما كنا نعرف، فالأبسطية التي نعتاد عليها قد غابت، والمزاج ليس هادئًا كما السابق، فكل فرد في همومه مشغول."}, {"type": "p", "text": "تحركت السفينة لتشق عباب البحر....."}, {"type": "p", "text": "نسمات الهواء في جو السماء رطبة، وهدوء الليل جميل."}, {"type": "p", "text": "أخرجت فرشًا من متاعي، وجعلته تحتي واستلقيت على ظهري، أنظر السماء فوقي وحولي، لست ممن قدر على وصف السماء الصافية قبل هذا، وما كنت أنعت الأشياء بالقول الحقيق فيها، كنت أرتجل في بعض الأحيان في وصف مزرعة المنزل وشاطئ البحر."}, {"type": "p", "text": "لطالما جلست أفكر وأتدبر في هذا الكون العظيم؛ كيف خلق بهذا الإبداع المتقن. وكنت أتعجب وتسقط بعدها تلك الأفكار الوجودية تترًا إلى مخيلتي كلما جلست أنظر السماء."}, {"type": "p", "text": "كنت أتعجب من خلق السماوات والأرض وما بينهما، ولكن أقول بعدها: فيما العجب ولهذا الكون إله خلق فهدى، ومهد فأخرج المرعى، وأنبت من السماء رزقًا ليحيي به أنعامًا وأناسي كثيرًا؟!"}, {"type": "p", "text": "الإله العظيم القادر المقتدر الخالق المبدع لا يعجزه شيء في مخلوقاته. فكل ذلك هين عنده وبقدر ومقدار خلق، وعلا وتبارك."}, {"type": "p", "text": "كانت تأخذني وأنا في حالتي تلك سِنة من التفكير في أولئك المنكرين وجود الخالق العظيم، كلما فكرت وتدبرت في عظيم قدرة الله."}, {"type": "p", "text": "أتذكر أقوالهم وأبتسم ثم أتضاحك قليلًا:"}, {"type": "p", "text": "كيف يستقيم لأحدهم وهو يعلم في قرارة نفسه أن هناك قوة خفية عظمى هي من أوجدت الكون، ومنهم من يقول بالصدفة؟!"}, {"type": "p", "text": "كيف للصدفة أن تصنع ذبابة واحدة بكل ما فيها من إتقان؟! فإذا ما قلنا لصاحب لب الآن أن هذه السفينة التي نحن على ظهرها صنعت نفسها بنفسها أو وجدت صدفة من غير صانع"}, {"type": "p", "text": "فلن يقتنع بذلك إلا مجنون."}, {"type": "p", "text": "يا سيد تميم يا بني عبد الدار أما تستيقظ وهذه الشمس طالعة نحو الأفق؟!"}, {"type": "p", "text": "قالها رجل من بني لخم إني لأعرفه جيدًا وأعرف من أي القبائل هو."}, {"type": "p", "text": "قمت وشعاع الشمس الضئيل يحوطني، وتلك الزرقة في السماء تقول إن هذا اليوم يبدو هادئًا."}, {"type": "p", "text": "بعد أن قضينا حواجنا من طعام ومتاع وأخذنا إعداد بعض أمر السفينة وهي تشق البحر وكان اتجاهنا شرقًا."}, {"type": "p", "text": "ذلك الهدوء وهذا الجو الصافي خالج أفكاري أنه هدوء ما قبل العاصفة."}, {"type": "p", "text": "بعد أن انتهينا جلست أحدث القوم حديثًا، بعض القصص عمن كان قبلنا، فقد كنت راهبًا مسيحيًا متعمقًا في المسيحية وأخبار السابقين، ولي من القصص وغيرها ما تأتي به العجائب."}, {"type": "p", "text": "سيد تميم هل تذكر لنا بقصة السابقين ممن كان مثلنا يطوف البحار؟"}, {"type": "p", "text": "إني أحدثكم حديثًا عجبًا، فاسمعوا وعوا...."}, {"type": "p", "text": "وبينما جلوس نحن على أحوالنا تلك إذا بنا بريح شديدة، وإن السفينة لتميل ميل الركوع وما السجود منها ببعيد، وإنا كنا نقعد منها مقاعد للتثبيت، فمن لم يوطن نفسها بأرض السفينة ويجعل من قدميه وتدًا يتثبت به لسقط في البحر كما يسقط الرذاذ في كل مكان."}, {"type": "p", "text": "تشق الفلك البحر شقًا، والريح تشتد والعواصف."}, {"type": "p", "text": "كنت ساندًا قدميّ بظهر صندوق خشبي به من المعدات ما يؤمل الاستناد عليه، وكنت ممسكًا بإحدى أعمدة السفينة خوف الانزلاق، والكل على هذه الحال إلا من بعض طاقم السفينة يحاولون السيطرة على الوضع، ولكن دون جدوى، فالموج عالٍ والبرق شديد."}, {"type": "p", "text": "كنت أسمعهم يقولون في خوف وفي هلع:"}, {"type": "p", "text": "لقد أضلنا الموج وضللنا وجهتنا وإنا لغائبون."}, {"type": "p", "text": "ماذا نفعل الآن وقد ضيعنا أمرنا، وليست السماء صافية حتى نهتدي بالنجوم؟ فماذا نحن بفاعلين؟"}, {"type": "p", "text": "قلت لهم وقد رأيت الخوف يسري في دمائهم:"}, {"type": "p", "text": "دعوة الله خير لنا وما لنا يد في الأسباب، وقد انقطعت أسباب الأرض ولكن الله معنا، فاطمئنوا عسى الله أن يظهر لنا من أمرنا فرجًا."}, {"type": "p", "text": "\"كلما كان الإنسان أشد تمسكًا باليقين رغم انعدام الأمل، كان قويًا لا يخشى التحديات؛ يرى بنور الحق من ظلماء الضياع\"."}, {"type": "p", "text": "ماذا نخشى والله معنا؛ ما دمنا قد أخذنا بالأسباب وتوكلنا على رب الأسباب ومسببها؟! ومن يملك الأمر وبيده مقاليد الكون إلا هو؟! ومن يرانا ويسمع حثيث قلوبنا في الليلة الظلماء؛ حيث يفتقد البدر؛ يكون الضياء بنور الله فيهدينا لعبور النهر؟!"}, {"type": "p", "text": "لا نشقن على أنفسنا بما ليس لنا قدرة عليه، لم يطلب الله منا سوى السعي والأخذ بالأسباب والتوكل عليه؛ وأما النتيجة فليس لنا منها حظ لأنفسنا، وإنما نصيبنا ما قدره الله لنا؛ وما وقع رضينا به لأنه محض خير وابتلاء؛ فمن رضي له الرضا ومن سخط فليس له من الأمر إلا ما قدره الله؛ فالرضا حق."}, {"type": "p", "text": "انتهى الشيخ من درس اليوم بعدما قال تلك الكلمات الوعظية، وترك رواد المسجد في فضول لمعرفة ما حدث مع هؤلاء القوم، وقام منصرفًا لبيته."}, {"type": "p", "text": "نترك ذلك الشيخ وتلك المدينة لنعود لمدينة أنقرة التركية لنعرف ما حدث مع أمير ومنصور ."}]}, {"id": 18, "title": "أنقرة _تركيا", "section": "story", "paras": [{"type": "p", "text": "في صباح يوم باكر، حيث يسود السكون وتتخلل الطرقات خيوط أشعة الشمس، ترتفع أصوات العصافير محلقة فوق أغصان الأشجار، ملبية الأجواء بنغماتها العذبة. تنتشر الشجيرات الصغيرة برقة على التلال، مثل نقاط خضراء تزين الطبيعة بألوانها الزاهية، الضوء الدافئ يلامس البيوت برقة، يمنحها سحرًا خاصًا، وفي هذا الهدوء العميق تتحرر النفس من الهموم، تغتسل براحة تامة، ومن أعماق العزلة ينبعث صفاء الروح، كاشفًا عن جوهرها الأصيل."}, {"type": "p", "text": "في هذا الجو الجميل استيقظ أمير صباحًا باكرًا لكي ينتهي من العمل ويجد متسعًا من الوقت ليذهب إلى قضاء المدينة ليقص الأمر على الحاكم."}, {"type": "p", "text": "عندما وصلا إلى عتبة القصر، استقبلهما حراس بوجوه جامدة، لكنهم أفسحوا لهما الطريق باحترام. عبر البهو الفسيح، كانت خطواتهما تصطدم بأصوات أقدامهما المترددة، في ذات الوقت كان المنظر بديعًا وصوت المياه المنسابة في الجداول يزيد المكان روعةً وهدوءًا."}, {"type": "p", "text": "تلك المساحة الكبيرة التي تكسوها الخضرة تفتح ذراعيها لمنصور وأمير، وقد أحاطت بهما حدائق مترفة تمتد على مدى البصر، تحت أقدامهما، تبدو المروج الخضراء كأنها بساط من الحرير، يتناغم مع زهور يافعة ذات مناظر جذابة تنمو على طول الطريق المؤدي إلى القصر."}, {"type": "p", "text": "البهو الجميل أمامهما يكتظ بالكراسي الموزعة في كل ركن، وكأنها تنتظر حضورًا كريمًا لتحتفي به. هنا، تعزف الطبيعة لحنًا هادئًا من خلال جداول الماء التي تهمس بلطف في كل زاوية، وأشجار باسقة تصطف كحراس مخلصين لبساتين خضراء ممتدة."}, {"type": "p", "text": "كان منصور وأمير يمشيان بترددٍ لا يخفيانه، يتبادلان النظر بينهما وبين تلك المناظر البديعة التي تبدو كأنها عالم آخر. القصر الذي يقف شامخًا أمامهما، ببواباته المزخرفة ونوافذه المطلة على حدائق ملكية، كان ملاذًا للملوك ومكانًا حيث تُرفع الشكاوى وتُستعاد الحقوق، في خطاهما المتأنية نحو البهو، كانا يحملان في قلوبهما ثقل سرقة بضاعتهما، وآمالهما معقودة بأن يجدا عند الملك نصرة وعدل."}, {"type": "p", "text": "عندما اقتربا من بهو القصر أشار إليهما حارس البهو إلى الدخول من الباب الخلفي لأن الباب الأمامي غير مسموح بالعبور إلا للسادة المهمين لدى الحاكم، فلا يعبر منه سائر الناس."}, {"type": "p", "text": "عندما دخلا من الباب الخلفي أشار إليهما الحارس بالاستمرار في العبور إلى آخر الطرقة ثم الانتظار لحين السماح لهما بالدخول."}, {"type": "p", "text": "في أثناء عبورهما تلك الطرقة كان أمير ينظر إلى جمال الزخارف والنقوش على جدران وأعمدة الطرقة التي يغلب عليها الطراز الهندسي، كان أمير كلما مر بشيء أعجبه أشار به إلى منصور رغم صمته غير الاعتيادي، واستمر في ذلك إلى أن وصل نهاية الطرقة، ثم وجدا في النهاية بابًا وحارسًا يقف عليه وبعض من المقاعد للجلوس، جلسا كما أشار إليهما الحارس."}, {"type": "p", "text": "وفي نفس الوقت على الجانب الآخر ومن بعيد حيث نستمع لصوت خطوات الأرجل في كل مكان وفي وسط قرية صغيرة بمدينة أنقرة تدعى «إيلا» قريبة من المدينة، وفي ركن هادئ نسمع تلك الأصوات العالية والصراخ."}, {"type": "p", "text": "وقف رجل عظيم الجثة ذو ملامح تأذن بالشر وبصوت جهوري يصرخ بفتاة ويقول بصوت مرتفع بعض الشيء:"}, {"type": "p", "text": "أيتها الحمقاء، ماذا أصابك؟!هل جننت؟! قد كشف أمرنا بسببك وبسبب غبائك."}, {"type": "p", "text": "قال ذلك زعيم اللصوص لتلك الفتاة التي كشف وجهها بسبب منصور بعد أن لحقهم."}, {"type": "p", "text": "ثم هددها قائلًا:"}, {"type": "p", "text": "أيتها الساقطة إن اعترفت علينا فسوف اقتلك فاحذري جيدًا."}, {"type": "p", "text": "في بهو القصر وقف الاثنان بعدما تم السماح لهما بالمثول بين يدي الملك، دخلا يتمشيان ببطء وهما ينظران ما تسقط عليه أعينهما؛ تلك الجدران المهيبة ذات النقوش الزخرفية التي سقطت عليها أشعة الشمس القادمة من أعلى فتحات سقف القصر في وقت تعامد الشمس فوق ساحته، ذلك العرش العظيم الذي يبدو كقطعة أثرية من أزمان سحيقة، موضع استراحة اليدين منه كفروة نمر قطبي لامعة، وذلك اللون الذهبي الذي يزين حواف العرش، سماع صوت ستائر النوافذ الخشبية الكبيرة ذات الطراز الهندسي عندما تهب الرياح التي امتزجت مع رائحة العطر الفخمة المصاحبة لخطوات الأرجل القادمة من الداخل، تلك البهرجة اللامعة في الأعين تبعث في النفس شعور الطمأنينة والراحة رغم شعور القلقة والتوتر لمَّ وصل ذلك الرجل..."}, {"type": "p", "text": "وقف جميع من في المجلس احترامًا وتبجيلًا لدخول الملك."}, {"type": "p", "text": "وأثناء ذلك يدخل عليهما رجل ضخم الجثة عريض الاكتاف يحمل فوق كتفيه فروه الدب القطبي الأبيض، رجل بلا شعر، أصلع ويحمل في يده اليمنى عصاه وفي الأخرى يرتدي الحلي في أصابع يديه."}, {"type": "p", "text": "جلس الملك وجلس الحضور ونادى مسئول المجلس على من يحمل شيئًا يود عرضه على الملك مع وضع الشروط التي منها: إن كان ما جاء به المدعي تافهًا وأمرًا غير مهم فحكمه السجن، بل والقتل أحيانًا على حسب ما جاء به."}, {"type": "p", "text": "قدم أمير ما جاء من أجله وعرضه على الحاكم فلم يسر الحاكم ما سمعه من أمير وأمر بإحضار كل من المشتبه بهم، وبعد مضي ساعة من الوقت وصل كل المشتبه بهم وقد كانت نفس الفتاة من بينهم فقد تمكنوا من القبض عليها بسبب سابقة ما عليها من قضايا."}, {"type": "p", "text": "اصطف المشتبه بهم أمام منصور كان منصور يحدق بالفتاة ويتذكر ما حدث."}, {"type": "p", "text": "ثم باغته القاضي أو الوزير بقوله:"}, {"type": "p", "text": "أي من هؤلاء قد تسبب في سرقة متاعكم."}, {"type": "p", "text": "بعد لحظات من الصمت تحدث منصور وقال:"}, {"type": "p", "text": "ليس من هؤلاء من سرق متاعنا يا سيدي."}, {"type": "p", "text": "رد عليه الوزير وقال:"}, {"type": "p", "text": "هل أنت متأكد مما تقول؟ أليس من بينهم من فعل فعلته؟"}, {"type": "p", "text": "فأجاب عليه بالنفي مرة أخرى."}, {"type": "p", "text": "وقف الملك من مجلسه فصمت الجميع، وعم الهدوء المكان وخيم الاستماع على آذان الجميع، سيستمعون كلمة الملك:"}, {"type": "p", "text": "يا هذا، ماذا هنالك؟ فهل أنت واثق مما تقول؟"}, {"type": "p", "text": "قالها الملك لمنصور بجدية وحزم وباهتمام لمعرفة الجاني، ثم أطرق قائلًا:"}, {"type": "p", "text": "انظر، فقد أحضرنا لك من هم مشتبه بهم أفلا يكون الجاني واحدًا منهم إذا كنت متأكدًا؟!"}, {"type": "p", "text": "فرد عليه منصور قائلًا:"}, {"type": "p", "text": "يا سيدي إني لمتأكد مما أقول فليس منهم من فعل ذلك."}, {"type": "p", "text": "أشار الملك إليه بأن يكف عن الكلام بعد أن توجه نحو عرشه ثم جلس عليه وقال:"}, {"type": "p", "text": "ألا تدري أن عقوبة من يستهين بحكم الملك وحاشيته البقاء في السجن حتى الموت؟!"}, {"type": "p", "text": "أجاب المنصور:"}, {"type": "p", "text": "قد علمت ذلك قبل الدخول ولو كنت قد أتيت لأستهين بكم وبحكمكم ما كنت لأتجرأ على الدخول عليكم بعد علمي بالعواقب."}, {"type": "p", "text": "ثم أطرق قائلًا:"}, {"type": "p", "text": "وإن كنت تود أن تلقي القبض عليَّ فأنا رهن مشيئتك فافعل ما تراه صائبًا، وما جئنا هنا إلا بحق، وما جئنا لنفسد في الأرض."}, {"type": "p", "text": "تعجب الملك من مقالته وقال:"}, {"type": "p", "text": "يبدو أنك رجل فطن وذو حكمة، وأنك لا تدعي الكذب وأنك صادق، لذا فاذهب في أي مكان من مدينتنا شئت وأي وقت شئت ولن يتعرض لك أحد مطلقًا بعد اليوم إن شاء الله، فإنما قد يسوءك ما يسوءني، فاذهب في سلام ولك مني وعد على إعادة ما سرق منك ومعرفة المتسبب في ذلك إن أمكن."}, {"type": "p", "text": "وقبل خروج منصور وأمير من القصر أخذهما الحارس الخاص وأعطاهما ما يثمن بضاعتهما ثم انصرفا."}, {"type": "p", "text": "هل أنت جاهز عزيزي القارئ لنسافر عائدين لمدينة قونيا لنستمع مع الناس بقية قصة تميم الداري وبني لخم وجزام؟ لنعرف تفاصيل الحكاية فلتكن مستعدًا للانطلاق، فهناك تفاصيل أخرى لم تحكَ بعد."}, {"type": "p", "text": "تحت سماء زرقاء صافية، انطلقت رحلتنا إلى مدينة قونية الجميلة، حيث كانت الرياح العليلة تداعب وجوهنا ونحن نسير عبر الطرق المعبدة بأحجار قديمة تروي حكايات الزمن."}, {"type": "p", "text": "على جانبي الطريق، تزينت الأشجار بأوراقها الخضراء الوارفة، وامتدت حقول الزهور بألوانها الزاهية كأنها بساط سحري يفترش الأرض."}, {"type": "p", "text": "عبرنا بساتين الفواكه المورقة، حيث كانت أشجار التفاح والرمان تتراقص في نسيم الصباح العليل، وفاحت رائحة الأزهار البرية في الهواء النقي، ازداد جمال المناظر الطبيعية كلما اقتربنا من قلب المدينة، حتى ظهرت أمامنا قونية بكل بهائها ورونقها، مدينة يمتزج فيها عبق التاريخ مع حيوية الحاضر."}, {"type": "p", "text": "مع وصولنا إلى المسجد الكبير في قونية، بدت مآذنه شامخة في السماء، وزخارفه المعمارية تحكي قصصًا من الفن الإسلامي العريق، كان المسجد يتحلى بأبهى حلله، تحيط به حدائق غناء تحتوي على أزهار متنوعة تتفتح بألوانها المختلفة، مكونة لوحة فنية بديعة."}, {"type": "p", "text": "دخلنا إلى ساحة المسجد، وكانت تعج بالناس الذين جاءوا من كل حدب وصوب للاستماع إلى الشيخ، كانت الساحة مليئة بالحركة والحياة، الجميع يتبادلون الأحاديث بروح مفعمة بالحماس والانتظار، ارتفعت تكبيرات المصلين ودعواتهم، مكونة سيمفونية روحانية تملأ المكان بالسكينة والطمأنينة."}, {"type": "p", "text": "دخلنا إلى قاعة المسجد الفسيحة، حيث كان النور يتسلل من النوافذ المزخرفة، مضفيًا جوًا من الهدوء والقدسية، الأرض مفروشة بسجاد فاخر يتناغم مع الزخارف الجدارية المدهشة التي تحكي قصصًا من التراث الإسلامي، كان الرجال والنساء يجلسون في صفوف منتظمة، يتحدثون بصوت خافت وينتظرون بلهفة بدء درس الشيخ."}, {"type": "p", "text": "في وسط المسجد، كان هناك منبر خشبي متقن الصنع، عليه نقوش وأشكال هندسية رائعة، وقف الشيخ بملابسه التقليدية البيضاء، مهيبًا ووقورًا، يقرأ في كتاب قديم، بين الحين والآخر، كان يرفع عينيه ويلقي نظرة محبة على الحضور، وكأنه يطمئن على استعدادهم للاستماع."}, {"type": "p", "text": "حان الوقت، وبدأ الشيخ في الحديث بصوت عذب وقوي، يخترق القلوب والعقول: \"أيها الأخوة والأخوات، اليوم نستكمل قصة الثلاثين رجلًا الذين كانوا في السفينة البحرية وضللهم موج البحر عن سبيلهم...\". كانت كلماته تحملنا إلى عالم آخر، حيث تتجلى الحكمة في كل جملة يرويها."}, {"type": "p", "text": "تسمّرت الأنظار على الشيخ، وعمّ الصمت القاعة، وكأن الزمن قد توقف ليستمع الجميع إلى هذه الحكاية التي تنتقل من جيل إلى جيل. الأطفال كانوا يجلسون بالقرب من آبائهم، عيونهم الواسعة مفعمة بالفضول والإثارة، يستمعون بإنصات وكأنهم يخشون أن تفوتهم أي كلمة."}, {"type": "p", "text": "في هذا المكان، تحت سقف المسجد الكبير في قونية، تلاقى الناس من مختلف الأعمار والخلفيات، يجمعهم حب المعرفة والتعلم، والتوق إلى سماع حكم الحياة والتاريخ، وحب ذلك الشيخ....:"}]}, {"id": 19, "title": "بحر الشام 628 _ م", "section": "story", "paras": [{"type": "p", "text": "لقد أضلنا الموج عن الطريق بعد أن كنا في هدى عن الوصول"}, {"type": "p", "text": "وحال بيننا الموج فكنا من التائهين، ضرب بنا البحر والموج أيامًا لا ندري أين نحن، ولا إلى أين غايتنا بعد هذا."}, {"type": "p", "text": "هكذا مر الأسبوع الثاني ونحن ما زلنا في عرض البحر، نرى ونسمع ظواهر الطبيعة من برق ورعد وأمواج عاليات."}, {"type": "p", "text": "وبينما أنا جالس رافع بصري نحو السماء إذ أتاني نفر من قومي فسألوني عن ما نحن فيه وأكثروا علي من السؤال، وأنا أقول:"}, {"type": "p", "text": "\"الله اعلم\"."}, {"type": "p", "text": "ألست يا سيد تميم راهبًا عندك من العلوم والمعرفة ما يجعلك متبصرًا بالنوازل؟!"}, {"type": "p", "text": "فأجبتهم قائلاً:"}, {"type": "p", "text": "قد يعلم الجاهل شيئًا غاب عن العالم، ويفتح الله عليه، ولسنا ممن يدعون معرفة بكل المجريات، والحق إنَّا لا ندري أشر أريد بنا أم خير، ونرجو أن يكون الأخير، والله أعلم."}, {"type": "p", "text": "ألا تسأل لنا نفر من الجن فقد سمعنا بأنهم هاتفوك قبلًا وكنت بهم أبصر."}, {"type": "p", "text": "من أخبركم هذا؟!"}, {"type": "p", "text": "لا علم لنا سوى ما سمعنا متداولًا في بعض جنبات القرية."}, {"type": "p", "text": "هذا حديث واهم، وإنما حلم قد رأيت، أذكر أني قد خرجت إلى الصحراء ذات يوم ونمت فيها فسمعت هاتفًا من الجن يقول:"}, {"type": "p", "text": "\"قد خَرج رسول الأُميين^12، رسول الله، وصلينا خلفه بالحَجُون^13، وأَسْلَمنا واتَّبَعْناه، وذهب كيد الجن، ورُمِيَتْ بالشُّهُب."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "وما رسول الأميين."}, {"type": "p", "text": "قلت:"}, {"type": "p", "text": "رسول من العرب يخرج فيهم، ويظهر عليهم ويكون لرسالته نبأ عظيم، وتبلغ رسالته ما بلغ الليل والنهار."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "أوما كنت مصدقًا هذه الرؤيا؟"}, {"type": "p", "text": "قلت:"}, {"type": "p", "text": "بلى والله مصدقها."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "كيف وأنت على المسيحية."}, {"type": "p", "text": "\"أما وقد سألتم فإن بها نبأ عن هذا النبي، وما كنت مصدقًا الرؤيا لولا أن عندنا ذكرًا عن نبي آخر الزمان، ولكن كان في نفسي شيء، إذ إني لا أصدق الجن وإن أقسموا، ولعمري إن حدثت بها أحدهم ليقولن:"}, {"type": "p", "text": "إنما هو كاهن في كهف لا راهب في كنيسة، إنما يعلمه جان، فهو يأخذ ويروي عنهم نبأ من كان قبلهم ونبأ ما بعدهم، وآثرت أن يصلني خبر أراه رأي العين ولربما\"."}, {"type": "p", "text": "\"انتهى الشيخ سريعًا من درسه اليوم واعتذر من رواد المسجد بسبب أن زوجته طلبته لأمر مهم، انصرف بسرعة، تاركًا الحضور يتساءلون عن سر اعتذاره، وهو يخفي داخله توترًا لا يمكنه التخلص منه\"."}]}, {"id": 20, "title": "مدينة أنقرة التركية", "section": "story", "paras": [{"type": "p", "text": "\"عاد منصور وأمير إلى مدينة أنقرة، حاملين معهما ليس فقط بضاعتهما بل أيضًا أحلامهما المتعثرة وتوتراتهما الداخلية، يتعمق كل منهما في رحلته الشخصية، يبحثان عن معنى الحياة والإيمان، فيما يشهدان التباينات الثقافية بينهما تزيد من تعقيد علاقتهما\"."}, {"type": "p", "text": "وفي أثناء انشغال منصور وأمير بالبيع، فجأة وقفت أمام منصور تلك الفتاة بمظهر محتار، وتنبأ هو برغبتها في معرفة السبب وراء تصرفه."}, {"type": "p", "text": "زمرد تقدمت إلى السوق حيث كانت تعلم أن منصور يعمل هناك. تظاهرت بشراء بعض البضائع، لكنها كانت ترغب في معرفة السبب الحقيقي وراء سلوكه."}, {"type": "p", "text": "\"لماذا لم تعترف عليّ وأنت تعلم أنني الفاعلة\"؟"}, {"type": "p", "text": "قالت بحزن واضطراب، في انتظار الرد، لكن منصور لم يرد وظل صامتًا، فتابعت قائلة:"}, {"type": "p", "text": "\"لماذا لم تقل أنني الفاعلة؟ حتى لو كنت تعرف أنه يمكنك الإبلاغ عني وسجني، لماذا كنت مستعدًا للتضحية بهذا\"؟"}, {"type": "p", "text": "بعد لحظات من الصمت، أخيرًا فتح منصور شفتيه وقال بهدوء:"}, {"type": "p", "text": "\"لأني شعرت بأن هناك سببًا وراء أفعالك، ولم أكن أرغب في تدمير حياتك."}, {"type": "p", "text": "شعرت بالرغبة في مساعدتك بعدما رأيتك، أيضًا لاحظت بعض الشبه بينك وبين أمي في بعض الصفات والملامح\"."}, {"type": "p", "text": "زاد الصمت قليلًا، ثم حرك منصور شفتيه مجددًا وأكمل:"}, {"type": "p", "text": "\"أنا أؤمن بأن الخير يكمن في الأشخاص حتى لو كانوا يبدون بمظاهر أخرى، ولذا قررت أن أعطيك الفرصة لتظهري الجانب الحقيقي الذي فيك\"."}, {"type": "p", "text": "انتهى الحوار بينهم وذهبت ثم جلس منصور في تلك الليلة الهادئة التي تنعم بالنسيم والهواء النقي، كان مستيقظًا يفكر في أمر تلك الفتاة، حتى غلبه النعاس، وفجأة؛ دخلت فتاة الغرفة بسرعة وأيقظته من نومه، ثم طلبت منه المساعدة لحمايتها من لصوص قتلة اعترفت عليهم؛ استجاب منصور على الفور وانطلق لحمايتها."}, {"type": "p", "text": "بينما كانا يحاولان الهروب، تقدم اللصوص نحوهما بأسلحتهم، فقام أحدهم بالجري نحو منصور وهاجمه بسكين، لكن منصور تصدى له بلا حماية وأوقعه قتيلًا!"}, {"type": "p", "text": "استيقظ منصور بصدمة، فقد كان كابوسًا مروعًا، بعد رؤيته لتلك الكوابيس، بدأ يخشى على زمرد من خطر اللصوص الذين قد يعتبرونها تهديدًا لهم بعد إدلائها بالشهادة ضدهم."}, {"type": "p", "text": "ذهب يبحث عن زمرد وسأل الجيران حتى عرف مكان إقامتها، عندما وجدها، شاركها بمخاوفه ونصحها بالابتعاد عن الأماكن العامة حتى يتم القبض على اللصوص."}, {"type": "p", "text": "وبعد أسابيع من البحث، تم القبض على اللصوص وأُحيلوا إلى السجن، أصبحت زمرد حرة وآمنة، لكنها تعلقت بمنصور بشدة بعد مساعدته لها، ومن جهته، بدأ منصور يشعر بمشاعر قوية تجاهها بعد مرور شهرين في تلك البلدة."}, {"type": "p", "text": "لم يتمكن أحد من إعاقة منصور بعد أن ألقى الملك القبض على اللصوص، ومع ذلك، كان زعيم العصابة لا يزال حرًا ويخطط للانتقام."}, {"type": "p", "text": "\"لا بد أن يدفع هؤلاء الأغبياء ثمن أفعالهم، خاصة تلك الفتاة التي خانتنا وكشفت عنا للشرطة\". قال ذلك زعيم العصابة وهو يفكر في الانتقام."}, {"type": "p", "text": "علم منصور بالخطر المحدق بزمرد بعد إدلائها بالشهادة، وحاول أن يكون دائمًا بجانبها لحمايتها، فقرر الابتعاد عن التجارة والعودة إلى بلده أنطاليا، وأخبر أمير بقراره."}, {"type": "p", "text": "انتهى الأمر برحيل منصور عن التجارة وبقاء أمير في تجارته، ورغم ذلك، فإن حب منصور لزمرد بقي قويًا وثابتًا حتى بعد مغادرته للمكان إلى مسقط رأسه أنطاليا^14؛ فقد قرر أن يساعدها ومن ثم يرحل عائدًا لموطنه."}, {"type": "p", "text": "ونعود نحن إلى قونيا حيث نستأنف قصتنا مع الصحابي تميم الداري والثلاثين رجلًا الذين سوف يستأنف لنا قصتهم الشيخ."}, {"type": "p", "text": "وها نحن الآن على مشارف المدينة وننظر من بعيد فنرى الناس تتجمع للصلاة من كل حدب وصوب ليشهدوا ما سوف يقص عليهم من نبأ عظيم؛ حيث بدأ الشيخ يتلو آيات من القرءان قبل أن يبدأ ثم استأنف القصة....."}]}, {"id": 21, "title": "في عرض البحر: 528 للميلاد.", "section": "story", "paras": [{"type": "p", "text": "\"في سكون البحر العميق، بدأت الشمس تتسلل ببطء من وراء حدود الأفق، ملونة السماء الباسقة بألوانها البرتقالية النديّة والأزرق العميق. كأنها فنانة ماهرة، غمرت الشمس بريقها الذهبي الدافئ السفينة المتأرجحة، وصقلت بأشعتها الخافتة طاقم الرحلة الصامت، مذهلة الجميع بسحرها الخفي وسط هذا المحيط الهادئ الذي لا يعرف عنه الإنسان سوى أنه هادئ حين يهدأ، ولكنه لا يعلم ما الذي يخبئه هذا الهدوء المطلق من عاصفة قوية قادمة ليدمر كل ما يقف أمامه في البحر."}, {"type": "p", "text": "ها نحن أولاء على متن السفينة وقد هدأ كل شيء، وباتجاه مكان غريب لا ترى ملامحه من بعيد يوجد دخان كثيف، بعد دقائق من الاقتراب قد اتضح أن المكان جزيرة نائية في البحر."}, {"type": "p", "text": "رست السفينة على الشط وكان في وقت المغيب، جلسنا في أقرب السفينة ننتظر ما عسانا نفعل ونتفكر ونتساءل ما هذا المكان.."}, {"type": "p", "text": "هل نحاول العودة أم ننتظر حتى الصباح ثم نغادر صباحًا؟"}, {"type": "p", "text": "قال ذلك أحد الرجال، فأجاب بعضهم:"}, {"type": "p", "text": "لعلنا لن نستطيع الذهاب في هذا الجو وفي ذلك الظلام"}, {"type": "p", "text": "نستريح ونتبلغ بالزاد لغد."}, {"type": "p", "text": "عندما قرروا الدخول حطوا رحالهم ثم توجهوا إلى الداخل رغم توجسهم خيفة من المكان؛ فدخلوا إليها يلتمسون الماء."}, {"type": "p", "text": "ما أشد غرابة تلك الجزيرة، إنها لنائية والطريق إليها غير واضح المعالم، نزعم أنه ما من أحد سبقنا إلى هنا قبل وما كان لأحد بعد غاية فيها."}, {"type": "p", "text": "الأرض لها رائحة غريبة، دخان في كل مكان، رأينا مدخل ذلك الكهف في الجزيرة من بعيد، ونحن نحط خطانا إذ يستقبلنا ذلك الشيء؛ كائن غريب لا ندري ما كينونته ولا يعرف قبله من دبره؛ لا ندري أين رأسه من قدميه."}, {"type": "p", "text": "هاقد انتهى درس اليوم وأنصرف ذلك الشيخ علاء الدين بطل قصتنا إلى منزله."}, {"type": "p", "text": "رجل يبلغ من العمر 55 عام قد قضى جلها، في خدمة الدين وإيصاله للناس، ولد في مدينة بلخ^15 إحدى مدن أفغانستان."}, {"type": "p", "text": "ثم انتقل منها ورحل إلى قونيا إحدى مدن تركيا طلبًا للعلم ورؤية تاريخ وآثار المدينة والتي بها متحف جلال الدين الرومي؛ والذي يشبه شخصيته في كثير من الأمور، أيضًا بسبب الغزوات المغولية، ثم استقر في قونيا."}, {"type": "p", "text": "قد انهى حفظ القرءان الكريم في طفولته، ودرس الفقه والحديث وبعض العلوم على يد مشايخه في بلده ثم رحل لاستكمال رحلته العلمية، ورغم كونه قد حصل من العلوم الكثير لم يكتفِ بذلك، فكان هذا من ضمن الأسباب التي جعلته يتقلد منصب إمام مسجد قونيا الكبير."}, {"type": "p", "text": "وفي سن ال 32 سافر إلى بغداد عاصمة العراق؛ والتي كانت موطنًا للعديد من العلماء والفلاسفة، وكانت مكانًا زاخرًا بالعلوم والمعارف حيث تتلمذ على إيدي الشيوخ والعلماء، ثم عاد ليستقر في مدينة قونيا مرة أخرى ويمسك منصب إمامة مسجد قونيا الكبير."}, {"type": "p", "text": "هو رجل ما بين الطول والقصر وشعر رأسه بني ناعم كموج مياه، منسدل حتى كتفيه، قد خالطه بياض الشيب وعيناه كأنها سماء مظلمة في ليلة صافية شديدة الضياء، ذو جسد نحيل وفي وجهه خال عند عينه اليمنى."}, {"type": "p", "text": "كان رجلًا يتحلى بالشجاعة والذكاء، والهدوء والقيادة، قد نشأ في بيئة بسيطة، ولكنه كافح حتى حصل العلوم والمعارف من شتى الأماكن."}, {"type": "p", "text": "وكان رجلًا محبًا للخير، يساعد الآخرين ويأثرهم على نفسه."}, {"type": "p", "text": "نترك قونيا ذهابًا لأنقرة لنتعرف على بطل قصتنا الثاني منصور حيث يمكث في مسقط رأسه أنقرة."}, {"type": "p", "text": "منصور"}, {"type": "p", "text": "رجل في منتصف الثلاثينات من عمره، يبلغ طوله حوالي 180 سم، ذو بنية قوية وملامح حادة."}, {"type": "p", "text": "بشرته داكنة قليلًا، وشعره قصير ومجعد بلون أسود، وعيناه بنيتان داكنتان تعكسان ذكاءً وعمقًا داخليًا."}, {"type": "p", "text": "لديه ندبة صغيرة على حاجبه الأيمن، ذكرى لحادثة في طفولته."}, {"type": "p", "text": "منصور يتمتع بشخصية جذابة وقوية؛ فهو شجاع ومصمم على تحقيق أهدافه، لكنه أيضًا يتمتع بلطف ورقة عند التعامل مع الآخرين."}, {"type": "p", "text": "يحب مساعدة من حوله، خاصة الفئات الضعيفة والمهمشة، مما يكسبه احترام وتقدير الجميع."}, {"type": "p", "text": "وهو يتمتع بذكاء حاد وسرعة بديهة، لكنه يميل أحيانًا إلى التفكير الزائد والتحليل العميق، مما يجعله مترددًا في اتخاذ بعض القرارات."}, {"type": "p", "text": "نشأ منصور في حي شعبي مكتظ بالسكان، وسط عائلة صغيرة ومعيلة."}, {"type": "p", "text": "منذ صغره، كان يعمل بجد لدعم أسرته، مما زرع فيه روح الاجتهاد والتفاني."}, {"type": "p", "text": "بفضل إصراره وعمله الشاق، تمكن من الحصول على صفقة تجارية ببلاد أنقرة التركية في إحدى فئات التجار المرموقة، حيث تاجر لفترة كبيرة، وأصبح ناجحًا وذا خبرة."}, {"type": "p", "text": "في مهنته كتاجر، عُرف منصور بنزاهته وحرصه على إيصال الحق لإصحابه."}, {"type": "p", "text": "غالبًا ما كان يدافع عن المظلومين، ويساعد المحتاج ويدافع عنه."}, {"type": "p", "text": "على مر السنين، تطور منصور من شاب طموح إلى قائد ملهم."}, {"type": "p", "text": "نراه يواجه تحديات كبيرة، سواء على المستوى المهني أو الشخصي. يمر بمواقف تجبره على إعادة تقييم مبادئه وأولوياته، ولكنه في النهاية يخرج منها أقوى وأكثر حكمة، يصبح منصور رمزًا للشجاعة والصمود، وقدوة يحتذي بها الكثيرون."}, {"type": "p", "text": "نترك مدينة أنقرة التركية عائدين إلى قونيا حيث نتابع تطور الأحداث مع الشيخ علاء الدين وماذا حدث بعد ذلك، لذا عزيزي القارئ فلتحضر مشروبك المفضل ولتتابع الرحلة."}]}, {"id": 22, "title": "مدينة قونيا التركية (1/2)", "section": "story", "paras": [{"type": "p", "text": "على إحدى الحانات في أحياء قونيا الشعبية في تمام التاسعة مساءً."}, {"type": "p", "text": "رياح شديدة تهب من جهة الشمال، أوراق الأشجار تتساقط كحبات المطر، غبار كثيف ملأ كل مكان خاصة تلك الشرفة المطلة على الطريق المتجه لشارع المقاهي، وهناك عند الحانة يجلس ذلك الرجل رث الثياب ذو البشرة السمراء والشعر المجعد، وفي يده زجاجة النبيذ."}, {"type": "p", "text": "ومن بعيد نرى ذلك الشيخ علاء الدين قد خرج باتجاه مسجد قونية الكبير. وبينما هو يمشي ومر من أمام الحانة إذ رآه ذلك السكير؛ فما أن رآه إلا وخرج يستهزئ به، ولسان حال الشيخ يقول في صمت:"}, {"type": "p", "text": "سلامًا لا نبتغي الجاهلين."}, {"type": "p", "text": "كان الشيخ ذاهبًا لصلاة العشاء ولدرس ما بعد الصلاة."}, {"type": "p", "text": "كان ذلك السكير كلما مر من أمام المسجد وسمع الشيخ يتحدث عن علامات الساعة وذكر ملاحم آخر الزمان كان يستهزئ بما يقول ولم يسمح لنفسه في التعرف على صدق ذلك، ولكن ذلك الشيخ أخلاقه ودينه أبدًا ما سمحا له بأن يرد له ما يفعل لعل يومًا يأتي ويكتب له الله الهداية لمَّ يرى من الحق وكان كلما رآه قال:"}, {"type": "p", "text": "متى تكون الملحمة مولانا؟."}, {"type": "p", "text": "ولا يجيب الشيخ إلا بسلام لا نبتغي الجاهلين."}, {"type": "p", "text": "في أنقرة، تلك المدينة التي تمتد بين صفحات التاريخ والحاضر، كانت الشمس تتسرب ببطء من وراء الأفق، تنثر أشعتها الذهبية على قلعة أنقرة القديمة التي تعلو التلة كحارس أمين، يحرس أسرار الزمن وأمانات الأجيال."}, {"type": "p", "text": "المدينة تستيقظ على وقع خطى ساكنيها، تحمل في طياتها رائحة القهوة الطازجة المنبعثة من المقاهي الصغيرة المنتشرة في الأزقة."}, {"type": "p", "text": "عند الفجر، عندما تبدأ المدينة في التنفس بعمق، تتسلق أشعة الشمس جدران المباني في حي >>كيزيل آي<<، تتسلل إلى النوافذ الضيقة لتداعب وجوه النائمين، وتوقظهم بلطف من أحلامهم."}, {"type": "p", "text": "في ذلك الحي، حيث تتعانق الأبنية الحديثة مع لمسات التاريخ، تعبر الأشعة الأولى فوق رءوس المآذن العالية، تتراقص فوق القباب، ترسم ظلالًا طويلة على الأرصفة. صوت المؤذن يرتفع من جامع حاج بيرم^16، يختلط مع زقزقة العصافير، يشكل سيمفونية صباحية تبعث في النفوس سكينة وطمأنينة."}, {"type": "p", "text": "الشوارع الضيقة تفتح ذراعيها للعابرين، الباعة المتجولون يبدأون في ترتيب بضاعتهم، ورائحة الخبز الطازج تملأ الهواء، تعلن بدء يوم جديد مليء بالأمل والعمل."}, {"type": "p", "text": "الميادين العامة تحتضن تماثيل مصطفى كمال أتاتورك، تقف هناك بشموخ، تراقب المدينة التي استنهضها من رمادها."}, {"type": "p", "text": "وفي حدائق جينتشليك باركي^17 التي تزين قلب أنقرة، تنتشر الورود بألوانها الزاهية، تستقبل نور الصباح بفرح، وكأنها تحتفل ببداية يوم جديد. الأطفال يركضون بين الأشجار، ضحكاتهم ترن كأجراس صغيرة، تملأ الجو ببهجة خالصة."}, {"type": "p", "text": "تستعد أنقرة ليوم آخر من العمل والحياة، مدينة تحمل في طياتها روح الماضي وجسارة المستقبل، كل حجر، كل زاوية، تحكي قصة، وتشهد على حياة تتجدد كل صباح مع شروق الشمس."}, {"type": "p", "text": "وفي يوم تتجدد فيه الحياة بالنشاط، وتتبدل فيه ملامح الأمس عن اليوم، تتفتح فيه الزهور الناضرة من أغصانها كتيجان الملائكة لتتدلى على قارعات الطرق والمباني، وتلك الأشجار المتقطعة على أطراف الجبال، والشجيرات الكثيفة المتناثرة في وسط الحقول، وتلك البنايات التي يغلب عليها الطراز العثماني، الذي تتسلل أشعة الشمس من خلالها تسقط على الشوارع والحقول والقصور."}, {"type": "p", "text": "وبعد شروق الشمس قام منصور بحمل ما استطاع من البضاعة فلمَّا حضر عند التل في تمام الوقت كما أخبره زعيم العصابة."}, {"type": "p", "text": "بعدما اختطف زمرد، ولما وصل للمكان إذ خرج عليه زعيم العصابة وعدد من الأفراد."}, {"type": "p", "text": "فقال منصور:"}, {"type": "p", "text": "أين الفتاة؟ فقد اتفقنا.."}, {"type": "p", "text": "قال زعيم العصابة:"}, {"type": "p", "text": "نعم لقد اتفقنا وهي بالحفظ والصون، لكن دعهم يأخذون البضاعة أولًا."}, {"type": "p", "text": "قال منصور:"}, {"type": "p", "text": "كلا لن يقترب أحد من بضاعتي إلا برؤية زمرد."}, {"type": "p", "text": "طبعًا لم يعجبه هذا الكلام فأمر جنوده بأخذ البضاعة عنوة، ثم بعد ذلك قاموا بإطلاق سراح الفتاة فوجدها منصور خارجة من وراء تلك الصخرة الكبيرة التي خرجوا على منصور منها فجأة بدون أن يشعر بهم، وتركوا الفتاة وهموا بالرجوع من حيث أتوا."}, {"type": "p", "text": "وبينما زعيم العصابة يُؤَمِّن على ما تم نهبه من منصور، نظر إليه وهو يبتعد عنه خطوة فخطوة أمام ناظريه، ثم نظر إليه نظرة غضب وقال في حزم:"}, {"type": "p", "text": "إياك أن تخبر أحدًا أو حتى جنود الملك، لأنك لو فعلت لن تسلم مني أبدًا يا هذا؛ إياك."}, {"type": "p", "text": "عاد منصور إلى مكان البضاعة ثم جمع أمتعته لكي يرحل ويترك المدينة نهائيًا بلا رجعة، وذلك بعد أن أوصل «زمرد» إلى مكان مبيتها واطمئن أنها بأمان."}, {"type": "p", "text": "زمرد:"}, {"type": "p", "text": "فتاة في منتصف العشرينات، يبلغ طولها حوالي 165 سم، ذات بنية رشيقة وملامح دقيقة، بشرتها بيضاء تشوبها لمسة من السمرة، وشعرها طويل ومسترسل بلون أسود حالك، ينسدل حول وجهها البيضاوي بشكل جذاب. عيناها خضراوان كالجواهر، تعكسان ذكاءً وحذرًا دائمين. لديها وشم صغير على معصمها الأيمن، يمثل رمزًا غامضًا لا يعرف معناه إلا القليل."}, {"type": "p", "text": "زمرد تتمتع بشخصية معقدة ومتعددة الأوجه؛ فهي ذكية ومبدعة، لكنها أيضًا ماكرة وتتمتع بقدرة فائقة على التلاعب بالأحداث والناس من حولها. تعرف كيف تستخدم جمالها وسحرها لتحقيق أهدافها، ولكنها تحمل في داخلها جانبًا مظلمًا نتيجة لتجاربها الصعبة. زمرد تتميز بسرعة بديهة وقدرة فائقة على التفكير السريع تحت الضغط، مما يجعلها أحد أهم أفراد العصابة."}, {"type": "p", "text": "نشأت زمرد في ظروف صعبة، في حي فقير تسوده الجريمة والعنف. فقدت والديها في سن مبكرة، مما جعلها تعتمد على نفسها للبقاء على قيد الحياة. تعلمت فنون السرقة والخداع من صغرها، وانضمت إلى العصابة كوسيلة لحماية نفسها وتأمين مستقبلها."}, {"type": "p", "text": "رغم ظروفها القاسية، حصلت زمرد على تعليم ذاتي من خلال قراءة الكتب، مما زاد من معرفتها وقدراتها."}, {"type": "p", "text": "العشاء السري:"}, {"type": "p", "text": "وفي ذات ليلة، دعا منصور زمرد لتناول العشاء في مكان هادئ بعيدًا عن أعين الناس، جلسا تحت سماء مرصعة بالنجوم، وتحدثا عن أحلامهما وتطلعاتهما."}, {"type": "p", "text": "وكانت زمرد تكتشف جانبًا جديدًا من منصور، رجل مليء بالأمل والتفاؤل."}, {"type": "p", "text": "وفي أحد الأيام، بدأ المطر يهطل بغزارة فجأة، احتميا معًا تحت سقف صغير، ضحكا وهما يحاولان الابتعاد عن البلل، شعر كل منهما بدفء الآخر، وكانت تلك اللحظة الأولى التي شعرت فيها زمرد بأنها في مأمن من العصابة بشكل كامل مع منصور، فأخيرًا قد التقت بمن سوف يكون سببًا في حمايتها، واستنقاذها من وحل القذارة التي أوقعت نفسها فيه، فحمدت الله على أن جعل لها منصور سببًا من الأسباب التي تعينها على الحياة."}, {"type": "p", "text": "وفي ليلة هادئة، أثناء تجولهما معًا، توقفا عند حافة نهر يعكس ضوء القمر،"}, {"type": "p", "text": "واعترفا بحبهما لبعضهما البعض، وكانت الكلمات مليئة بالصدق والعاطفة."}, {"type": "p", "text": "نظر منصور في عيني زمرد وأخذته سنة من التفكير حتى قاطعته بقولها:"}, {"type": "p", "text": "ماذا بك يا منصور تحدق بي ولا تتكلم؟!"}, {"type": "p", "text": "فقال منصور في هدوء:"}, {"type": "p", "text": "تشبهين القمر في تمامه يا زمرد، فما أجملك وأنت في هذا المشهد! كالقمر المضيء في سماء مرصعة بالجواهر والحلي."}, {"type": "p", "text": "لم تستطع زمرد أن ترد على كلامه وقالت في خجل وتلعثم مغيرة الموضوع:"}, {"type": "p", "text": "ماذا تنوي أن تفعل؟"}, {"type": "p", "text": "فأجاب في ود:"}, {"type": "p", "text": "لن أفعل شيئًا سوى البقاء بجانبك."}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "نعم أرى ذلك في عينيك؛ أن لا يحول بيننا شيء إلا الموت، وأنا الأخرى أتمنى ذلك."}, {"type": "p", "text": "صمتت لبرهة بينما تنظر في عينيه نظرات توحي بالحب والقلق في آن واحد ثم أردفت قائلة:"}, {"type": "p", "text": "ولكني قصدت أمرًا آخر."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "وما هو؟!"}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "ما تنوي أن تفعل بعدما حدث معك؟!"}, {"type": "p", "text": "فنظر نظرة من يتساءل وقال:"}, {"type": "p", "text": "وما ترين أنت أن أفعل؟!"}, {"type": "p", "text": "أجابت وقد لمعت في عينيها دمعة حزن قائلة:"}, {"type": "p", "text": "تقصد الرحيل؟!"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "كان يشعر منصور أن وراء الحب ألم والتعلق فراق، وتلك سنن من سنن الله في كونه، فالفراق أمر لا تنكره العقول، ولكنها تتحايل على أسبابه ظنًا منها أن الوقت يطول وبطوله تُنسى لحظة الفراق الحاسمة، فحب من شئت فإنك حتمًا ستفارقه."}, {"type": "p", "text": "ولكن ليس هذا ما يجعله حزينًا ولكن ما يشغل تفكيره أنه يعلم في قرارة نفسه أنه ما كان ينبغي أن يصاحب أي فتاة في تجارته، فليست هذه تعاليم دينه وما تربى عليه من عادات وتقاليد."}, {"type": "p", "text": "ولكن كان مبرره هو أنه لا يريد أن يفارق زمرد، بل ولقد أوطن في نفسه عن يقين أنه سوف يتزوج بها، وهذا ما يجعله يبرر لنفسه الخروج معها، ولكنه كان في تأنيب دائم لنفسه، وخوف من أن يحدث حادث في قادم الأيام يفرقهما."}, {"type": "p", "text": "وهو لا يدري كيف بهذه السرعة قد ألف وجودها في حياته، واعتاد على رؤيتها، ربما لكونها تشبه والدته في حنانها وشخصيتها وبعض من ملامح وجهها."}, {"type": "p", "text": "وقلقه كان في محله؛ فماذا لو قد فرق بينهما شيء؟ هل يتركها بعدما علقها به وتعلق بها؟! وما ذنبها؟! ولكنه كان يجاهد في الدعاء لعل الأقدار تتجه نحو شاطئ ما تمناه يومًا، وتخيم الغيوم على أحلامه فيجد ظلالها في يوم حارق تظله بحقيقتها."}, {"type": "p", "text": "وقد عزم وقرر أنه سيرحل ويأخذها معه ويتزوجا في مسقط رأسه وموطنه الذي تربى فيه، ولكن كان للقدر حدث آخر؛ فهل سيتزوجها أم هناك أحداث أخرى تُحيل اجتماعهما إلى فرقة أبدية؟!؛ فهذا ما سوف نعرفه فيما هو قادم عزيزي القارئ."}, {"type": "p", "text": "وأشعر أنك قد تعبت من السفر والترحال في مشارق الأرض ومغاربها وما بين الماضي والحاضر لذا فلتأخذ قسطًا من الراحة ولتستأنف القراءة، ولكن لا تنسَ كوب قهوتك اللذيذ عندما ترجع."}, {"type": "p", "text": "وفي طرق المدينة القديمة وسط الأزقة وحواري البيوت؛ ونحن نتمشى نستمع لأصوات الأطفال التي تلعب أمام المنازل، ونشتم رائحة الشواء المنبعثة من نوافذها المنخفضة والعالية، تتلمس أيدينا تراب الحوائط التي اتخذ الغبار والعنكبوت بيوتًا له بين أركانها، وننظر في وجوه الناس لنرى تفاصيل المكان وعمقه، ومدى انشغال الناس وهمومها؛ ذلك الرجل العجوز الذي قعد واضعًا راحة يده اليمنى تحت ذقنه وهو ينظر لرضيع تركته أمه يأكل من خشاش الأرض بينما ذهبت هي تحدث جارتها المطلة عليها من نافذة بيتها الذي في قبالة بيت زمرد، حيث خرجت هي الأخرى تناظر جو الصباح المبكر وتتذكر كل تفاصيل تلك اللقاءات التي جمعتها بمنصور وهي تقول لنفسها:"}]}, {"id": 23, "title": "مدينة قونيا التركية (2/2)", "section": "story", "paras": [{"type": "p", "text": "لقد شعرت بالحرية لأول مرة من رباط قد قيد عنقي في طاحونة حياةٍ ما تذوقت فيها طعم الحياة، لم يكن منصور كبقية الرجال الذين قد عرفتهم طيلة حياتي؛ كان مختلفًا جدًا في كل شيء؛ في تصرفاته وأفعاله وطبعه، قبل أن يكون مختلفًا في شكله، وما جذبتني هيئته بقدر ما جذبتني روحه الطيبة."}, {"type": "p", "text": "تراني أهيم به وتمنعني أوهام الحب والإعجاب عن الحقيقة؛ وما هي إلا أوقات قلائل وتتكشف حقيقة تلك المشاعر بالتدرج، لا أدري ولعلي لن أدري حتى أقع فريسة لقلبي، ولا أتمنى ذلك، فيكفيني ما مررت به."}, {"type": "p", "text": "طال الوقت بها وهي تنظر الناس والأطفال في الزقاق ويكأنها تتحدث مع النساء وتلعب مع الأطفال ولكن تفكيرها وقلبها مشغول بمنصور؛ وهي تدرك تمام الإدراك أنه سيرحل، وترحل معه تلك المشاعر المؤقتة؛ فهي في تردد وحيرة من الذهاب معه، وتطوف الموانع بعقلها كسراب الحمائم، وهي تقول في نفسها:"}, {"type": "p", "text": "آهٍ؛ ويلي ما خرجت من إصرٍ إلا لأدخل في ثانٍ."}, {"type": "p", "text": "وهي تقصد عبء ماضيها الملوث ببكتيريا الجرائم، وحاضرها المليء بالحب والتعلق ومستقبلها المترقب لأسباب الفقد والألم."}, {"type": "p", "text": "اكت
