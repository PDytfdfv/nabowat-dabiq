شفت العصابة أن زمرد تتواصل مع منصور من حين لآخر وتجمعهما اللقاءات، فأجبروها على الابتعاد عنه، فشعرت بالخطر عليه، فقررت تحذيره بطريقة ما، ولم تكترث لتهديدهم."}, {"type": "p", "text": "وفي مضي الليل وعتمته، وخسوف القمر وظلمة السماء ولمعان النجوم، وفي تحسس الطرقات والأزقة الملتوية والطريقات الوعرة وخلو الأماكن من الخلق والأصوات فلا تسمع إلا رياح الشمال تدب دبيبها في الليلة الظلماء شاهدة ومتقصية آثار وطء أقدامها وهي تترجل بين الطرق تبغي الوصول، وكلما تقدمت خطوة زادت نبضات قلبها في الخفقان، حتى إذا تمكنت من لقاء منصور سرًا أخبرته عن تهديد العصابة، فوعدها أن يحميها، وأن يبذل قصارى جهده لإبقائها بأمان."}, {"type": "p", "text": "وقد أعدا الخطة؛ خططا لهروبٍ جريء من المدينة، مستخدمين معرفتهما بالسوق والمناطق المحيطة، كانت هناك لحظات من التوتر والخوف، ولكن كان الحب الذي بينهما والثقة الكبيرة هما الدافع الأقوى لاجتياز أي عوائق في الطريق."}, {"type": "p", "text": "ها هما يسرعان بقلب متشوق للعيش بمكان خال من المنغصات والشر، يطمحان في عالم تسوده الطيبة والهدوء والجمال، كل خطوة تقابلها لمحة من القلق، نبضات القلب تتسارع، وأنفاسهما متهدجة أثناء الهروب."}, {"type": "p", "text": "ولكنهما قد حوصرا من قبل العصابة، فأظهر منصور شجاعة وبراعة في الدفاع عنهما، بينما كانت زمرد تقف بجانبه بقوة، متحدة معه في مواجهة الخطر."}, {"type": "p", "text": "قد استطاع منصور التصدي لأولئك اللصوص وهو يعلم الخطر المترتب على ذلك، وهذا ما جعله يجد السير وزمرد حتى انتقلا إلى مدينة جديدة، حيث بدأ كل منهما حياة جديدة؛ افتتحا متجرًا صغيرًا وعملا معًا لبناء مستقبل مشرق."}, {"type": "p", "text": "وقد تزوجا وكانا يعيشان لحظات من السعادة والبناء، يتشاركان الأحلام والطموحات، ويتعلمان الاعتماد على بعضهما البعض في كل جانب من جوانب الحياة."}, {"type": "p", "text": "بعد سنوات، أصبح لديهما عائلة وأصدقاء جدد، واستطاعا بناء حياة مليئة بالحب والسلام، تذكر منصور وزمرد دائمًا تلك الأيام الخوالي وبداية قصتهما، وكيف تغلبا على الصعوبات معًا بسبب التمسك ببعضهما والإصرار."}, {"type": "p", "text": "جلسا معًا في حديقة منزلهما، ينظران إلى غروب الشمس ويتحدثان عن مستقبلهما وحبهما الذي أثمر عن حياة جديدة ومليئة بالفرح والأمل، وانتهت قصتهما بأجمل نهاية."}, {"type": "p", "text": "ثم استيقظ منصور من نومه وتحين للرجوع إلى موطنه. نعم عزيزي القارئ لم تنته القصة بعد، فقد كان حلمًا سعيدًا تمناه منصور والحقيقة غير ذلك؛ فتعال معي لنعرف تفاصيل الحقيقة."}, {"type": "p", "text": "نعم كل تلك المشاعر الجميلة ما كانت إلا حلمًا كان بمثابة الهدوء الذي يسبق العاصفة."}, {"type": "p", "text": "ذهب منصور إلى بيت زمرد لكي يخبرها بأن تأتي معه تاركًا تلك الأرض؛ وفي حزن وهمٍّ وقف أمام البيت ونادى، فخرجت زمرد من بيتها ممسكة بطرف الباب وعلى لسانها أطراف الحديث، ثم نظرت إليه فعلمت أنه سوف يرحل؛ وفي حزن"}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "سوف تذهب؟!"}, {"type": "p", "text": "لقد حان موعد الرحيل يا زمرد؛ قالها في حزن."}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "الآن؟!"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "نعم، هل تودين الإتيان معي فسوف أذهب ولن أعود؟!."}, {"type": "p", "text": "لكن زمرد ما كانت لتترك المكان الذي تربت به، حيث منعها من الذهاب أمر آخر لا يعلمه منصور، ولم تفصح به،"}, {"type": "p", "text": "تريدين شيئًا قبل أن أرحل."}, {"type": "p", "text": "قالها منصور بعد أن رأى الحزن في عينيها وعدم قدرتها على الكلام، ثم تحاملت على نفسها وقالت له:"}, {"type": "p", "text": "أريد أن اطمئن عليك."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "اطمئني علي ولا تخافي فإني على دراية في تدبير أموري فقط......."}, {"type": "p", "text": "طرأت لحظة من الصمت، ثم نظر إليها وقال:"}, {"type": "p", "text": "فقط لا أريد إلا أن تكوني بخير وفي أمان."}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "لا تقلق عليّ إن شاء الله سوف أكون على ما يرام، لا تقلق بشأني."}, {"type": "p", "text": "ثم انصرف وهو حزين وفي عجل، لا يريدها أن تشعر بحزن الفقد تجاهه وهو يذهب، ولعله لن يلتقيها ثانيًا."}, {"type": "p", "text": "لم تنظر وراءها وهي ترجع للوراء مغلقة الباب وجلست وظهرها يستند عليه وهي تبكي على ذهابه."}, {"type": "p", "text": "\"أحبب من شئت فإنك مفارقه؛ هكذا هي الدنيا لن تدوم لك ولن يدوم لك أحد فيها. ولن تدوم أنت لأحد؛ فالكل راحل في نهاية المطاف\"."}, {"type": "p", "text": "فتحت الباب ثانيًا، نظرت إليه وهو يذهب أمام ناظريها ثم أذرفت الدمع في حزن وقالت:"}, {"type": "p", "text": "سوف انتظر عودتك."}, {"type": "p", "text": "على مشارف الوطن كل شيء يبدو قاحلًا، ضوء الشمس حارق وشعاعه في الأفق مسترسل في الأزقة والحواري والطرقات، في نهار سماءه صافية، ويوم جديد قد اطلع فيه منصور بنايات المدينة من بعيد، وتزاحمت في فؤاده مشاعر الشوق مختلطة بالحزن وشعور الفقد؛ شوقه على والدته التي قد افتقدها منذ زمن وقد شغله العمل عنها."}, {"type": "p", "text": "عاد منصور تاركًا وراءه كل شيء: صديق عمره الذي لم يجد إلا إياه أنيس غربته على أرض تلك المدينة، بضاعته التي سرقت والفتاة التي قد أحبها وتعلق بها."}, {"type": "p", "text": "ولما وصل منصور إلى قريته استوقفه أحد الأطفال عندما اقترب من بيتهم، فأخبره بأن أمه مريضة، ما أن سمع الخبر حتى جرى بكل قوته لكي يرى ماذا حدث، دخل البيت وبحث عن أمه فوجدها في غرفتها وهي طريحة الفراش، ووجد أباه واقفًا فوق رأسها."}, {"type": "p", "text": "لما رآها اغرورقت بالدموع عيناه دونما إرادة منه، أمسك بيديها فقبلها ثم وضع قبلة على جبينها."}, {"type": "p", "text": "نظرت إليه ثم قالت:"}, {"type": "p", "text": "عدت يا بني!"}, {"type": "p", "text": "نعم عدت يا أماه، وليتني ما عدت لكي لا أراك في مثل هذه الحال."}, {"type": "p", "text": ": لا باس عليك يا بني فأنا بخير والحمد لله."}, {"type": "p", "text": "ثم نظرت إليه مبتسمة وربتت على رأسه وقالت:"}, {"type": "p", "text": "ياعزيزي إنما المرض آلة الطهر التي صنعها الله لنا لكي تنقينا وتنتشلنا من بحر معاصينا؛ هي الممحاة التي تجلو الآثام من قلوبنا، وإنما موطني هذا موطن سرور فافرح لي؛ لأن الله يحبني ولولا أنه يحبني ما ابتلاني، فكن راضيًا غير قلق عليَّ."}, {"type": "p", "text": "\"قد يتحمل الإنسان ضربة أو اثنتين ولكن إذا توالت الضربات في وقت واحد فإنه حتمًا سيسقط أرضًا؛ من ضعف النفس وحيرة العقل وتشتت الذهن، لا يجد ملجأ أو مدخلًا يولي إليه وجهه، فيظل قابعًا في همومه تلك ما لم يقصد طريق النجاة؛ وإن للنجاة طريقًا ميسرًا سهلًا، قد يكون أمام الواحد منا ولكن قد عميت البصيرة بسبب تعلقه بغيره؛ فلا تتعلق بالفاني لكي لا تفنى وتعلق بالباقي لتحيا\"."}, {"type": "p", "text": "جميلة"}, {"type": "p", "text": "تدعى أم منصور في منطقتها واسمها جميلة، هي امرأة كبيرة في السن، تتميز بطولها المعتدل وجسمها الممتلئ قليلًا، تشع بشعرها الفضي الطويل الذي يتدلى على كتفيها، وعينيها الخضراوين اللتين تحكيان قصص الزمن الغابر، وجهها مليء بالتجاعيد التي تروي حكايات سنوات من الكفاح والعمل الشاق."}, {"type": "p", "text": "في شبابها، كانت جميلة معروفة بجمالها اللافت، ولكن مع مرور الزمن، اكتسبت ملامحها قوة ووقارًا يعكسان تجاربها وحكمتها، ترتدي عادة ملابس تقليدية بسيطة مصنوعة من القطن، وغالبًا ما تغطي رأسها بوشاح حريري مزخرف بألوان زاهية."}, {"type": "p", "text": "تُعرف جميلة بين أهل قريتها بحنانها وكرمها، فدائمًا ما تكون حاضرة لمساعدة الآخرين وتقديم النصائح بحكمة، هي امرأة قوية وشجاعة، لم تنكسر أمام صعوبات الحياة، بل واجهتها بثبات وإصرار، تُرى دائمًا وهي تعمل في الحقول أو تطبخ لأفراد أسرتها، حيث تتقن إعداد الأطباق التقليدية ببراعة."}, {"type": "p", "text": "جميلة تتحدث بصوت هادئ ومريح، لكن كلامها يحمل قوة وعمقًا، تستخدم لهجة أهل قريتها وتعابيرها التقليدية التي تنقل حكمة الأجيال، في حديثها، تذكر قصصًا من الماضي وأمثالًا شعبية تعكس ثقافة وتراث منطقتها."}, {"type": "p", "text": "داخلها، تحمل خليطًا من الفخر والحنان، وخوفًا على مستقبل ابنها منصور. لطالما كانت تفكر في كيفية تأمين حياة أفضل له، وتريد أن يتزوج وينجب وترى أطفاله، متذكرة سنوات الفقر والجوع التي عانتها في شبابها، مشاعرها الداخلية تتراوح بين الأمل والقلق، وبين الذكريات السعيدة والأوقات العصيبة."}, {"type": "p", "text": "نشأت جميلة في أسرة فقيرة، واضطرت للعمل منذ صغرها لتساعد في تأمين لقمة العيش. تجربة الفقر والجوع صنعت منها امرأة قوية ومستقلة. تزوجت صغيرة، ما جعلها تتحمل مسئولية تربية ابنها وحدها."}, {"type": "p", "text": "تُظهر حنانها ورعايتها من خلال تفاعلها مع الآخرين، فهي تستمع إلى مشاكلهم وتقدم يد العون دون تردد. مع ابنها منصور؛ كانت دائمًا مثالًا للأم الصبورة والمضحية، وعلّمته قيم العمل الجاد والكرم."}, {"type": "p", "text": "نترك منصور وأمه ونتجه لمدينة قونيا حيث نرى الشيخ علاء الدين وهو جالس بعد صلاة العصر يعظ الناس ويذكرهم بتقوى الله؛ ثم شرع في ما كان قد بدأ."}]}, {"id": 24, "title": "جزيرة الدجال (1/2)", "section": "story", "paras": [{"type": "p", "text": "بعد مغرب الشمس"}, {"type": "p", "text": "وفي ليل سماؤه ظلماء وقمره مختفٍ تمامًا؛ وفي مشهد مهيب يجعل الناظر يتوقف من الصدمة، ذلك الدخان الذي يحيط المكان، الرائحة غريبة، لا نرى شيئًا من حيث نستمع لخطوات تتسارع، شعرنا بالخوف قليلًا وكنا نريد الرجوع ولكن الجو لا يسمح بذلك."}, {"type": "p", "text": "ها قد توقفنا جميعًا في ذهول عندما رأينا تلك الدابة الغريبة، وخفنا أن تكون شيطانًا أو حيوانًا مفترسًا."}, {"type": "p", "text": "فقلنا:"}, {"type": "p", "text": "ويلك ما أنت؟!"}, {"type": "p", "text": "أجابت في صوت غريب مخيف:"}, {"type": "p", "text": "أنا الجساسة"}, {"type": "p", "text": "قلنا وما الجساسة؟!"}, {"type": "p", "text": "لم تعرب عن نفسها ولم تجبنا في ماهيتها بشيء نطمئن به، ولكنها دلتنا على شخص ينتظرنا داخل الدير فقالت:"}, {"type": "p", "text": "أيها القوم انطلقوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "لما سمت لنا ذلك الرجل بالدير فرقنا^18، منها أن تكون شيطانة."}, {"type": "p", "text": "فانطلقنا مسرعين اتقاء ذلك الكائن الغريب، حتى دخلنا الدير،"}, {"type": "p", "text": "كنا خائفين محتارين مما شهدنا وفي ذهول من ذلك المكان، حتى دخلنا الدير، كهف داخل جزيرة، يشبه بعض الأديرة من الداخل، له اتساع كبير ولكنه يبدو مهجورًا، قلت في نفسي:"}, {"type": "p", "text": "\"كيف يجلس إنسان في هذا المكان القديم المتروك\"؟!"}, {"type": "p", "text": "وإذا بنا في عالم من التفكير فيما نحن فيه، ومن ذا يكون الذي يطلبنا في هذا المكان.. ونحن كذلك إذا فيه أعظم إنسان رأيناه قط خلقًا وأشدهم وثاقًا."}, {"type": "p", "text": "رجل عظيم الجسد، ممسوخ الخلقة ذو وجه فظ كبير، عيناه بهما عور، أي بهما عيب في كلتاهما، عينه اليمنى ممسوحة غير ناتئة، مطموسة لا يرى بها، والأخرى ناتئة بارزة طافية كعنقود عنب برزت منه حبة؛ فهي بمجموعها كبلورة زجاجة لونها أخضر، وعليها ظفرة غليظة^19 ولا يرى إلا بها."}, {"type": "p", "text": "وذو رأس كأنه أصلة^20، وشعر رأسه كأنه أغصان شجرة وهو جفال الشعر^21 وهو حبك^22، قطط^23، متكسر نازلًا على جسده."}, {"type": "p", "text": "ولونه أقمر^24 هجانا^25"}, {"type": "p", "text": "جسده فيلمانيا أو بيلمانيا أي ضخم الجثة، قصير الطول وأفحج بين رجليه أي إذا مشى قدماه بعيدة عن بعض."}, {"type": "p", "text": "خلقته رجس على رجس، مجموعة يداه إلى عنقه ما بين ركبتيه إلى كعبيه بالحديد."}, {"type": "p", "text": "نترك قونيا والشيخ علاء الدين لننطلق إلى أنقرة لنعرف ما فعل منصور وما مصير الأحداث آن ذاك فلتتابع عزيزي القارئ....."}, {"type": "p", "text": "في مدينة أنقرة التركية"}, {"type": "p", "text": "الساعة الثالثة عصرًا:"}, {"type": "p", "text": "كانت أنقرة تغرق في وهج الظهيرة، والشمس تنثر أشعتها الحارقة بلا هوادة، بدا الغمام في الأفق كظل باهت يراوغ عين الناظر، ولكنه لم يخفف من وطأة الحر، وسط هذا الجو اللاهب، ومن طرف الطريق، ظهر رجل يسعى ببطء، متعثر الخطى، كأنه يحمل ثقل العالم على كتفيه."}, {"type": "p", "text": "منصور، الذي كان واقفًا تحت شجرة قليلة الظل، رأى الرجل قادمًا من بعيد. خيل إليه أنه يعرف تلك الخطى المتعبة، وأنها تحمل في طياتها قصة قديمة. ظن أنه أمير، صديقه الذي فارقه منذ زمن، ولكنه لم يصدق عينيه حتى اقترب الرجل أكثر. وعندما تأكد من هويته، تملكه شعور عارم بالفرح، عانقه بحرارة، وكأن الزمن لم يمر بينهما."}, {"type": "p", "text": "قال منصور، وهو يحاول أن يلتقط أنفاسه من شدة التأثر:"}, {"type": "p", "text": "\"كيف حالك يا أمير؟ طمئنّي عليك\"؟"}, {"type": "p", "text": "صمت أمير قليلًا، وعيناه تبحثان في الأفق عن شيء مفقود، ثم قال بصوت هادئ مشوب بالحزن:"}, {"type": "p", "text": "\"إنني بخير، والحمد لله\"."}, {"type": "p", "text": "لكن منصور، الذي عرف صديقه منذ زمن، شعر أن ثمة أمرًا خفيًا يثقل كاهله. فاقترب منه أكثر، وقال بلهفة:"}, {"type": "p", "text": "\"ماذا هناك يا أمير؟ ماذا حدث؟ هل حدث مكروه لأحد؟ وكيف حال زمرد؟ هل رأيتها\"؟"}, {"type": "p", "text": "أجاب أمير بصوت متهدج، وقد ارتسمت على وجهه علامات الحزن والضيق:"}, {"type": "p", "text": "\"قتلت\"!!"}, {"type": "p", "text": "تسمر منصور في مكانه، غير مصدق لما سمع. قال بصوت مرتجف:"}, {"type": "p", "text": "\"أعد عليَّ ما قلت\"."}, {"type": "p", "text": "أجاب أمير بنبرة حزن وقلق:"}, {"type": "p", "text": "\"لقد قتلها اللصوص الذين سرقونا قبل ذلك. لما تيقنوا أنها لم تعد كما كانت معهم في السابق، وأنها أصبحت تعرفنا ولها علاقة بنا. ولكن سبب القتل غير ذلك\"."}, {"type": "p", "text": "أمسك منصور بذراعي أمير، وقال بانفعال:"}, {"type": "p", "text": "\"وما السبب يا أمير؟ ما السبب يا صديقي\"؟!"}, {"type": "p", "text": "تنهد أمير وقال:"}, {"type": "p", "text": "\"ضغطوا عليها لتعود للعمل معهم، فرفضت. حذروها، فتمادت في الهروب منهم. أمسكوا بها وقتلوها\"."}, {"type": "p", "text": "تركه منصور وابتعد، يمشي بخطى مثقلة بالصدمة والحزن، وقال لنفسه بصوت مسموع:"}, {"type": "p", "text": "\"ماتت؟!!!... كل ذلك بسببي، ما كان ينبغي عليَّ أن أتركها وأرحل\"."}, {"type": "p", "text": "لحق به أمير، وأمسك بذراعيه وقال:"}, {"type": "p", "text": "\"كادوا يقتلونني أو يحبسوني عندهم أنا الآخر لولا أني جئت فارًا من هناك. لا مال لدي، فما كان مني إلا أن تحسست طريق العودة\"."}, {"type": "p", "text": "لم يرد منصور، ومضى في طريقه، شارد الذهن، غير منتبه لما قاله أمير."}, {"type": "p", "text": "\"لا بد أن تفقد في هذه الحياة بعض الأشياء، أو الأشخاص؛ هذه رسالة لك فحواها: لا يجب أن تتعلق بأحد؛ فحب من تشاء وما تشاء، ولكن عليك أن تعرف أن ثمة يومًا وكل شيء راحل\"."}, {"type": "p", "text": "كان منصور جالسًا ناحية الضفة، يتأمل البحر، صامتًا، يغمره الحزن. أثناء ذلك، أتى صديقه أمير، فنظر إليه من مجلسه، فقام واحتضنه، ثم بكى وقال:"}, {"type": "p", "text": "\"إن حالي لا يسر أحدًا، كما تراني حزينًا\"."}, {"type": "p", "text": "فقال له أمير:"}, {"type": "p", "text": "\"ارفق بحالك، فإلى متى تظل هكذا\"؟!"}, {"type": "p", "text": "أجابه منصور:"}, {"type": "p", "text": "\"لا أعرف، ولكن ما مررت به كان صعبًا عليَّ\"."}, {"type": "p", "text": "قال له أمير:"}, {"type": "p", "text": "\"لا عليك، دعك من كل ذلك. عليك أن تخرج مما أنت فيه من الكآبة والحزن. كلنا مهما طال بنا المكوث فسوف نرحل لا محالة\"."}, {"type": "p", "text": "نترك منصور قابعًا في حزنه على فقد زمرد ونذهب إلى قونيا لكي نسمع ذلك الكلام العجيب الذي ذكره الشيخ علاء الدين على لسان الصحابي تميم الداري:"}, {"type": "p", "text": "وسط البحر - جزيرة الدجال فجرًا:"}, {"type": "p", "text": "ذهول يبدو على أعين القوم، تساؤلات تسقط على الأفئدة كالسهام، ولحظات من الصمت يقطعها أحدنا بقوله لذلك الكائن ونحن في إثره:"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "ويلك من أنت؟"}, {"type": "p", "text": "لم يجب عن سؤالنا كما فعلت الدابة من قبل، ولكنه نظر إلينا ولولا أنه مقيد لما استطعنا محاورته من خوفنا على أنفسنا:"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "قد قدرتم على خبري، فأخبروني من أنتم؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين «اغتلم»."}, {"type": "p", "text": "فلعب بنا الموج شهرًا، ثم «أرفأنا»."}, {"type": "p", "text": "فجلسنا في أقربها، ولما دخلنا الجزيرة استقبلتنا دابة كثيرة الشعر، لا تدري ما قُبلها من دبرها من كثرة الشعر."}, {"type": "p", "text": "فقلنا:"}, {"type": "p", "text": "ويلك من أنت؟"}, {"type": "p", "text": "فقالت:"}, {"type": "p", "text": "أنا الجساسة."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "وما الجساسة؟"}, {"type": "p", "text": "قالت:"}, {"type": "p", "text": "اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق."}, {"type": "p", "text": "فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "أخبروني عن نخل بيسان."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أسألكم عن نخلها، هل يثمر؟"}, {"type": "p", "text": "قلنا له:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "فلما أخبرناه بذلك، وثب وثبة كاد أن يخرج من الجدار"}, {"type": "p", "text": "ثم قال:"}, {"type": "p", "text": "أما لو قد أذن لي في الخروج"}, {"type": "p", "text": "لوطئت البلاد كلها غير طيبة، ثم نظر إلينا بعد أن هدأ من وثبته وقال: أما إنه يوشك أن لا يثمر."}]}, {"id": 25, "title": "جزيرة الدجال (2/2)", "section": "story", "paras": [{"type": "p", "text": "قال:"}, {"type": "p", "text": "أخبروني عن بحيرة الطبرية."}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "هل فيها ماء؟"}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "هي كثيرة الماء."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أما إن ماءها يوشك أن يذهب."}, {"type": "p", "text": "فقال:"}, {"type": "p", "text": "أخبروني عن عين زغر."}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "عن أي شأنها تستخبر؟"}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "هل في العين ماء؟ وهل يزرع أهلها بماء العين؟"}, {"type": "p", "text": "قلنا له:"}, {"type": "p", "text": "نعم، هي كثيرة الماء، وأهلها يزرعون من مائها."}, {"type": "p", "text": "فلما أخبرناه عن شأنها وثب وثبة كاد أن يخرج من وراء الجدار."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أخبروني عن نبي الأميين ما فعل؟"}, {"type": "p", "text": "قالوا:"}, {"type": "p", "text": "قد خرج من مكة ونزل يثرب."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أقاتله العرب؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "كيف صنع بهم؟"}, {"type": "p", "text": "فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه."}, {"type": "p", "text": "قال لهم:"}, {"type": "p", "text": "قد كان ذلك؟"}, {"type": "p", "text": "قلنا:"}, {"type": "p", "text": "نعم."}, {"type": "p", "text": "قال:"}, {"type": "p", "text": "أما إن ذلك خير لهم أن يطيعوه."}, {"type": "p", "text": "وإني مخبركم عني، إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة."}, {"type": "p", "text": "فهما محرمتان عليّ كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها."}, {"type": "p", "text": "ها قد طلعت الشمس وفج الضوء من كل مكان، وكانت السماء صافية والجو صافٍ."}, {"type": "p", "text": "لقد ركبنا سفينتنا وانطلقنا سراعًا كما عدنا تاركين وراءنا ذلك المخلوق العجيب، وتلك الجزيرة الغريبة ونحن لا ندري كيف يكون طريق العودة."}, {"type": "p", "text": "لقد وقع في نفسي إيما إيقاع وتملك قلبي ذلك الخبر حتى طغى على عقلي التفكير فيه حيث لا مكان لغيره ليجد طريقه ليزاحم ذلك الذي حدث."}, {"type": "p", "text": "أما وإنه قد حدث ما حدث فإن ذلك كان برهانًا على صدق ذلك النبي؛ رسول الأميين، وإنني إن لم أصدق به لأكونن من الخاسرين."}, {"type": "p", "text": "عزمت أمري واستقر على الذهاب نحو المدينة لأسلم أمري لرسول الله وهذا إن قدر الله لي الرجوع إلى بلادي."}, {"type": "p", "text": "أخذ منا طريق العودة أقل مما أخذت الرحلة وقد وصلنا بعد أيام قلائل، وكانت تلك الأيام غير التي عهدناها قبل انتهاء تلك الرحلة، أيامًا لا رعود فيها ولا برق والموج هادئ، ولكنا لم نقدر على تمييز الطريق، فلا ندري من أي الطرق جئنا ويكأننا خرجنا من فوهة زمنية."}, {"type": "p", "text": "وصلنا الوطن بعد رحلة طويلة، قد رأينا فيها عجائب الأمور وغرائبها، بعد ذاك جمعت أمتعتي وخرجت باتجاه المدينة لأبايع «النبي صلى الله عليه وسلم» وأسلم وأتبع هذا الدين."}, {"type": "p", "text": "انتهى الشيخ علاء من درس اليوم الذي أخبرهم فيه بعضًا من قصة تميم الداري وقومه، ولكن كيف ستتغير الأمور بعد هذه اللحظة؟!"}, {"type": "p", "text": "سنعرف ذلك عزيزي القارئ عندما نتابع القراءة لننتقل إلى مدينة أنقرة؛ لذا فلتحضر فنجان قهوتك ولتكمل الرحلة."}, {"type": "p", "text": "تركيا- أنقرة"}, {"type": "p", "text": "بلباس من الحزن، وأسى القلب، تلك الملامح المجهدة، من واقع الحياة، وشدة العيش، ووفاة الأقارب، وتذكر الماضي، وتفكر المستقبل؛ كل ذلك الألم جعل منصور يتوقف عن أشياء كثيرة حتى العمل."}, {"type": "p", "text": "لقد كلمه أباه في أمر الخروج للعمل؛ لما رأى في خروجه للعمل ما سوف يجعله يخرج من الحالة التي هو فيها، فقد طال الوقت وهو كذلك."}, {"type": "p", "text": "\"أحيانًا لا بد أن نجد شيئًا يخرجنا من حزننا، ربما يحتاج الإنسان إلى ما يشغل تفكيره كما يحتاج إلى العزلة في بعض الأوقات\"."}, {"type": "p", "text": "من يكون أبو منصور «الحلاج»؟!!"}, {"type": "p", "text": "الحلاج:"}, {"type": "p", "text": "رجل عجوز تجاوز السبعين من عمره، يبلغ طوله حوالي 170 سم، ذو بنية نحيلة وملامح وجه مليئة بالتجاعيد التي تروي حكايات عمر طويل من التجارب. بشرته سمراء تشوبها علامات الزمن، وشعره أبيض كالثلج، ولحيته الطويلة تزيده وقارًا. عيناه رماديتان باهتتان، تحملان نظرة تأمل وحكمة عميقة، وتظهر في بعض الأحيان بريقًا من الشغف القديم. يمشي مستندًا على عصا خشبية منحوتة بعناية، تحمل نقوشًا تذكارية من أيام شبابه."}, {"type": "p", "text": "الحلاج يتمتع بشخصية هادئة ومتزنة، عرف بالحنكة والحكمة التي اكتسبها من سنوات طويلة قضاها في التجارة والتنقل بين البلدان. كان يمتاز بذكاء خارق وفطنة جعلته واحدًا من أنجح التجار في زمانه، لكنه كان أيضًا يتمتع بنزاهة وكرم جعلا الجميع يثقون به ويحترمونه. في شبابه، كان معروفًا بشجاعته وروح المغامرة، لكن مع تقدم العمر، أصبح أكثر ميلًا للتأمل والفلسفة."}, {"type": "p", "text": "نشأ الحلاج في
